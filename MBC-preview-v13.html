re></div><h2 id=\"_04-try-it-yourself\" tabindex=\"-1\">04 / Try it yourself <a class=\"header-anchor\" href=\"#_04-try-it-yourself\" aria-label=\"Permalink to &quot;04 / Try it yourself&quot;\">​</a></h2><p>Change the simulated distance from <code>150</code> to <code>300</code>. With a <code>200</code> mm threshold, the result changes to “Path clear”. A value exactly equal to <code>200</code> is also clear because the comparison uses <code>&lt;</code>.</p><h2 id=\"troubleshooting\" tabindex=\"-1\">Troubleshooting <a class=\"header-anchor\" href=\"#troubleshooting\" aria-label=\"Permalink to &quot;Troubleshooting&quot;\">​</a></h2><table tabindex=\"0\"><thead><tr><th>Situation</th><th>Check</th></tr></thead><tbody><tr><td>No real readings</td><td>This demo uses simulation. Add the official driver first.</td></tr><tr><td>Cannot find a block</td><td>Product extensions are pending; this is a conceptual sequence.</td></tr><tr><td>Unexpected units</td><td>Confirm the driver returns mm before comparing values.</td></tr></tbody></table><p><a href=\"/mbc-docs/en/\">Return home and choose another path</a></p></div></div></main><!----><!--[--><!--]--></div></div></div><!--[--><!--]--></div></div><!----><!--[--><!--]--></div></div>\n    \n    \n  ", "/en/products/S8/spike-block.html": "\n    <div id=\"app\"><div class=\"Layout\" data-v-99598d5d><!--[--><!--]--><!--[--><span tabindex=\"-1\" data-v-68b79384></span><a href=\"#VPContent\" class=\"VPSkipLink visually-hidden\" data-v-68b79384>Skip to content</a><!--]--><!----><header class=\"VPNav\" data-v-99598d5d data-v-b30964d7><div class=\"VPNavBar\" data-v-b30964d7 data-v-a57f7b4c><div class=\"wrapper\" data-v-a57f7b4c><div class=\"container\" data-v-a57f7b4c><div class=\"title\" data-v-a57f7b4c><div class=\"VPNavBarTitle\" data-v-a57f7b4c data-v-95edfb70><a class=\"title\" href=\"/mbc-docs/en/\" data-v-95edfb70><!--[--><!--]--><!--[--><img class=\"VPImage logo\" src=\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53M a-v-a57f7b4c><div class=\"divider-line\" data-v-a57f7b4c></div></div></div><!----></header><div class=\"VPLocalNav empty fixed\" data-v-99598d5d data-v-6325a854><div class=\"container\" data-v-6325a854><!----><div class=\"VPLocalNavOutlineDropdown\" style=\"--vp-vh:0px;\" data-v-6325a854 data-v-270df66f><button data-v-270df66f>Return to top</button><!----></div></div></div><!----><div class=\"VPContent\" id=\"VPContent\" data-v-99598d5d data-v-e9feca6f><div class=\"VPDoc has-aside\" data-v-e9feca6f data-v-220728f0><!--[--><!--]--><div class=\"container\" data-v-220728f0><div class=\"aside\" data-v-220728f0><div class=\"aside-curtain\" data-v-220728f0></div><div class=\"aside-container\" data-v-220728f0><div class=\"aside-content\" data-v-220728f0><div class=\"VPDocAside\" data-v-220728f0 data-v-e1b13a4a><!--[--><!--]--><!--[--><!--]--><nav aria-labelledby=\"doc-outline-aria-label\" class=\"VPDocAsideOutline\" data-v-e1b13a4a data-v-9edb41bb><div class=\"content\" data-v-9edb41bb><div class=\"outline-marker\" data-v-9edb41bb></div><div aria-level=\"2\" class=\"outline-title\" id=\"doc-outline-aria-label\" role=\"heading\" data-v-9edb41bb>On this page</div><ul class=\"VPDocOutlineItem root\" data-v-9edb41bb data-v-a20af3d2><!--[--><!--]--></ul></div></nav><!--[--><!--]--><div class=\"spacer\" data-v-e1b13a4a></div><!--[--><!--]--><!----><!--[--><!--]--><!--[--><!--]--></div></div></div></div><div class=\"content\" data-v-220728f0><div class=\"content-container\" data-v-220728f0><!--[--><!--]--><main class=\"main\" data-v-220728f0><div style=\"position:relative;\" class=\"vp-doc _mbc-docs_en_products_S8_spike-block\" data-v-220728f0><div><h1 id=\"mbc-line-following-sensor-s8-·-spike-·-pybricks-block\" tabindex=\"-1\">MBC Line-Following Sensor S8 · SPIKE · Pybricks Block <a class=\"header-anchor\" href=\"#mbc-line-following-sensor-s8-·-spike-·-pybricks-block\" aria-label=\"Permalink to &quot;MBC Line-Following Sensor S8 · SPIKE · Pybricks Block&quot;\">​</a></h1><h2 id=\"product-introduction\" tabindex=\"-1\">Product introduction <a class=\"header-anchor\" href=\"#product-introduction\" aria-label=\"Permalink to &quot;Product introduction&quot;\">​</a></h2><p>Explore distance readings, then use conditions to build your first sensing workflow.</p><div class=\"warning custom-block\"><p class=\"custom-block-title\">Product documentation preview</p><p>The product name and learning flow are illustrative. Measurement range, connectors, drivers and supported environments await confirmation. Examples are not production hardware code.</p></div><div class=\"feature-grid\"><div class=\"feature-box\"><strong>Sense distance</strong><small>Learn the basics of reading values and evaluating distance.</small></div><div class=\"feature-box\"><strong>React with code</strong><small>Use a threshold to define your robot’s response.</small></div><div class=\"feature-box\"><strong>Learn step by step</strong><small>Follow a guide for your controller and environment.</small></div></div><h3 id=\"product-overview\" tabindex=\"-1\">Product overview <a class=\"header-anchor\" href=\"#product-overview\" aria-label=\"Permalink to &quot;Product overview&quot;\">​</a></h3><p>Distance sensing can support obstacle detection, proximity feedback and spacing control. Read a value, evaluate a condition and trigger an appropriate action.</p><table tabindex=\"0\"><thead><tr><th>Item</th><th>Status</th></tr></thead><tbody><tr><td>Model / product photo</td><td>Awaiting client assets</td></tr><tr><td>Measurement range / accuracy</td><td>Awaiting specifications</td></tr><tr><td>Connector / protocol</td><td>Awaiting hardware details</td></tr><tr><td>EV3 / SPIKE compatibility</td><td>Driver and firmware verification required</td></tr><tr><td>Programming environment</td><td>Four demonstration learning paths</td></tr></tbody></table><h3 id=\"before-you-begin\" tabindex=\"-1\">Before you begin <a class=\"header-anchor\" href=\"#before-you-begin\" aria-label=\"Permalink to &quot;Before you begin&quot;\">​</a></h3><ol><li>Confirm your product version and controller. Follow the official wiring diagram.</li><li>Install the required programming environment and product driver.</li><li>Check raw readings before adding conditions or motor control.</li></ol><div class=\"tip custom-block\"><p class=\"custom-block-title\">Start with a reading</p><p>Begin by displaying a value. Confirm its units and stability before testing threshold logic. Wiring diagrams and driver links will be added when supplied.</p></div><h3 id=\"applications\" tabindex=\"-1\">Applications <a class=\"header-anchor\" href=\"#applications\" aria-label=\"Permalink to &quot;Applications&quot;\">​</a></h3><ul><li><strong>Obstacle detection</strong>: stop or turn when a reading is below a threshold.</li><li><strong>Proximity feedback</strong>: show a message or sound based on distance.</li><li><strong>Spacing control</strong>: use continuous readings as an input to your control logic.</li></ul><h2 id=\"your-tutorial-·-spike-·-pybricks-block\" tabindex=\"-1\">Your tutorial · SPIKE · Pybricks Block <a class=\"header-anchor\" href=\"#your-tutorial-·-spike-·-pybricks-block\" aria-label=\"Permalink to &quot;Your tutorial · SPIKE · Pybricks Block&quot;\">​</a></h2><p>Learn to read, display and evaluate a distance value.</p><div class=\"warning custom-block\"><p class=\"custom-block-title\">Demonstration guide</p><p>The product driver and API are not available yet. The sample below uses simulated readings; it does not communicate with a sensor. Product compatibility must be verified before use.</p></div><h2 id=\"_01-prepare-your-environment\" tabindex=\"-1\">01 / Prepare your environment <a class=\"header-anchor\" href=\"#_01-prepare-your-environment\" aria-label=\"Permalink to &quot;01 / Prepare your environment&quot;\">​</a></h2><p>Prepare a SPIKE controller and the corresponding Pybricks environment. Verify driver and firmware requirements before changing firmware.</p><ol><li>Obtain the product wiring diagram and driver.</li><li>Confirm the port and measurement unit.</li><li>Begin with a single reading before adding a loop.</li></ol><h2 id=\"_02-function-concepts\" tabindex=\"-1\">02 / Function concepts <a class=\"header-anchor\" href=\"#_02-function-concepts\" aria-label=\"Permalink to &quot;02 / Function concepts&quot;\">​</a></h2><table tabindex=\"0\"><thead><tr><th>Concept</th><th>Demonstration function</th><th>Result</th></tr></thead><tbody><tr><td>Read a value</td><td><code>read_demo_distance()</code></td><td>Simulated distance in mm</td></tr><tr><td>Compare a threshold</td><td><code>is_near(distance_mm, threshold_mm)</code></td><td>Boolean result</td></tr><tr><td>Display feedback</td><td><code>print(message)</code></td><td>Console message</td></tr></tbody></table><p>These names belong to this example, not the product API. Replace the simulated reader with the official driver after confirmation.</p><h2 id=\"example\">03 / Example program</h2><p>This is a conceptual block sequence. The official product extension and importable project will be added when available.</p><div class=\"block-flow\"><div>When program starts</div><div>Set threshold to 200 mm</div><div>Set simulated distance to 150 mm</div><div>If distance &lt; threshold</div><div>Display “Object nearby”</div></div><h2 id=\"_04-try-it-yourself\" tabindex=\"-1\">04 / Try it yourself <a class=\"header-anchor\" href=\"#_04-try-it-yourself\" aria-label=\"Permalink to &quot;04 / Try it yourself&quot;\">​</a></h2><p>Change the simulated distance from <code>150</code> to <code>300</code>. With a <code>200</code> mm threshold, the result changes to “Path clear”. A value exactly equal to <code>200</code> is also clear because the comparison uses <code>&lt;</code>.</p><h2 id=\"troubleshooting\" tabindex=\"-1\">Troubleshooting <a class=\"header-anchor\" href=\"#troubleshooting\" aria-label=\"Permalink to &quot;Troubleshooting&quot;\">​</a></h2><table tabindex=\"0\"><thead><tr><th>Situation</th><th>Check</th></tr></thead><tbody><tr><td>No real readings</td><td>This demo uses simulation. Add the official driver first.</td></tr><tr><td>Cannot find a block</td><td>Product extensions are pending; this is a conceptual sequence.</td></tr><tr><td>Unexpected units</td><td>Confirm the driver returns mm before comparing values.</td></tr></tbody></table><p><a href=\"/mbc-docs/en/\">Return home and choose another path</a></p></div></div></main><!----><!--[--><!--]--></div></div></div><!--[--><!--]--></div></div><!----><!--[--><!--]--></div></div>\n    \n    \n  ", "/en/products/S8/ev3-clev3r.html": "\n    <div id=\"app\"><div class=\"Layout\" data-v-99598d5d><!--[--><!--]--><!--[--><span tabindex=\"-1\" data-v-68b79384></span><a href=\"#VPContent\" class=\"VPSkipLink visually-hidden\" data-v-68b79384>Skip to content</a><!--]--><!----><header class=\"VPNav\" data-v-99598d5d data-v-b30964d7><div class=\"VPNavBar\" data-v-b30964d7 data-v-a57f7b4c><div class=\"wrapper\" data-v-a57f7b4c><div class=\"container\" data-v-a57f7b4c><div class=\"title\" data-v-a57f7b4c><div class=\"VPNavBarTitle\" data-v-a57f7b4c data-v-95edfb70><a class=\"title\" href=\"/mbc-docs/en/\" data-v-95edfb70><!--[--><!--]--><!--[--><img class=\"VPImage logo\" src=\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA0MCA0MCI+PHJlY3Qgd2lkdGg9IjQwIiBoZWlnaHQ9IjQwIiByeD0iMTAiIGZpbGw9IiMzNjM2MzYiLz48cGF0aCBkPSJNOSAyOSAyMCA5bDExIDIwaC03bC00LTgtNCA4WiIgZmlsbD0iIzE2MTYxNiIvPjwvc3ZnPg==\" alt data-v-802dc540><!--]--><span data-v-95edfb70>AWRECKER</span><!--[--><!--]--></a></div></div><div class=\"content\" data-v-a57f7b4c><div class=\"content-body\" data-v-a57f7b4c><!--[--><!--]--><div class=\"VPNavBarSearch search\" data-v-a57f7b4c><!----></div><nav aria-labelledby=\"main-nav-aria-label\" class=\"VPNavBarMenu menu\" data-v-a57f7b4c data-v-9537f28c><span id=\"main-nav-aria-label\" class=\"visually-hidden\" data-v-9537f28c> Main Navigation </span><!--[--><!--]--></nav><d ance.</small></div><div class=\"feature-box\"><strong>React with code</strong><small>Use a threshold to define your robot’s response.</small></div><div class=\"feature-box\"><strong>Learn step by step</strong><small>Follow a guide for your controller and environment.</small></div></div><h3 id=\"product-overview\" tabindex=\"-1\">Product overview <a class=\"header-anchor\" href=\"#product-overview\" aria-label=\"Permalink to &quot;Product overview&quot;\">​</a></h3><p>Distance sensing can support obstacle detection, proximity feedback and spacing control. Read a value, evaluate a condition and trigger an appropriate action.</p><table tabindex=\"0\"><thead><tr><th>Item</th><th>Status</th></tr></thead><tbody><tr><td>Model / product photo</td><td>Awaiting client assets</td></tr><tr><td>Measurement range / accuracy</td><td>Awaiting specifications</td></tr><tr><td>Connector / protocol</td><td>Awaiting hardware details</td></tr><tr><td>EV3 / SPIKE compatibility</td><td>Driver and firmware verification required</td></tr><tr><td>Programming environment</td><td>Four demonstration learning paths</td></tr></tbody></table><h3 id=\"before-you-begin\" tabindex=\"-1\">Before you begin <a class=\"header-anchor\" href=\"#before-you-begin\" aria-label=\"Permalink to &quot;Before you begin&quot;\">​</a></h3><ol><li>Confirm your product version and controller. Follow the official wiring diagram.</li><li>Install the required programming environment and product driver.</li><li>Check raw readings before adding conditions or motor control.</li></ol><div class=\"tip custom-block\"><p class=\"custom-block-title\">Start with a reading</p><p>Begin by displaying a value. Confirm its units and stability before testing threshold logic. Wiring diagrams and driver links will be added when supplied.</p></div><h3 id=\"applications\" tabindex=\"-1\">Applications <a class=\"header-anchor\" href=\"#applications\" aria-label=\"Permalink to &quot;Applications&quot;\">​</a></h3><ul><li><strong>Obstacle detection</strong>: stop or turn when a reading is below a threshold.</li><li><strong>Proximity feedback</strong>: show a message or sound based on distance.</li><li><strong>Spacing control</strong>: use continuous readings as an input to your control logic.</li></ul><h2 id=\"tutorial-s8-ev3-clev3r-app\" tabindex=\"-1\">Tutorial (S8 + EV3 + clev3r App) <a class=\"header-anchor\" href=\"#tutorial-s8-ev3-clev3r-app\" aria-label=\"Permalink to &quot;Tutorial (S8 + EV3 + clev3r App)&quot;\">​</a></h2><div class=\"warning custom-block\"><p class=\"custom-block-title\">Tutorial pending</p><p>This environment is listed in the product configuration, but its tutorial has not been supplied. Add setup instructions, API documentation and examples here. No hardware program is provided on this page.</p></div><h3 id=\"setup\" tabindex=\"-1\">Setup <a class=\"header-anchor\" href=\"#setup\" aria-label=\"Permalink to &quot;Setup&quot;\">​</a></h3><p>Pending.</p><h3 id=\"functions\" tabindex=\"-1\">Functions <a class=\"header-anchor\" href=\"#functions\" aria-label=\"Permalink to &quot;Functions&quot;\">​</a></h3><p>Pending.</p><h3 id=\"example-program\" tabindex=\"-1\">Example program <a class=\"header-anchor\" href=\"#example-program\" aria-label=\"Permalink to &quot;Example program&quot;\">​</a></h3><p>Pending.</p><p><a href=\"/mbc-docs/en/\">Return to the home page</a></p></div></div></main><!----><!--[--><!--]--></div></div></div><!--[--><!--]--></div></div><!----><!--[--><!--]--></div></div>\n    \n    \n  ", "/en/products/S8/spike-app.html": "\n    <div id=\"app\"><div class=\"Layout\" data-v-99598d5d><!--[--><!--]--><!--[--><span tabindex=\"-1\" data-v-68b79384></span><a href=\"#VPContent\" class=\"VPSkipLink visually-hidden\" data-v-68b79384>Skip to content</a><!--]--><!----><header class=\"VPNav\" data-v-99598d5d data-v-b30964d7><div class=\"VPNavBar\" data-v-b30964d7 data-v-a57f7b4c><div class=\"wrapper\" data-v-a57f7b4c><div class=\"container\" data-v-a57f7b4c><div class=\"ti llowing Sensor S8 · SPIKE · SPIKE App <a class=\"header-anchor\" href=\"#mbc-line-following-sensor-s8-·-spike-·-spike-app\" aria-label=\"Permalink to &quot;MBC Line-Following Sensor S8 · SPIKE · SPIKE App&quot;\">​</a></h1><h2 id=\"product-introduction\" tabindex=\"-1\">Product introduction <a class=\"header-anchor\" href=\"#product-introduction\" aria-label=\"Permalink to &quot;Product introduction&quot;\">​</a></h2><p>Explore distance readings, then use conditions to build your first sensing workflow.</p><div class=\"warning custom-block\"><p class=\"custom-block-title\">Product documentation preview</p><p>The product name and learning flow are illustrative. Measurement range, connectors, drivers and supported environments await confirmation. Examples are not production hardware code.</p></div><div class=\"feature-grid\"><div class=\"feature-box\"><strong>Sense distance</strong><small>Learn the basics of reading values and evaluating distance.</small></div><div class=\"feature-box\"><strong>React with code</strong><small>Use a threshold to define your robot’s response.</small></div><div class=\"feature-box\"><strong>Learn step by step</strong><small>Follow a guide for your controller and environment.</small></div></div><h3 id=\"product-overview\" tabindex=\"-1\">Product overview <a class=\"header-anchor\" href=\"#product-overview\" aria-label=\"Permalink to &quot;Product overview&quot;\">​</a></h3><p>Distance sensing can support obstacle detection, proximity feedback and spacing control. Read a value, evaluate a condition and trigger an appropriate action.</p><table tabindex=\"0\"><thead><tr><th>Item</th><th>Status</th></tr></thead><tbody><tr><td>Model / product photo</td><td>Awaiting client assets</td></tr><tr><td>Measurement range / accuracy</td><td>Awaiting specifications</td></tr><tr><td>Connector / protocol</td><td>Awaiting hardware details</td></tr><tr><td>EV3 / SPIKE compatibility</td><td>Driver and firmware verification required</td></tr><tr><td>Programming environment</td><td>Four demonstration learning paths</td></tr></tbody></table><h3 id=\"before-you-begin\" tabindex=\"-1\">Before you begin <a class=\"header-anchor\" href=\"#before-you-begin\" aria-label=\"Permalink to &quot;Before you begin&quot;\">​</a></h3><ol><li>Confirm your product version and controller. Follow the official wiring diagram.</li><li>Install the required programming environment and product driver.</li><li>Check raw readings before adding conditions or motor control.</li></ol><div class=\"tip custom-block\"><p class=\"custom-block-title\">Start with a reading</p><p>Begin by displaying a value. Confirm its units and stability before testing threshold logic. Wiring diagrams and driver links will be added when supplied.</p></div><h3 id=\"applications\" tabindex=\"-1\">Applications <a class=\"header-anchor\" href=\"#applications\" aria-label=\"Permalink to &quot;Applications&quot;\">​</a></h3><ul><li><strong>Obstacle detection</strong>: stop or turn when a reading is below a threshold.</li><li><strong>Proximity feedback</strong>: show a message or sound based on distance.</li><li><strong>Spacing control</strong>: use continuous readings as an input to your control logic.</li></ul><h2 id=\"your-tutorial-·-spike-·-spike-app\" tabindex=\"-1\">Your tutorial · SPIKE · SPIKE App <a class=\"header-anchor\" href=\"#your-tutorial-·-spike-·-spike-app\" aria-label=\"Permalink to &quot;Your tutorial · SPIKE · SPIKE App&quot;\">​</a></h2><p>Learn to read, display and evaluate a distance value.</p><div class=\"warning custom-block\"><p class=\"custom-block-title\">Demonstration guide</p><p>The product driver and API are not available yet. The sample below uses simulated readings; it does not communicate with a sensor. Product compatibility must be verified before use.</p></div><h2 id=\"_01-prepare-your-environment\" tabindex=\"-1\">01 / Prepare your environment <a class=\"header-anchor\" href=\"#_01-prepare-your-environment\" aria-label=\"Permalink to &quot;01 / Prepare your environment&quot;\">​</a></h2><p>Prepare a SPIKE controller and the SPIKE App. Verify driver and firmware requirements before changing firmware.</p><ol><li>Obtain the product wiring diagram and driver.</li><li>Confirm the port and measurement unit.</li><li>Begin with a single reading before adding a loop.</li></ol><h2 id=\"_02-function-concepts\" tabindex=\"-1\">02 / Function concepts <a class=\"header-anchor\" href=\"#_02-function-concepts\" aria-label=\"Permalink to &quot;02 / Function concepts&quot;\">​</a></h2><table tabindex=\"0\"><thead><tr><th>Concept</th><th>Demonstration function</th><th>Result</th></tr></thead><tbody><tr><td>Read a value</td><td><code>read_demo_distance()</code></td><td>Simulated distance in mm</td></tr><tr><td>Compare a threshold</td><td><code>is_near(distance_mm, threshold_mm)</code></td><td>Boolean result</td></tr><tr><td>Display feedback</td><td><code>print(message)</code></td><td>Console message</td></tr></tbody></table><p>These names belong to this example, not the product API. Replace the simulated reader with the official driver after confirmation.</p><h2 id=\"example\">03 / Example program</h2><p>This is a conceptual block sequence. The official product extension and importable project will be added when available.</p><div class=\"block-flow\"><div>When program starts</div><div>Set threshold to 200 mm</div><div>Set simulated distance to 150 mm</div><div>If distance &lt; threshold</div><div>Display “Object nearby”</div></div><h2 id=\"_04-try-it-yourself\" tabindex=\"-1\">04 / Try it yourself <a class=\"header-anchor\" href=\"#_04-try-it-yourself\" aria-label=\"Permalink to &quot;04 / Try it yourself&quot;\">​</a></h2><p>Change the simulated distance from <code>150</code> to <code>300</code>. With a <code>200</code> mm threshold, the result changes to “Path clear”. A value exactly equal to <code>200</code> is also clear because the comparison uses <code>&lt;</code>.</p><h2 id=\"troubleshooting\" tabindex=\"-1\">Troubleshooting <a class=\"header-anchor\" href=\"#troubleshooting\" aria-label=\"Permalink to &quot;Troubleshooting&quot;\">​</a></h2><table tabindex=\"0\"><thead><tr><th>Situation</th><th>Check</th></tr></thead><tbody><tr><td>No real readings</td><td>This demo uses simulation. Add the official driver first.</td></tr><tr><td>Cannot find a block</td><td>Product extensions are pending; this is a conceptual sequence.</td></tr><tr><td>Unexpected units</td><td>Confirm the driver returns mm before comparing values.</td></tr></tbody></table><p><a href=\"/mbc-docs/en/\">Return home and choose another path</a></p></div></div></main><!----><!--[--><!--]--></div></div></div><!--[--><!--]--></div></div><!----><!--[--><!--]--></div></div>\n    \n    \n  ", "/en/products/S16/spike-python.html": "\n    <div id=\"app\"><div class=\"Layout\" data-v-99598d5d><!--[--><!--]--><!--[--><span tabindex=\"-1\" data-v-68b79384></span><a href=\"#VPContent\" class=\"VPSkipLink visually-hidden\" data-v-68b79384>Skip to content</a><!--]--><!----><header class=\"VPNav\" data-v-99598d5d data-v-b30964d7><div class=\"VPNavBar\" data-v-b30964d7 data-v-a57f7b4c><div class=\"wrapper\" data-v-a57f7b4c><div class=\"container\" data-v-a57f7b4c><div class=\"title\" data-v-a57f7b4c><div class=\"VPNavBarTitle\" data-v-a57f7b4c data-v-95edfb70><a class=\"title\" href=\"/mbc-docs/en/\" data-v-95edfb70><!--[--><!--]--><!--[--><img class=\"VPImage logo\" src=\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA0MCA0MCI+PHJlY3Qgd2lkdGg9IjQwIiBoZWlnaHQ9IjQwIiByeD0iMTAiIGZpbGw9IiMzNjM2MzYiLz48cGF0aCBkPSJNOSAyOSAyMCA5bDExIDIwaC03bC00LTgtNCA4WiIgZmlsbD0iIzE2MTYxNiIvPjwvc3ZnPg==\" alt data-v-802dc540><!--]--><span data-v-95edfb70>AWRECKER</span><!--[--><!--]--></a></div></div><div class=\"content\" data-v-a57f7b4c><div class=\"content-body\" data-v-a57f7b4c><!--[--><!--]--><div class=\"VPNavBarSearch search\" data-v-a57f7b4c><!----></div><nav aria-labelledby=\"main-nav-aria-lab ks-python\" tabindex=\"-1\">Your tutorial · SPIKE · Pybricks Python <a class=\"header-anchor\" href=\"#your-tutorial-·-spike-·-pybricks-python\" aria-label=\"Permalink to &quot;Your tutorial · SPIKE · Pybricks Python&quot;\">​</a></h2><h3 id=\"_01-preparation\" tabindex=\"-1\">01 / Preparation <a class=\"header-anchor\" href=\"#_01-preparation\" aria-label=\"Permalink to &quot;01 / Preparation&quot;\">​</a></h3><p>Confirm the product model, controller, firmware and driver support before connecting hardware.</p><h3 id=\"_02-functions\" tabindex=\"-1\">02 / Functions <a class=\"header-anchor\" href=\"#_02-functions\" aria-label=\"Permalink to &quot;02 / Functions&quot;\">​</a></h3><p>The official driver, function names, arguments, units and return values will be documented after the product API is supplied.</p><h3 id=\"_03-example-program\" tabindex=\"-1\">03 / Example program <a class=\"header-anchor\" href=\"#_03-example-program\" aria-label=\"Permalink to &quot;03 / Example program&quot;\">​</a></h3><p>A verified example for this product and programming environment will be added after testing.</p><p><a href=\"/mbc-docs/en/\">Return home and choose another product</a></p></div></div></main><!----><!--[--><!--]--></div></div></div><!--[--><!--]--></div></div><!----><!--[--><!--]--></div></div>\n    \n    \n  ", "/en/products/S16/ev3-python.html": "\n    <div id=\"app\"><div class=\"Layout\" data-v-99598d5d><!--[--><!--]--><!--[--><span tabindex=\"-1\" data-v-68b79384></span><a href=\"#VPContent\" class=\"VPSkipLink visually-hidden\" data-v-68b79384>Skip to content</a><!--]--><!----><header class=\"VPNav\" data-v-99598d5d data-v-b30964d7><div class=\"VPNavBar\" data-v-b30964d7 data-v-a57f7b4c><div class=\"wrapper\" data-v-a57f7b4c><div class=\"container\" data-v-a57f7b4c><div class=\"title\" data-v-a57f7b4c><div class=\"VPNavBarTitle\" data-v-a57f7b4c data-v-95edfb70><a class=\"title\" href=\"/mbc-docs/en/\" data-v-95edfb70><!--[--><!--]--><!--[--><img class=\"VPImage label=\"Permalink to &quot;01 / Preparation&quot;\">​</a></h3><p>Confirm the product model, controller, firmware and driver support before connecting hardware.</p><h3 id=\"_02-functions\" tabindex=\"-1\">02 / Functions <a class=\"header-anchor\" href=\"#_02-functions\" aria-label=\"Permalink to &quot;02 / Functions&quot;\">​</a></h3><p>The official driver, function names, arguments, units and return values will be documented after the product API is supplied.</p><h3 id=\"_03-example-program\" tabindex=\"-1\">03 / Example program <a class=\"header-anchor\" href=\"#_03-example-program\" aria-label=\"Permalink to &quot;03 / Example program&quot;\">​</a></h3><p>A verified example for this product and programming environment will be added after testing.</p><p><a href=\"/mbc-docs/en/\">Return home and choose another product</a></p></div></div></main><!----><!--[--><!--]--></div></div></div><!--[--><!--]--></div></div><!----><!--[--><!--]--></div></div>\n    \n    \n  "};const catalog={"S16": {"slug": "S16", "order": 2, "code": "S16", "name": {"zh": "MBC S16", "en": "MBC S16"}, "summary": {"zh": "顏色辨識與循線應用", "en": "Color detection and line-following"}, "image": "/images/products/S16/S16.svg", "imageAlt": {"zh": "MBC S16 示意圖", "en": "MBC S16 illustration"}, "routeBase": "products/S16", "support": {"spike": ["app", "block", "python"], "ev3": ["python"]}, "compatibilityNote": {"zh": "此為預覽版路徑設定，實際控制器、語言與韌體支援待產品資料確認。", "en": "Preview learning paths only. Product, controller, language and firmware support still require confirmation."}}, "S8": {"slug": "S8", "order": 1, "code": "MBC S8", "name": {"zh": "MBC 8 路巡跡板", "en": "MBC Line-Following Sensor S8"}, "summary": {"zh": "兼容 EV3 / SPIKE / MATRIX R4", "en": "Compatible With EV3 / SPIKE / MATRIX R4"}, "image": "/images/products/S8/S8-spike.webp", "imageAlt": {"zh": "MBC S8", "en": "MBC S8"}, "routeBase": "products/S8", "support": {"spike": ["app", "inventor", "block", "python"], "ev3": ["classroom", "ev3g", "clev3r", "python"]}}, function render(){let h=decodeURI(location.hash.slice(1)||'/'); const parts=h.split('#'); current=parts[0]; if(!pages[current]) current='/';document.getElementById('preview').innerHTML=pages[current]; const en=current.startsWith('/en/');document.documentElement.lang=en?'en':'zh-Hant';document.body.style.overflow=(current==='/'||current==='/en/')?'hidden':'';

function updateCarousel(){const track=document.querySelector('.product-track');if(!track)return;const prev=track.scrollLeft>2,next=track.scrollLeft+track.clientWidth<track.scrollWidth-2;document.querySelector('[data-slide="-1"]').disabled=!prev;document.querySelector('[data-slide="1"]').disabled=!next;const collection=track.parentElement;collection.classList.toggle('can-prev',prev);collection.classList.toggle('can-next',next);collection.classList.toggle('many-products',track.querySelectorAll('.product-item').length>3);const image=track.querySelector('.product-image');if(image){collection.style.setProperty('--image-height',image.clientHeight+'px');collection.style.setProperty('--arrow-left',Math.max(0,(track.querySelector('.product-item').clientWidth-image.clientWidth)/2-22)+'px')}}

ck=()=>{if(button.disabled)return;modal?.close();navigate((en?'/en':'')+'/'+config.routeBase+'/'+controller+'-'+language+'.html')}}
window.addEventListener('hashchange',render);document.addEventListener('change',e=>{if(e.target.matches('.tutorial-picker input'))updatePicker()});document.addEventListener('click',e=>{const a=e.target.closest('a');if(!a)return;let href=a.getAttribute('href');if(!href||href.startsWith('http')||href.startsWith('mailto'))return;e.preventDefault();href=href.replace(/^\/mbc-docs\//,'/');if(href.startsWith('#')){document.getElementById(decodeURI(href.slice(1)))?.scrollIntoView();return}if(!href.startsWith('/'))href=new URL(href,'https://preview.test'+current).pathname;let [path,anchor]=href.split('#');if(!path.endsWith('/')&&!path.endsWith('.html'))path+='.html';if(pages[path])navigate(path+(anchor?'#'+anchor:''));});render();
