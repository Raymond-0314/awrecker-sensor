-><!--]--></div></div></div></div><div class=\"content\" data-v-220728f0><div class=\"content-container\" data-v-220728f0><!--[--><!--]--><main class=\"main\" data-v-220728f0><div style=\"position:relative;\" class=\"vp-doc _mbc-docs_products_S8\" data-v-220728f0><div><h1 id=\"mbc-8-路巡跡板\" tabindex=\"-1\">MBC 8 路巡跡板 <a class=\"header-anchor\" href=\"#mbc-8-路巡跡板\" aria-label=\"Permalink to &quot;MBC 8 路巡跡板&quot;\">​</a></h1><h2 id=\"產品介紹\" tabindex=\"-1\">產品介紹 <a class=\"header-anchor\" href=\"#產品介紹\" aria-label=\"Permalink to &quot;產品介紹&quot;\">​</a></h2><p>讓機器人感知前方，從距離讀值到條件控制，一步步建立你的第一個感測應用。</p><div class=\"warning custom-block\"><p class=\"custom-block-title\">版本相容性</p><p>MBC S8 巡跡板共有3種版本(SPIKE / EV3 / 一般I2C開發版)，版本間不相容，請謹慎選擇。</p></div><div class=\"feature-grid\"><div class=\"feature-box\"><strong>高速循線</strong><small>簡單易上手的高速循線感應器。</small></div><div class=\"feature-box\"><strong>路口判斷</strong><small>準確判斷黑線路口。</small></div><div class=\"feature-box\"><strong>核心算法</strong><small>抗干擾、內建率波演算法。</small></div></div><h3 id=\"產品概覽\" tabindex=\"-1\">產品概覽 <a class=\"header-anchor\" href=\"#產品概覽\" aria-label=\"Permalink to &quot;產品概覽&quot;\">​</a></h3><p>距離感測可以用於障礙物偵測、接近提示與保持間距。讀取感測器數值後，程式便能根據條件執行不同動作。</p><table tabindex=\"0\"><thead><tr><th>項目</th><th>目前狀態</th></tr></thead><tbody><tr><td>產品型號 / 照片</td><td>待甲方提供</td></tr><tr><td>量測範圍與精度</td><td>待正式規格確認</td></tr><tr><td>接頭與通訊方式</td><td>待硬體介面確認</td></tr><tr><td>EV3 / SPIKE 相容性</td><td>待驅動與韌體驗證</td></tr><tr><td>程式環境</td><td>本版展示四條教學路徑</td></tr></tbody></table><h3 id=\"開始之前\" tabindex=\"-1\">開始之前 <a class=\"header-anchor\" href=\"#開始之前\" aria-label=\"Permalink to &quot;開始之前&quot;\">​</a></h3><ol><li>確認你的控制器與 MBC S8 巡跡板版本是否相同。</li><li>進行感應器正規化與校正。</li><li>通電後感應器上的綠色心跳指示燈 (靠近插座) 會開始閃爍。</li></ol><h3 id=\"校正與正規化\" tabindex=\"-1\">校正與正規化 <a class=\"header-anchor\" href=\"#校正與正規化\" aria-label=\"Permalink to &quot;校正與正規化&quot;\">​</a></h3><ol><li>按下校準按鈕：按住感應器上的校準按鈕 0.5 秒，直到 🟢 綠色校準指示燈 (靠近校準按鈕) 保持亮起。</li><li>開始掃描：將感應器在場地黑線與白色區塊上來回移動。</li><li>保持高度：感應器距離地面 0.5 ~ 1.2 公分為佳。</li><li>等待完成：等待 🟢 綠色校準指示燈熄滅，校準完成。</li></ol><p><a href=\"/mbc-docs/\">回首頁選擇教學路徑</a></p></div></div></main><!----><!--[--><!--]--></div></div></div><!--[--><!--]--></div></div><!----><!--[--><!--]--></div></div>\n    \n    \n  ", "/products/Hue12.html": "\n    <div id=\"app\"><div class=\"Layout\" data-v-99598d5d><!--[--><!--]--><!--[--><span tabindex=\"-1\" data-v-68b79384></span><a href=\"#VPContent\" class=\"VPSkipLink visually-hidden\" data-v-68b79384>Skip to content</a><!--]--><!----><header class=\"VPNav\" data-v-99598d5d data-v-b30964d7><div class=\"VPNavBar\" data-v-b30964d7 data-v-a57f7b4c><div class=\"wrapper\" data-v-a57f7b4c><div class=\"container\" data-v-a57f7b4c><div class=\"title\" data-v-a57f7b4c><div class=\"VPNavBarTitle\" data-v-a57f7b4c data-v-95edfb70><a class=\"title\" href=\"/mbc-docs/\" data-v-95edfb70><!--[--><!--]--><!--[--><img class=\"VPImage logo\" src=\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA0MCA0MCI+PHJlY3Qgd2lkdGg9IjQwIiBoZWlnaHQ9IjQwIiByeD0iMTAiIGZpbGw9IiMzNjM2MzYiLz48cGF0aCBkPSJNOSAyOSAyMCA5bDExIDIwaC03bC00LTgtNCA4WiIgZmlsbD0iIzE2MTYxNiIvPjwvc3ZnPg==\" alt data-v-802dc540><!--]--><span data-v-95edfb70>AWRECKER</span><!--[--><!--]--></a></div></div><div class=\"content\" data-v-a57f7b4c><div class=\"content-body\" data-v-a57f7b4c><!--[--><!--]--><div class=\"VPNavBarSearch search\" data-v-a57f7b4c><!----></div><nav aria-labelledby=\"main-nav-aria-label\" class=\"VPNavBarMenu menu\" data-v-a57f7b4c data-v-9537f28c><span id=\"main-nav-aria-label\" class=\"visually-hidden\" data-v-9537f28c> Main Navigation </span><!--[--><!--]--></nav><div class=\"VPFlyout VPNavBarTranslations translations\" data-v-a57f7b4c data-v-8fcac8a9 data-v-c2eb2969><button type=\"button\" class=\"button\" aria-haspopup=\"true\" aria-expanded=\"false\" aria-label=\"選擇語言\" data-v-c2eb2969><span class=\"text\" data-v-c2eb2969><span class=\"vpi-languages option-icon\" data-v-c2eb29 pe=\"button\" role=\"switch\" title aria-checked=\"true\" data-v-bf9154cd data-v-6e9f6566 data-v-667264c4><span class=\"check\" data-v-667264c4><span class=\"icon\" data-v-667264c4><!--[--><span class=\"vpi-sun sun\" data-v-6e9f6566></span><span class=\"vpi-moon moon\" data-v-6e9f6566></span><!--]--></span></span></button></div></div></div><!----><!--]--><!--]--></div></div></div><!--[--><!--[--><!--[--><a class=\"language-switch\" href=\"/mbc-docs/en/products/S8/ev3-ev3g.html\" lang=\"en\" aria-label=\"Switch to English\">English</a><!--]--><!--]--><!--]--><button type=\"button\" class=\"VPNavBarHamburger hamburger\" aria-label=\"mobile navigation\" aria-expanded=\"false\" aria-controls=\"VPNavScreen\" data-v-a57f7b4c data-v-ac55b462><span class=\"container\" data-v-ac55b462><span class=\"top\" data-v-ac55b462></span><span class=\"middle\" data-v-ac55b462></span><span class=\"bottom\" data-v-ac55b462></span></span></button></div></div></div></div><div class=\"divider\" data-v-a57f7b4c><div class=\"divider-line\" data-v-a57f7b4c></div></div></div><!----></header><div class=\"VPLocalNav empty fixed\" data-v-99598d5d data-v-6325a854><div class=\"container\" data-v-6325a854><!----><div class=\"VPLocalNavOutlineDropdown\" style=\"--vp-vh:0px;\" data-v-6325a854 data-v-270df66f><button data-v-270df66f>Return to top</button><!----></div></div></div><!----><div class=\"VPContent\" id=\"VPContent\" data-v-99598d5d data-v-e9feca6f><div class=\"VPDoc has-aside\" data-v-e9feca6f data-v-220728f0><!--[--><!--]--><div class=\"container\" data-v-220728f0><div class=\"aside\" data-v-220728f0><div class=\"aside-curtain\" data-v-220728f0></div><div class=\"aside-container\" data-v-220728f0><div class=\"aside-content\" data-v-220728f0><div class=\"VPDocAside\" data-v-220728f0 data-v-e1b13a4a><!--[--><!--]--><!--[--><!--]--><nav aria-labelledby=\"doc-outline-aria-label\" class=\"VPDocAsideOutline\" data-v-e1b13a4a data-v-9edb41bb><div class=\"content\" data-v-9edb41bb><div class=\"outline-marker\" data-v-9edb41bb></div><div aria-level=\"2\" class=\"outline-title\" id=\"doc-outline-aria-label\" role=\"heading\" data-v-9edb41bb>On this page</div><ul class=\"VPDocOutlineItem root\" data-v-9edb41bb data-v-a20af3d2><!--[--><!--]--></ul></div></nav><!--[--><!--]--><div class=\"spacer\" data-v-e1b13a4a></div><!--[--><!--]--><!----><!--[--><!--]--><!--[--><!--]--></div></div></div></div><div class=\"content\" data-v-220728f0><div class=\"content-container\" data-v-220728f0><!--[--><!--]--><main class=\"main\" data-v-220728f0><div style=\"position:relative;\" class=\"vp-doc _mbc-docs_products_S8_ev3-ev3g\" data-v-220728f0><div><h1 id=\"mbc-8-路巡跡板-·-ev3-·-labview-ev3-g\" tabindex=\"-1\">MBC 8 路巡跡板 · EV3 · LabVIEW EV3-G <a class=\"header-anchor\" href=\"#mbc-8-路巡跡板-·-ev3-·-labview-ev3-g\" aria-label=\"Permalink to &quot;MBC 8 路巡跡板 · EV3 · LabVIEW EV3-G&quot;\">​</a></h1><h2 id=\"產品介紹\" tabindex=\"-1\">產品介紹 <a class=\"header-anchor\" href=\"#產品介紹\" aria-label=\"Permalink to &quot;產品介紹&quot;\">​</a></h2><p>讓機器人感知前方，從距離讀值到條件控制，一步步建立你的第一個感測應用。</p><div class=\"warning custom-block\"><p class=\"custom-block-title\">版本相容性</p><p>MBC S8 巡跡板共有3種版本(SPIKE / EV3 / 一般I2C開發版)，版本間不相容，請謹慎選擇。</p></div><div class=\"feature-grid\"><div class=\"feature-box\"><strong>高速循線</strong><small>簡單易上手的高速循線感應器。</small></div><div class=\"feature-box\"><strong>路口判斷</strong><small>準確判斷黑線路口。</small></div><div class=\"feature-box\"><strong>核心算法</strong><small>抗干擾、內建率波演算法。</small></div></div><h3 id=\"產品概覽\" tabindex=\"-1\">產品概覽 <a class=\"header-anchor\" href=\"#產品概覽\" aria-label=\"Permalink to &quot;產品概覽&quot;\">​</a></h3><p>距離感測可以用於障礙物偵測、接近提示與保持間距。讀取感測器數值後，程式便能根據條件執行不同動作。</p><table tabindex=\"0\"><thead><tr><th>項目</th><th>目前狀態</th></tr></thead><tbody><tr><td>產品型號 / 照片</td><td>待甲方提供</td></tr><tr><td>量測範圍與精度</td><td>待正式規格確認</td></tr><tr><td>接頭與通訊方式</td><td>待硬體介面確認</td></tr><tr><td>EV3 / SPIKE 相容性</td><td>待驅動與韌體驗證</td></tr><tr><td>程式環境</td><td>本版展示四條教學路徑</td></tr></tbody></table><h3 id=\"開始之前\" tabindex=\"-1\">開始之前 <a class=\"header-anchor\" href=\"#開始之前\" aria-label=\"Permalink to &quot;開始之前&quot;\">​</a></h3><ol><li>確認你的控制器與 MBC S8 巡跡板版本是否相同。</li><li>進行感應器正規化與校正。</li><li>通電後感應器上的綠色心跳指示燈 (靠近插座) 會開始閃爍。</li></ol><h3 id=\"校正與正規化\" tabindex=\"-1\">校正與正規化 <a class=\"header-anchor\" href=\"#校正與正規化\" aria-label=\"Permalink to &quot;校正與正規化&quot;\">​</a></h3><ol><li>按下校準按鈕：按住感應器上的校準按鈕 0.5 秒，直到 🟢 綠色校準指示燈 (靠近校準按鈕) 保持亮起。</li><li>開始掃描：將感應器在場地黑線與白色區塊上來回移動。</li><li>保持高度：感應器距離地面 0.5 ~ 1.2 公分為佳。</li><li>等待完成：等待 🟢 綠色校準指示燈熄滅，校準完成。</li></ol><h2 id=\"使用教學-s8-ev3-labview-ev3-g\" tabindex=\"-1\">使用教學 (S8 + EV3 + LabVIEW EV3-G) <a class=\"header-anchor\" href=\"#使用教學-s8-ev3-labview-ev3-g\" aria-label=\"Permalink to &quot;使用教學 (S8 + EV3 + LabVIEW EV3-G)&quot;\">​</a></h2><div class=\"warning custom-block\"><p class=\"custom-block-title\">教學內容待補</p><p>此環境已列入產品的教學選項，但尚未提供對應教學。請補上正式使用說明、函數與範例程式；本頁未提供可操作硬體的程式。</p></div><h3 id=\"環境準備\" tabindex=\"-1\">環境準備 <a class=\"header-anchor\" href=\"#環境準備\" aria-label=\"Permalink to &quot;環境準備&quot;\">​</a></h3><p>待補。</p><h3 id=\"函數與功能\" tabindex=\"-1\">函數與功能 <a class=\"header-anchor\" href=\"#函數與功能\" aria-label=\"Permalink to &quot;函數與功能&quot;\">​</a></h3><p>待補。</p><h3 id=\"範例程式\" tabindex=\"-1\">範例程式 <a class=\"header-anchor\" href=\"#範例程式\" aria-label=\"Permalink to &quot;範例程式&quot;\">​</a></h3><p>待補。</p><p><a href=\"/mbc-docs/\">回首頁選擇其他教學</a></p></div></div></main><!----><!--[--><!--]--></div></div></div><!--[--><!--]--></div></div><!----><!--[--><!--]--></div></div>\n    \n    \n  ", "/products/S8/spike-inventor.html": "\n    <div id=\"app\"><div class=\"Layout\" data-v-99598d5d><!--[--><!--]--><!--[--><span tabindex=\"-1\" data-v-68b79384></span><a href=\"#VPContent\" class=\"VPSkipLink visually-hidden\" data-v-68b79384>Skip to content</a><!--]--><!----><header class=\"VPNav\" data-v-99598d5d data-v-b30964d7><div class=\"VPNavBar\" data-v-b30964d7 data-v-a57f7b4c><div class=\"wrapper\" data-v-a57f7b4c><div class=\"container\" data-v-a57f7b PNavScreen\" data-v-a57f7b4c data-v-ac55b462><span class=\"container\" data-v-ac55b462><span class=\"top\" data-v-ac55b462></span><span class=\"middle\" data-v-ac55b462></span><span class=\"bottom\" data-v-ac55b462></span></span></button></div></div></div></div><div class=\"divider\" data-v-a57f7b4c><div class=\"divider-line\" data-v-a57f7b4c></div></div></div><!----></header><div class=\"VPLocalNav empty fixed\" data-v-99598d5d data-v-6325a854><div class=\"container\" data-v-6325a854><!----><div class=\"VPLocalNavOutlineDropdown\" style=\"--vp-vh:0px;\" data-v-6325a854 data-v-270df66f><button data-v-270df66f>Return to top</button><!----></div></div></div><!----><div class=\"VPContent\" id=\"VPContent\" data-v-99598d5d data-v-e9feca6f><div class=\"VPDoc has-aside\" data-v-e9feca6f data-v-220728f0><!--[--><!--]--><div class=\"container\" data-v-220728f0><div class=\"aside\" data-v-220728f0><div class=\"aside-curtain\" data-v-220728f0></div><div class=\"aside-container\" data-v-220728f0><div class=\"aside-content\" data-v-220728f0><div class=\"VPDocAside\" data-v-220728f0 data-v-e1b13a4a><!--[--><!--]--><!--[--><!--]--><nav aria-labelledby=\"doc-outline-aria-label\" class=\"VPDocAsideOutline\" data-v-e1b13a4a data-v-9edb41bb><div class=\"content\" data-v-9edb41bb><div class=\"outline-marker\" data-v-9edb41bb></div><div aria-level=\"2\" class=\"outline-title\" id=\"doc-outline-aria-label\" role=\"heading\" data-v-9edb41bb>On this page</div><ul class=\"VPDocOutlineItem root\" data-v-9edb41bb data-v-a20af3d2><!--[--><!--]--></ul></div></nav><!--[--><!--]--><div class=\"spacer\" data-v-e1b13a4a></div><!--[--><!--]--><!----><!--[--><!--]--><!--[--><!--]--></div></div></div></div><div class=\"content\" data-v-220728f0><div class=\"content-container\" data-v-220728f0><!--[--><!--]--><main class=\"main\" data-v-220728f0><div style=\"position:relative;\" class=\"vp-doc _mbc-docs_products_S8_spike-inventor\" data-v-220728f0><div><h1 id=\"mbc-8-路巡跡板-·-spike-·-lego-mindstorms-inventor\" tabindex=\"-1\">MBC 8 路巡跡板 · SPIKE · LEGO MINDSTORMS Inventor <a class=\"header-anchor\" href=\"#mbc-8-路巡跡板-·-spike-·-lego-mindstorms-inventor\" aria-label=\"Permalink to &quot;MBC 8 路巡跡板 · SPIKE · LEGO MINDSTORMS Inventor&quot;\">​</a></h1><h2 id=\"產品介紹\" tabindex=\"-1\">產品介紹 <a class=\"header-anchor\" href=\"#產品介紹\" aria-label=\"Permalink to &quot;產品介紹&quot;\">​</a></h2><p>讓機器人感知前方，從距離讀值到條件控制，一步步建立你的第一個感測應用。</p><div class=\"warning custom-block\"><p class=\"custom-block-title\">版本相容性</p><p>MBC S8 巡跡板共有3種版本(SPIKE / EV3 / 一般I2C開發版)，版本間不相容，請謹慎選擇。</p></div><div class=\"feature-grid\"><div class=\"feature-box\"><strong>高速循線</strong><small>簡單易上手的高速循線感應器。</small></div><div class=\"feature-box\"><strong>路口判斷</strong><small>準確判斷黑線路口。</small></div><div class=\"feature-box\"><strong>核心算法</strong><small>抗干擾、內建率波演算法。</small></div></div><h3 id=\"產品概覽\" tabindex=\"-1\">產品概覽 <a class=\"header-anchor\" href=\"#產品概覽\" aria-label=\"Permalink to &quot;產品概覽&quot;\">​</a></h3><p>距離感測可以用於障礙物偵測、接近提示與保持間距。讀取感測器數值後，程式便能根據條件執行不同動作。</p><table tabindex=\"0\"><thead><tr><th>項目</th><th>目前狀態</th></tr></thead><tbody><tr><td>產品型號 / 照片</td><td>待甲方提供</td></tr><tr><td>量測範圍與精度</td><td>待正式規格確認</td></tr><tr><td>接頭與通訊方式</td><td>待硬體介面確認</td></tr><tr><td>EV3 / SPIKE 相容性</td><td>待驅動與韌體驗證</td></tr><tr><td>程式環境</td><td>本版展示四條教學路徑</td></tr></tbody></table><h3 id=\"開始之前\" tabindex=\"-1\">開始之前 <a class=\"header-anchor\" href=\"#開始之前\" aria-label=\"Permalink to &quot;開始之前&quot;\">​</a></h3><ol><li>確認你的控制器與 MBC S8 巡跡板版本是否相同。</li><li>進行感應器正規化與校正。</li><li>通電後感應器上的綠色心跳指示燈 (靠近插座) 會開始閃爍。</li></ol><h3 id=\"校正與正規化\" tabindex=\"-1\">校正與正規化 <a class=\"header-anchor\" href=\"#校正與正規化\" aria-label=\"Permalink to &quot;校正與正規化&quot;\">​</a></h3><ol><li>按下校準按鈕：按住感應器上的校準按鈕 0.5 秒，直到 🟢 綠色校準指示燈 (靠近校準按鈕) 保持亮起。</li><li>開始掃描：將感應器在場地黑線與白色區塊上來回移動。</li><li>保持高度：感應器距離地面 0.5 ~ 1.2 公分為佳。</li><li>等待完成：等待 🟢 綠色校準指示燈熄滅，校準完成。</li></ol><h2 id=\"使用教學-s8-spike-lego-mindstorms-inventor\" tabindex=\"-1\">使用教學 (S8 + SPIKE + LEGO MINDSTORMS Inventor) <a class=\"header-anchor\" href=\"#使用教學-s8-spike-lego-mindstorms-inventor\" aria-label=\"Permalink to &quot;使用教學 (S8 + SPIKE + LEGO MINDSTORMS Inventor)&quot;\">​</a></h2><div class=\"warning custom-block\"><p class=\"custom-block-title\">教學內容待補</p><p>此環境已列入產品的教學選項，但尚未提供對應教學。請補上正式使用說明、函數與範例程式；本頁未提供可操作硬體的程式。</p></div><h3 id=\"環境準備\" tabindex=\"-1\">環境準備 <a class=\"header-anchor\" href=\"#環境準備\" aria-label=\"Permalink to &quot;環境準備&quot;\">​</a></h3><p>待補。</p><h3 id=\"函數與功能\" tabindex=\"-1\">函數與功能 <a class=\"header-anchor\" href=\"#函數與功能\" aria-label=\"Permalink to &quot;函數與功能&quot;\">​</a></h3><p>待補。</p><h3 id=\"範例程式\" tabindex=\"-1\">範例程式 <a class=\"header-anchor\" href=\"#範例程式\" aria-label=\"Permalink to &quot;範例程式&quot;\">​</a></h3><p>待補。</p><p><a href=\"/mbc-docs/\">回首頁選擇其他教學</a></p></div></div></main><!----><!--[--><!--]--></div></div></div><!--[--><!--]--></div></div><!----><!--[--><!--]--></div></div>\n    \n    \n  ", "/products/S8/ev3-classroom.html": "\n    <div id=\"app\"><div class=\"Layout\" data-v-99598d5d><!--[--><!--]--><!--[--><span tabindex=\"-1\" data-v-68b79384></span><a href=\"#VPContent\" class=\"VPSkipLink visually-hidden\" data-v-68b79384>Skip to content</a><!--]--><!----><header class=\"VPNav\" data-v-99598d5d data-v-b30964d7><div class=\"VPNavBar\" data-v-b30964d7 data-v-a57f7b4c><div class=\"wrapper\" data-v-a57f7b4c><div class=\"container\" data-v-a57f7b4c><div class=\"title\" data-v-a57f7b4c><div class=\"VPNavBarTitle\" data-v-a57f7b4c data-v-95edfb70><a class=\"title\" href=\"/mbc-docs/\" data-v-95edfb70><!--[--><!--]--><!--[--><img class=\"VPImage logo\" src=\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA0MCA0MCI+PHJlY3Qgd2lkdGg9IjQwIiBoZWlnaHQ9IjQwIiByeD0iMTAiIGZpbGw9IiMzNjM2MzYiLz48cGF0aCBkPSJNOSAyOSAyMCA5bDExIDIwaC03bC00LTgtNCA4WiIgZmlsbD0iIzE2MTYxNiIvPjwvc3ZnPg==\" alt data-v-802dc540><!--]--><span data-v-95edfb70>AWRECKER</span><!--[--><!--]--></a></div></div><div class=\"co >高速循線</strong><small>簡單易上手的高速循線感應器。</small></div><div class=\"feature-box\"><strong>路口判斷</strong><small>準確判斷黑線路口。</small></div><div class=\"feature-box\"><strong>核心算法</strong><small>抗干擾、內建率波演算法。</small></div></div><h3 id=\"產品概覽\" tabindex=\"-1\">產品概覽 <a class=\"header-anchor\" href=\"#產品概覽\" aria-label=\"Permalink to &quot;產品概覽&quot;\">​</a></h3><p>距離感測可以用於障礙物偵測、接近提示與保持間距。讀取感測器數值後，程式便能根據條件執行不同動作。</p><table tabindex=\"0\"><thead><tr><th>項目</th><th>目前狀態</th></tr></thead><tbody><tr><td>產品型號 / 照片</td><td>待甲方提供</td></tr><tr><td>量測範圍與精度</td><td>待正式規格確認</td></tr><tr><td>接頭與通訊方式</td><td>待硬體介面確認</td></tr><tr><td>EV3 / SPIKE 相容性</td><td>待驅動與韌體驗證</td></tr><tr><td>程式環境</td><td>本版展示四條教學路徑</td></tr></tbody></table><h3 id=\"開始之前\" tabindex=\"-1\">開始之前 <a class=\"header-anchor\" href=\"#開始之前\" aria-label=\"Permalink to &quot;開始之前&quot;\">​</a></h3><ol><li>確認你的控制器與 MBC S8 巡跡板版本是否相同。</li><li>進行感應器正規化與校正。</li><li>通電後感應器上的綠色心跳指示燈 (靠近插座) 會開始閃爍。</li></ol><h3 id=\"校正與正規化\" tabindex=\"-1\">校正與正規化 <a class=\"header-anchor\" href=\"#校正與正規化\" aria-label=\"Permalink to &quot;校正與正規化&quot;\">​</a></h3><ol><li>按下校準按鈕：按住感應器上的校準按鈕 0.5 秒，直到 🟢 綠色校準指示燈 (靠近校準按鈕) 保持亮起。</li><li>開始掃描：將感應器在場地黑線與白色區塊上來回移動。</li><li>保持高度：感應器距離地面 0.5 ~ 1.2 公分為佳。</li><li>等待完成：等待 🟢 綠色校準指示燈熄滅，校準完成。</li></ol><h2 id=\"使用教學-s8-ev3-ev3-classroom-app\" tabindex=\"-1\">使用教學 (S8 + EV3 + EV3 Classroom APP) <a class=\"header-anchor\" href=\"#使用教學-s8-ev3-ev3-classroom-app\" aria-label=\"Permalink to &quot;使用教學 (S8 + EV3 + EV3 Classroom APP)&quot;\">​</a></h2><div class=\"warning custom-block\"><p class=\"custom-block-title\">教學內容待補</p><p>此環境已列入產品的教學選項，但尚未提供對應教學。請補上正式使用說明、函數與範例程式；本頁未提供可操作硬體的程式。</p></div><h3 id=\"環境準備\" tabindex=\"-1\">環境準備 <a class=\"header-anchor\" href=\"#環境準備\" aria-label=\"Permalink to &quot;環境準備&quot;\">​</a></h3><p>待補。</p><h3 id=\"函數與功能\" tabindex=\"-1\">函數與功能 <a class=\"header-anchor\" href=\"#函數與功能\" aria-label=\"Permalink to &quot;函數與功能&quot;\">​</a></h3><p>待補。</p><h3 id=\"範例程式\" tabindex=\"-1\">範例程式 <a class=\"header-anchor\" href=\"#範例程式\" aria-label=\"Permalink to &quot;範例程式&quot;\">​</a></h3><p>待補。</p><p><a href=\"/mbc-docs/\">回首頁選擇其他教學</a></p></div></div></main><!----><!--[--><!--]--></div></div></div><!--[--><!--]--></div></div><!----><!--[--><!--]--></div></div>\n    \n    \n  ", "/products/S8/spike-python.html": "\n    <div id=\"app\"><div class=\"Layout\" data-v-99598d5d><!--[--><!--]--><!--[--><span tabindex=\"-1\" data-v-68b79384></span><a href=\"#VPContent\" class=\"VPSkipLink visually-hidden\" data-v-68b79384>Skip to content</a><!--]--><!----><header class=\"VPNav\" data-v-99598d5d data-v-b30964d7><div class=\"VPNavBar\" data-v-b30964d7 data-v-a57f7b4c><div class=\"wrapper\" data-v-a57f7b4c><div class=\"container\" data-v-a57f7b4c><div class=\"title\" data-v-a57f7b4c><div class=\"VPNavBarTitle\" data-v-a57f7b4c data-v-95edfb70><a class=\"title\" href=\"/mbc-docs/\" data-v-95edfb70><!--[--><!--]--><!--[--><img class=\"VPImage logo\" src=\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA0MCA0MCI+PHJlY3Qgd2lkdGg9IjQwIiBoZWlnaHQ9IjQwIiByeD0iMTAiIGZpbGw9IiMzNjM2MzYiLz48cGF0aCBkPSJNOSAyOSAyMCA5bDExIDIwaC03bC00LTgtNCA4WiIgZmlsbD0iIzE2MTYxNiIvPjwvc3ZnPg==\" alt data-v-802dc540><!--]--><span data-v-95edfb70>AWRECKER</span><!--[--><!--]--></a></div></div><div class=\"content\" data-v-a57f7b4c><div class=\"content-body\" data-v-a57f7b4c><!--[--><!--]--><div class=\"VPNavBarSearch search\" data-v-a57f7b4c><!----></div><nav aria-labelledby=\"main-nav-aria-label\" class=\"VPNavBarMenu menu\" data-v-a57f7b4c data-v-9537f28c><span id=\"main-nav-aria-label\" class=\"visually-hidden\" data-v-9537f28c> Main Navigation </span><!--[--><!--]--></nav><div class=\"VPFlyout VPNavBarTranslations translations\" data-v-a57f7b4c data-v-8fcac8a9 data-v-c2eb2969><button type=\"button\" class=\"button\" aria-haspopup=\"true\" aria-expanded=\"false\" aria-label=\"選擇語言\" data-v-c2eb2969><span class=\"text\" data-v-c2eb2969><span class=\"vpi-languag  data-v-9edb41bb><div class=\"outline-marker\" data-v-9edb41bb></div><div aria-level=\"2\" class=\"outline-title\" id=\"doc-outline-aria-label\" role=\"heading\" data-v-9edb41bb>On this page</div><ul class=\"VPDocOutlineItem root\" data-v-9edb41bb data-v-a20af3d2><!--[--><!--]--></ul></div></nav><!--[--><!--]--><div class=\"spacer\" data-v-e1b13a4a></div><!--[--><!--]--><!----><!--[--><!--]--><!--[--><!--]--></div></div></div></div><div class=\"content\" data-v-220728f0><div class=\"content-container\" data-v-220728f0><!--[--><!--]--><main class=\"main\" data-v-220728f0><div style=\"position:relative;\" class=\"vp-doc _mbc-docs_products_S8_spike-python\" data-v-220728f0><div><h1 id=\"mbc-8-路巡跡板-·-spike-·-pybricks-python\" tabindex=\"-1\">MBC 8 路巡跡板 · SPIKE · Pybricks Python <a class=\"header-anchor\" href=\"#mbc-8-路巡跡板-·-spike-·-pybricks-python\" aria-label=\"Permalink to &quot;MBC 8 路巡跡板 · SPIKE · Pybricks Python&quot;\">​</a></h1><h2 id=\"產品介紹\" tabindex=\"-1\">產品介紹 <a class=\"header-anchor\" href=\"#產品介紹\" aria-label=\"Permalink to &quot;產品介紹&quot;\">​</a></h2><p>讓機器人感知前方，從距離讀值到條件控制，一步步建立你的第一個感測應用。</p><div class=\"warning custom-block\"><p class=\"custom-block-title\">版本相容性</p><p>MBC S8 巡跡板共有3種版本(SPIKE / EV3 / 一般I2C開發版)，版本間不相容，請謹慎選擇。</p></div><div class=\"feature-grid\"><div class=\"feature-box\"><strong>高速循線</strong><small>簡單易上手的高速循線感應器。</small></div><div class=\"feature-box\"><strong>路口判斷</strong><small>準確判斷黑線路口。</small></div><div class=\"feature-box\"><strong>核心算法</strong><small>抗干擾、內建率波演算法。</small></div></div><h3 id=\"產品概覽\" tabindex=\"-1\">產品概覽 <a class=\"header-anchor\" href=\"#產品概覽\" aria-label=\"Permalink to &quot;產品概覽&quot;\">​</a></h3><p>距離感測可以用於障礙物偵測、接近提示與保持間距。讀取感測器數值後，程式便能根據條件執行不同動作。</p><table tabindex=\"0\"><thead><tr><th>項目</th><th>目前狀態</th></tr></thead><tbody><tr><td>產品型號 / 照片</td><td>待甲方提供</td></tr><tr><td>量測範圍與精度</td><td>待正式規格確認</td></tr><tr><td>接頭與通訊方式</td><td>待硬體介面確認</td></tr><tr><td>EV3 / SPIKE 相容性</td><td>待驅動與韌體驗證</td></tr><tr><td>程式環境</td><td>本版展示四條教學路徑</td></tr></tbody></table><h3 id=\"開始之前\" tabindex=\"-1\">開始之前 <a class=\"header-anchor\" href=\"#開始之前\" aria-label=\"Permalink to &quot;開始之前&quot;\">​</a></h3><ol><li>確認你的控制器與 MBC S8 巡跡板版本是否相同。</li><li>進行感應器正規化與校正。</li><li>通電後感應器上的綠色心跳指示燈 (靠近插座) 會開始閃爍。</li></ol><h3 id=\"校正與正規化\" tabindex=\"-1\">校正與正規化 <a class=\"header-anchor\" href=\"#校正與正規化\" aria-label=\"Permalink to &quot;校正與正規化&quot;\">​</a></h3><ol><li>按下校準按鈕：按住感應器上的校準按鈕 0.5 秒，直到 🟢 綠色校準指示燈 (靠近校準按鈕) 保持亮起。</li><li>開始掃描：將感應器在場地黑線與白色區塊上來回移動。</li><li>保持高度：感應器距離地面 0.5 ~ 1.2 公分為佳。</li><li>等待完成：等待 🟢 綠色校準指示燈熄滅，校準完成。</li></ol><h2 id=\"使用教學-·-spike-·-pybricks-python\" tabindex=\"-1\">使用教學 · SPIKE · Pybricks Python <a class=\"header-anchor\" href=\"#使用教學-·-spike-·-pybricks-python\" aria-label=\"Permalink to &quot;使用教學 · SPIKE · Pybricks Python&quot;\">​</a></h2><p>從連接準備、函數概念到範例流程，練習讀取與判斷距離。</p><div class=\"warning custom-block\"><p class=\"custom-block-title\">示意教學</p><p>目前尚無產品驅動與正式 API。下方範例使用模擬讀值，不會與感測器通訊；實際產品相容性需先驗證。</p></div><h2 id=\"_01-環境準備\" tabindex=\"-1\">01 / 環境準備 <a class=\"header-anchor\" href=\"#_01-環境準備\" aria-label=\"Permalink to &quot;01 / 環境準備&quot;\">​</a></h2><p>準備 SPIKE 控制器與對應的 Pybricks 程式環境。變更韌體前，先確認產品驅動與韌體需求。</p><ol><li>取得產品接線圖與驅動套件。</li><li>確認連接埠與數值單位。</li><li>先完成單次數值讀取，再加入迴圈。</li></ol><h2 id=\"_02-函數與功能概念\" tabindex=\"-1\">02 / 函數與功能概念 <a class=\"header-anchor\" href=\"#_02-函數與功能概念\" aria-label=\"Permalink to &quot;02 / 函數與功能概念&quot;\">​</a></h2><table tabindex=\"0\"><thead><tr><th>功能</th><th>本範例函數</th><th>回傳 / 輸出</th></tr></thead><tbody><tr><td>讀取數值</td><td><code>read_demo_distance()</code></td><td>模擬距離，單位 mm</td></tr><tr><td>門檻判斷</td><td><code>is_near(distance_mm, threshold_mm)</code></td><td>布林值</td></tr><tr><td>顯示結果</td><td><code>print(message)</code></td><td>主控台訊息</td></tr></tbody></table><p>以上為本示例定義的函數，並非產品 API。正式驅動確認後，將模擬讀值函數替換為實際讀取函數。</p><h2 id=\"example\">03 / 範例程式</h2><div class=\"language-python vp-adaptive-theme\"><button title=\"Copy Code\" class=\"copy\"></button><span class=\"lang\">python</span><pre class=\"shiki shiki-themes github-light github-dark vp-code\" tabindex=\"0\"><code><span class=\"line\"><span style=\"--shiki-light:#6A737D;--shiki-dark:#6A737D;\">## 使用教學 · SPIKE · Pybricks Python</span></span>\n<span class=\"line\"><span style=\"--shiki-light:#D73A49;--shiki-dark:#F97583;\">def</span><span style=\"--shiki-light:#6F42C1;--shiki-dark:#B392F0;\"> read_demo_distance</span><span style=\"--shiki-light:#24292E;--shiki-dark:#E1E4E8;\">():</span></span>\n<span class=\"line\"><span style=\"--shiki-light:#D73A49;--shiki-dark:#F97583;\">    return</span><span style=\"--shiki-light:#005CC5;--shiki-dark:#79B8FF;\"> 150</span></span>\n<span class=\"line\"></span>\n<span class=\"line\"><span style=\"--shiki-light:#D73A49;--shiki-dark:#F97583;\">def</span><span style=\"--shiki-light:#6F42C1;--shiki-dark:#B392F0;\"> is_near</span><span style=\"--shiki-light:#24292E;--shiki-dark:#E1E4E8;\">(distance_mm, threshold_mm</span><span style=\"--shiki-light:#D73A49;--shiki-dark:#F97583;\">=</span><span style=\"--shiki-light:#005CC5;--shiki-dark:#79B8FF;\">200</span><span style=\"--shiki-light:#24292E;--shiki-dark:#E1E4E8;\">):</span></span>\n<span class=\"line\"><span style=\"--shiki-light:#D73A49;--shiki-dark:#F97583;\">    return</span><span style=\"--shiki-light:#24292E;--shiki-dark:#E1E4E8;\"> distance_mm </span><span style=\"--shiki-light:#D73A49;--shiki-dark:#F97583;\">&lt;</span><span style=\"--shiki-light:#24292E;--shiki-dark:#E1E4E8;\"> threshold_mm</span></span>\n<span class=\"line\"></span>\n<span class=\"line\"><span style=\"--shiki-light:#24292E;--shiki-dark:#E1E4E8;\">distance </span><span style=\"--shiki-light:#D73A49;--shiki-dark:#F97583;\">=</span><span style=\"--shiki-light:#24292E;--shiki-dark:#E1E4E8;\"> read_demo_distance()</span></span>\n<span class=\"line\"><span style=\"--shiki-light:#005CC5;--shiki-dark:#79B8FF;\">print</span><span style=\"--shiki-light:#24292E;--shiki-dark:#E1E4E8;\">(</span><span style=\"--shiki-light:#032F62;--shiki-dark:#9ECBFF;\">&quot;Distance:&quot;</span><span style=\"--shiki-light:#24292E;--shiki-dark:#E1E4E8;\">, distance, </span><span style=\"--shiki-light:#032F62;--shiki-dark:#9ECBFF;\">&quot;mm&quot;</span><span style=\"--shiki-light:#24292E;--shiki-dark:#E1E4E8;\">)</span></span>\n<span class=\"line\"><span style=\"--shiki-light:#D73A49;--shiki-dark:#F97583;\">if</span><span style=\"--shiki-light:#24292E;--shiki-dark:#E1E4E8;\"> is_near(distance):</span></span>\n<span class=\"line\"><span style=\"--shiki-light:#005CC5;--shiki-dark:#79B8FF;\">    print</span><span style=\"--shiki-light:#24292E;--shiki-dark:#E1E4E8;\">(</span><span style=\"--shiki-light:#032F62;--shiki-dark:#9ECBFF;\">&quot;Object nearby&quot;</span><span style=\"--shiki-light:#24292E;--shiki-dark:#E1E4E8;\">)</span></span>\n<span class=\"line\"><span style=\"--shiki-light:#D73A49;--shiki-dark:#F97583;\">else</span><span style=\"--shiki-light:#24292E;--shiki-dark:#E1E4E8;\">:</span></span>\n<span class=\"line\"><span style=\"--shiki-light:#005CC5;--shiki-dark:#79B8FF;\">    print</span><span style=\"--shiki-light:#24292E;--shiki-dark:#E1E4E8;\">(</span><span style=\"--shiki-light:#032F62;--shiki-dark:#9ECBFF;\">&quot;Path clear&quot;</span><span style=\"--shiki-light:#24292E;--shiki-dark:#E1E4E8;\">)</span></span></code></pre></div><h2 id=\"_04-動手練習\" tabindex=\"-1\">04 / 動手練習 <a class=\"header-anchor\" href=\"#_04-動手練習\" aria-label=\"Permalink to &quot;04 / 動手練習&quot;\">​</a></h2><p>把模擬距離從 <code>150</code> 改為 <code>300</code>。門檻為 <code>200</code> mm 時，結果會切換成「通道暢通」。數值剛好等於 <code>200</code> 時也不觸發接近判斷，因為條件使用 <code>&lt;</code>。</p><h2 id=\"常見問題\" tabindex=\"-1\">常見問題 <a class=\"header-anchor\" href=\"#常見問題\" aria-label=\"Permalink to &quot;常見問題&quot;\">​</a></h2><table tabindex=\"0\"><thead><tr><th>情況</th><th>檢查方式</th></tr></thead><tbody><tr><td>沒有真實感測器讀值</td><td>本範例使用模擬資料，需補上正式產品驅動。</td></tr><tr><td>找不到對應積木</td><td>產品擴充尚待提供，本頁先展示概念流程。</td></tr><tr><td>數值單位不同</td><td>先確認驅動是否回傳 mm，再進行比較。</t -level=\"2\" class=\"outline-title\" id=\"doc-outline-aria-label\" role=\"heading\" data-v-9edb41bb>On this page</div><ul class=\"VPDocOutlineItem root\" data-v-9edb41bb data-v-a20af3d2><!--[--><!--]--></ul></div></nav><!--[--><!--]--><div class=\"spacer\" data-v-e1b13a4a></div><!--[--><!--]--><!----><!--[--><!--]--><!--[--><!--]--></div></div></div></div><div class=\"content\" data-v-220728f0><div class=\"content-container\" data-v-220728f0><!--[--><!--]--><main class=\"main\" data-v-220728f0><div style=\"position:relative;\" class=\"vp-doc _mbc-docs_products_S8_ev3-python\" data-v-220728f0><div><h1 id=\"mbc-8-路巡跡板-·-ev3-·-pybricks-python\" tabindex=\"-1\">MBC 8 路巡跡板 · EV3 · Pybricks Python <a class=\"header-anchor\" href=\"#mbc-8-路巡跡板-·-ev3-·-pybricks-python\" aria-label=\"Permalink to &quot;MBC 8 路巡跡板 · EV3 · Pybricks Python&quot;\">​</a></h1><h2 id=\"產品介紹\" tabindex=\"-1\">產品介紹 <a class=\"header-anchor\" href=\"#產品介紹\" aria-label=\"Permalink to &quot;產品介紹&quot;\">​</a></h2><p>讓機器人感知前方，從距離讀值到條件控制，一步步建立你的第一個感測應用。</p><div class=\"warning custom-block\"><p class=\"custom-block-title\">版本相容性</p><p>MBC S8 巡跡板共有3種版本(SPIKE / EV3 / 一般I2C開發版)，版本間不相容，請謹慎選擇。</p></div><div class=\"feature-grid\"><div class=\"feature-box\"><strong>高速循線</strong><small>簡單易上手的高速循線感應器。</small></div><div class=\"feature-box\"><strong>路口判斷</strong><small>準確判斷黑線路口。</small></div><div class=\"feature-box\"><strong>核心算法</strong><small>抗干擾、內建率波演算法。</small></div></div><h3 id=\"產品概覽\" tabindex=\"-1\">產品概覽 <a class=\"header-anchor\" href=\"#產品概覽\" aria-label=\"Permalink to &quot;產品概覽&quot;\">​</a></h3><p>距離感測可以用於障礙物偵測、接近提示與保持間距。讀取感測器數值後，程式便能根據條件執行不同動作。</p><table tabindex=\"0\"><thead><tr><th>項目</th><th>目前狀態</th></tr></thead><tbody><tr><td>產品型號 / 照片</td><td>待甲方提供</td></tr><tr><td>量測範圍與精度</td><td>待正式規格確認</td></tr><tr><td>接頭與通訊方式</td><td>待硬體介面確認</td></tr><tr><td>EV3 / SPIKE 相容性</td><td>待驅動與韌體驗證</td></tr><tr><td>程式環境</td><td>本版展示四條教學路徑</td></tr></tbody></table><h3 id=\"開始之前\" tabindex=\"-1\">開始之前 <a class=\"header-anchor\" href=\"#開始之前\" aria-label=\"Permalink to &quot;開始之前&quot;\">​</a></h3><ol><li>確認你的控制器與 MBC S8 巡跡板版本是否相同。</li><li>進行感應器正規化與校正。</li><li>通電後感應器上的綠色心跳指示燈 (靠近插座) 會開始閃爍。</li></ol><h3 id=\"校正與正規化\" tabindex=\"-1\">校正與正規化 <a class=\"header-anchor\" href=\"#校正與正規化\" aria-label=\"Permalink to &quot;校正與正規化&quot;\">​</a></h3><ol><li>按下校準按鈕：按住感應器上的校準按鈕 0.5 秒，直到 🟢 綠色校準指示燈 (靠近校準按鈕) 保持亮起。</li><li>開始掃描：將感應器在場地黑線與白色區塊上來回移動。</li><li>保持高度：感應器距離地面 0.5 ~ 1.2 公分為佳。</li><li>等待完成：等待 🟢 綠色校準指示燈熄滅，校準完成。</li></ol><h2 id=\"使用教學-·-ev3-·-pybricks-python\" tabindex=\"-1\">使用教學 · EV3 · Pybricks Python <a class=\"header-anchor\" href=\"#使用教學-·-ev3-·-pybricks-python\" aria-label=\"Permalink to &quot;使用教學 · EV3 · Pybricks Python&quot;\">​</a></h2><p>從連接準備、函數概念到範例流程，練習讀取與判斷距離。</p><div class=\"warning custom-block\"><p class=\"custom-block-title\">示意教學</p><p>目前尚無產品驅動與正式 API。下方範例使用模擬讀值，不會與感測器通訊；實際產品相容性需先驗證。</p></div><h2 id=\"_01-環境準備\" tabindex=\"-1\">01 / 環境準備 <a class=\"header-anchor\" href=\"#_01-環境準備\" aria-label=\"Permalink to &quot;01 / 環境準備&quot;\">​</a></h2><p>準備 EV3 與適用的 EV3 Pybricks 環境，先確認產品驅動支援此組合。</p><ol><li>取得產品接線圖與驅動套件。</li><li>確認連接埠與數值單位。</li><li>先完成單次數值讀取，再加入迴圈。</li></ol><h2 id=\"_02-函數與功能概念\" tabindex=\"-1\">02 / 函數與功能概念 <a class=\"header-anchor\" href=\"#_02-函數與功能概念\" aria-label=\"Permalink to &quot;02 / 函數與功能概念&quot;\">​</a></h2><table tabindex=\"0\"><thead><tr><th>功能</th><th>本範例函數</th><th>回傳 / 輸出</th></tr></thead><tbody><tr><td>讀取數值</td><td><code>read_demo_distance()</code></td><td>模擬距離，單位 mm</td></tr><tr><td>門檻判斷</td><td><code>is_near(distance_mm, threshold_mm)</code></td><td>布林值</td></tr><tr><td>顯示結果</td><td><code>print(message)</code></td><td>主控台訊息</td></tr></tbody></table><p>以上為本示例定義的函數，並非產品 API。正式驅動確認後，將模擬讀值函數替換為實際讀取函數。</p><h2 id=\"example\">03 / 範例程式</h2><div class=\"language-python vp-adaptive-theme\"><button title=\"Copy Code\" class=\"copy\"></button><span class=\"lang\">python</span><pre class=\"shiki shiki-themes github-light github-dark vp-code\" tabindex=\"0\"><code><span class=\"line\"><span style=\"--shiki-light:#6A737D;--shiki-dark:#6A737D;\">## 使用教學 · EV3 · Pybricks Python</span></span>\n<span class=\"line\"><span style=\"--shiki-light:#D73A49;--shiki-dark:#F97583;\">def</span><span style=\"--shiki-light:#6F42C1;--shiki-dark:#B392F0;\"> read_demo_distance</span><span style=\"--shiki-light:#24292E;--shiki-dark:#E1E4E8;\">():</span></span>\n<span class=\"line\"><span style=\"--shiki-light:#D73A49;--shiki-dark:#F97583;\">    return</span><span style=\"--shiki-light:#005CC5;--shiki-dark:#79B8FF;\"> 150</span></span>\n<span class=\"line\"></span>\n<span class=\"line\"><span style=\"--shiki-light:#D73A49;--shiki-dark:#F97583;\">def</span><span style=\"--shiki-light:#6F42C1;--shiki-dark:#B392F0;\"> is_near</span><span style=\"--shiki-light:#24292E;--shiki-dark:#E1E4E8;\">(distance_mm, threshold_mm</span><span style=\"--shiki-light:#D73A49;--shiki-dark:#F97583;\">=</span><span style=\"--shiki-light:#005CC5;--shiki-dark:#79B8FF;\">200</span><span style=\"--shiki-light:#24292E;--shiki-dark:#E1E4E8;\">):</span></span>\n<span class=\"line\"><span style=\"--shiki-light:#D73A49;--shiki-dark:#F97583;\">    return</span><span style=\"--shiki-light:#24292E;--shiki-dark:#E1E4E8;\"> distance_mm </span><span style=\"--shiki-light:#D73A49;--shiki-dark:#F97583;\">&lt;</span><span style=\"--shiki-light:#24292E;--shiki-dark:#E1E4E8;\"> threshold_mm</span></span>\n<span class=\"line\"></span>\n<span class=\"line\"><span style=\"--shiki-light:#24292E;--shiki-dark:#E1E4E8;\">distance </span><span style=\"--shiki-light:#D73A49;--shiki-dark:#F97583;\">=</span><span style=\"--shiki-light:#24292E;--shiki-dark:#E1E4E8;\"> read_demo_distance()</span></span>\n<span class=\"line\"><span style=\"--shiki-light:#005CC5;--shiki-dark:#79B8FF;\">print</span><span style=\"--shiki-light:#24292E;--shiki-dark:#E1E4E8;\">(</span><span style=\"--shiki-light:#032F62;--shiki-dark:#9ECBFF;\">&quot;Distance:&quot;</span><span style=\"--shiki-light:#24292E;--shiki-dark:#E1E4E8;\">, distance, </span><span style=\"--shiki-light:#032F62;--shiki-dark:#9ECBFF;\">&quot;mm&quot;</span><span style=\"--shiki-light:#24292E;--shiki-dark:#E1E4E8;\">)</span></span>\n<span class=\"line\"><span style=\"--shiki-light:#D73A49;--shiki-dark:#F97583;\">if</span><span style=\"--shiki-light:#24292E;--shiki-dark:#E1E4E8;\"> is_near(distance):</span></span>\n<span class=\"line\"><span style=\"--shiki-light:#005CC5;--shiki-dark:#79B8FF;\">    print</span><span style=\"--shiki-light:#24292E;--shiki-dark:#E1E4E8;\">(</span><span style=\"--shiki-light:#032F62;--shiki-dark:#9ECBFF;\">&quot;Object nearby&quot;</span><span style=\"--shiki-light:#24292E;--shiki-dark:#E1E4E8;\">)</span></span>\n<span class=\"line\"><span style=\"--shiki-light:#D73A49;--shiki-dark:#F97583;\">else</span><span style=\"--shiki-light:#24292E;--shiki-dark:#E1E4E8;\">:</span></span>\n<span class=\"line\"><span style=\"--shiki-light:#005CC5;--shiki-dark:#79B8FF;\">    print</span><span style=\"--shiki-light:#24292E;--shiki-dark:#E1E4E8;\">(</span><span style=\"--shiki-light:#032F62;--shiki-dark:#9ECBFF;\">&quot;Path clear&quot;</span><span style=\"--shiki-light:#24292E;--shiki-dark:#E1E4E8;\">)</span></span></code></pre></div><h2 id=\"_04-動手練習\" tabindex=\"-1\">04 / 動手練習 <a class=\"header-anchor\" href=\"#_04-動手練習\" aria-label=\"Permalink to &quot;04 / 動手練習&quot;\">​</a></h2><p>把模擬距離從 <code>150</code> 改為 <code>300</code>。門檻為 <code>200</code> mm 時，結果會切換成「通道暢通」。數值剛好等於 <code>200</code> 時也不觸發接近判斷，因為條件使用 <code>&lt;</code>。</p><h2 id=\"常見問題\" tabindex=\"-1\">常見問題 <a class=\"header-anchor\" href=\"#常見問題\" aria-label=\"Permalink to &quot;常見問題&quot;\">​</a></h2><table tabindex=\"0\"><thead><tr><th>情況</th><th>檢查方式</th></tr></thead><tbody><tr><td>沒有真實感測器讀值</td><td>本範例使用模擬資料，需補上正式產品驅動。</td></tr><tr><td>找不到對應積木</td><td>產品擴充尚待提供，本頁先展示概念流程。</td></tr><tr><td>數值單位不同</td><td>先確認驅動是否回傳 mm，再進行比較。</td></tr></tbody></table><p><a href=\"/mbc-docs/\">回首頁選擇其他教學</a></p></div></div></main><!----><!--[--><!--]-- this page</div><ul class=\"VPDocOutlineItem root\" data-v-9edb41bb data-v-a20af3d2><!--[--><!--]--></ul></div></nav><!--[--><!--]--><div class=\"spacer\" data-v-e1b13a4a></div><!--[--><!--]--><!----><!--[--><!--]--><!--[--><!--]--></div></div></div></div><div class=\"content\" data-v-220728f0><div class=\"content-container\" data-v-220728f0><!--[--><!--]--><main class=\"main\" data-v-220728f0><div style=\"position:relative;\" class=\"vp-doc _mbc-docs_products_S8_spike-block\" data-v-220728f0><div><h1 id=\"mbc-8-路巡跡板-·-spike-·-pybricks-block\" tabindex=\"-1\">MBC 8 路巡跡板 · SPIKE · Pybricks Block <a class=\"header-anchor\" href=\"#mbc-8-路巡跡板-·-spike-·-pybricks-block\" aria-label=\"Permalink to &quot;MBC 8 路巡跡板 · SPIKE · Pybricks Block&quot;\">​</a></h1><h2 id=\"產品介紹\" tabindex=\"-1\">產品介紹 <a class=\"header-anchor\" href=\"#產品介紹\" aria-label=\"Permalink to &quot;產品介紹&quot;\">​</a></h2><p>讓機器人感知前方，從距離讀值到條件控制，一步步建立你的第一個感測應用。</p><div class=\"warning custom-block\"><p class=\"custom-block-title\">版本相容性</p><p>MBC S8 巡跡板共有3種版本(SPIKE / EV3 / 一般I2C開發版)，版本間不相容，請謹慎選擇。</p></div><div class=\"feature-grid\"><div class=\"feature-box\"><strong>高速循線</strong><small>簡單易上手的高速循線感應器。</small></div><div class=\"feature-box\"><strong>路口判斷</strong><small>準確判斷黑線路口。</small></div><div class=\"feature-box\"><strong>核心算法</strong><small>抗干擾、內建率波演算法。</small></div></div><h3 id=\"產品概覽\" tabindex=\"-1\">產品概覽 <a class=\"header-anchor\" href=\"#產品概覽\" aria-label=\"Permalink to &quot;產品概覽&quot;\">​</a></h3><p>距離感測可以用於障礙物偵測、接近提示與保持間距。讀取感測器數值後，程式便能根據條件執行不同動作。</p><table tabindex=\"0\"><thead><tr><th>項目</th><th>目前狀態</th></tr></thead><tbody><tr><td>產品型號 / 照片</td><td>待甲方提供</td></tr><tr><td>量測範圍與精度</td><td>待正式規格確認</td></tr><tr><td>接頭與通訊方式</td><td>待硬體介面確認</td></tr><tr><td>EV3 / SPIKE 相容性</td><td>待驅動與韌體驗證</td></tr><tr><td>程式環境</td><td>本版展示四條教學路徑</td></tr></tbody></table><h3 id=\"開始之前\" tabindex=\"-1\">開始之前 <a class=\"header-anchor\" href=\"#開始之前\" aria-label=\"Permalink to &quot;開始之前&quot;\">​</a></h3><ol><li>確認你的控制器與 MBC S8 巡跡板版本是否相同。</li><li>進行感應器正規化與校正。</li><li>通電後感應器上的綠色心跳指示燈 (靠近插座) 會開始閃爍。</li></ol><h3 id=\"校正與正規化\" tabindex=\"-1\">校正與正規化 <a class=\"header-anchor\" href=\"#校正與正規化\" aria-label=\"Permalink to &quot;校正與正規化&quot;\">​</a></h3><ol><li>按下校準按鈕：按住感應器上的校準按鈕 0.5 秒，直到 🟢 綠色校準指示燈 (靠近校準按鈕) 保持亮起。</li><li>開始掃描：將感應器在場地黑線與白色區塊上來回移動。</li><li>保持高度：感應器距離地面 0.5 ~ 1.2 公分為佳。</li><li>等待完成：等待 🟢 綠色校準指示燈熄滅，校準完成。</li></ol><h2 id=\"使用教學-·-spike-·-pybricks-block\" tabindex=\"-1\">使用教學 · SPIKE · Pybricks Block <a class=\"header-anchor\" href=\"#使用教學-·-spike-·-pybricks-block\" aria-label=\"Permalink to &quot;使用教學 · SPIKE · Pybricks Block&quot;\">​</a></h2><p>從連接準備、函數概念到範例流程，練習讀取與判斷距離。</p><div class=\"warning custom-block\"><p class=\"custom-block-title\">示意教學</p><p>目前尚無產品驅動與正式 API。下方範例使用模擬讀值，不會與感測器通訊；實際產品相容性需先驗證。</p></div><h2 id=\"_01-環境準備\" tabindex=\"-1\">01 / 環境準備 <a class=\"header-anchor\" href=\"#_01-環境準備\" aria-label=\"Permalink to &quot;01 / 環境準備&quot;\">​</a></h2><p>準備 SPIKE 控制器與對應的 Pybricks 程式環境。變更韌體前，先確認產品驅動與韌體需求。</p><ol><li>取得產品接線圖與驅動套件。</li><li>確認連接埠與數值單位。</li><li>先完成單次數值讀取，再加入迴圈。</li></ol><h2 id=\"_02-函數與功能概念\" tabindex=\"-1\">02 / 函數與功能概念 <a class=\"header-anchor\" href=\"#_02-函數與功能概念\" aria-label=\"Permalink to &quot;02 / 函數與功能概念&quot;\">​</a></h2><table tabindex=\"0\"><thead><tr><th>功能</th><th>本範例函數</th><th>回傳 / 輸出</th></tr></thead><tbody><tr><td>讀取數值</td><td><code>read_demo_distance()</code></td><td>模擬距離，單位 mm</td></tr><tr><td>門檻判斷</td><td><code>is_near(distance_mm, threshold_mm)</code></td><td>布林值</td></tr><tr><td>顯示結果</td><td><code>print(message)</code></td><td>主控台訊息</td></tr></tbody></table><p>以上為本示例定義的函數，並非產品 API。正式驅動確認後，將模擬讀值函數替換為實際讀取函數。</p><h2 id=\"example\">03 / 範例程式</h2><p>以下展示積木邏輯順序。正式產品擴充積木與可匯入專案，將在資料確認後補上。</p><div class=\"block-flow\"><div>當程式開始</div><div>設定門檻值為 200 mm</div><div>設定模擬距離為 150 mm</div><div>如果 距離 &lt; 門檻值</div><div>顯示「前方有物體」</div></div><h2 id=\"_04-動手練習\" tabindex=\"-1\">04 / 動手練習 <a class=\"header-anchor\" href=\"#_04-動手練習\" aria-label=\"Permalink to &quot;04 / 動手練習&quot;\">​</a></h2><p>把模擬距離從 <code>150</code> 改為 <code>300</code>。門檻為 <code>200</code> mm 時，結果會切換成「通道暢通」。數值剛好等於 <code>200</code> 時也不觸發接近判斷，因為條件使用 <code>&lt;</code>。</p><h2 id=\"常見問題\" tabindex=\"-1\">常見問題 <a class=\"header-anchor\" href=\"#常見問題\" aria-label=\"Permalink to &quot;常見問題&quot;\">​</a></h2><table tabindex=\"0\"><thead><tr><th>情況</th><th>檢查方式</th></tr></thead><tbody><tr><td>沒有真實感測器讀值</td><td>本範例使用模擬資料，需補上正式產品驅動。</td></tr><tr><td>找不到對應積木</td><td>產品擴充尚待提供，本頁先展示概念流程。</td></tr><tr><td>數值單位不同</td><td>先確認驅動是否回傳 mm，再進行比較。</td></tr></tbody></table><p><a href=\"/mbc-docs/\">回首頁選擇其他教學</a></p></div></div></main><!----><!--[--><!--]--></div></div></div><!--[--><!--]--></div></div><!----><!--[--><!--]--></div></div>\n    \n    \n  ", "/products/S8/ev3-clev3r.html": "\n    <div id=\"app\"><div class=\"Layout\" data-v-99598d5d><!--[--><!--]--><!--[--><span tabindex=\"-1\" data-v-68b79384></span><a href=\"#VPContent\" class=\"VPSkipLink visually-hidden\" data-v-68b79384>Skip to content</a><!--]--><!----><header class=\"VPNav\" data-v-99598d5d data-v-b30964d7><div class=\"VPNavBar\" data-v-b30964d7 data-v-a57f7b4c><div class=\"wrapper\" data-v-a57f7b4c><div class=\"container\" data-v-a57f7b4c><div class=\"title\" data-v-a57f7b4c><div class=\"VPNavBarTitle\" data-v-a57f7b4c data-v-95edfb70><a class=\"title\" href=\"/mbc-docs/\" data-v-95edfb70><!--[--><!--]--><!--[--><img class=\"VPImage logo\" src=\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA0MCA0MCI+PHJlY3Qgd2lkdGg9IjQwIiBoZWlnaHQ9IjQwIiByeD0iMTAiIGZpbGw9IiMzNjM2MzYiLz48cGF0aCBkPSJNOSAyOSAyMCA5bDExIDIwaC03bC00LTgtNCA4WiIgZmlsbD0iIzE2MTYxNiIvPjwvc3ZnPg==\" alt data-v-802dc540><!--]--><span data-v-95edfb70>AWRECKER</span><!--[--><!--]--></a></div></div><div class=\"content\" data-v-a57f7b4c><div class=\"content-body\" data-v-a57f7b4c><!--[--><!--]--><div class=\"VPNavBarSearch search\" data-v-a57f7b4c><!----></div><nav aria-labelledby=\"main-nav-aria-la  tabindex=\"-1\">產品概覽 <a class=\"header-anchor\" href=\"#產品概覽\" aria-label=\"Permalink to &quot;產品概覽&quot;\">​</a></h3><p>距離感測可以用於障礙物偵測、接近提示與保持間距。讀取感測器數值後，程式便能根據條件執行不同動作。</p><table tabindex=\"0\"><thead><tr><th>項目</th><th>目前狀態</th></tr></thead><tbody><tr><td>產品型號 / 照片</td><td>待甲方提供</td></tr><tr><td>量測範圍與精度</td><td>待正式規格確認</td></tr><tr><td>接頭與通訊方式</td><td>待硬體介面確認</td></tr><tr><td>EV3 / SPIKE 相容性</td><td>待驅動與韌體驗證</td></tr><tr><td>程式環境</td><td>本版展示四條教學路徑</td></tr></tbody></table><h3 id=\"開始之前\" tabindex=\"-1\">開始之前 <a class=\"header-anchor\" href=\"#開始之前\" aria-label=\"Permalink to &quot;開始之前&quot;\">​</a></h3><ol><li>確認你的控制器與 MBC S8 巡跡板版本是否相同。</li><li>進行感應器正規化與校正。</li><li>通電後感應器上的綠色心跳指示燈 (靠近插座) 會開始閃爍。</li></ol><h3 id=\"校正與正規化\" tabindex=\"-1\">校正與正規化 <a class=\"header-anchor\" href=\"#校正與正規化\" aria-label=\"Permalink to &quot;校正與正規化&quot;\">​</a></h3><ol><li>按下校準按鈕：按住感應器上的校準按鈕 0.5 秒，直到 🟢 綠色校準指示燈 (靠近校準按鈕) 保持亮起。</li><li>開始掃描：將感應器在場地黑線與白色區塊上來回移動。</li><li>保持高度：感應器距離地面 0.5 ~ 1.2 公分為佳。</li><li>等待完成：等待 🟢 綠色校準指示燈熄滅，校準完成。</li></ol><h2 id=\"使用教學-s8-ev3-clev3r-app\" tabindex=\"-1\">使用教學 (S8 + EV3 + clev3r App) <a class=\"header-anchor\" href=\"#使用教學-s8-ev3-clev3r-app\" aria-label=\"Permalink to &quot;使用教學 (S8 + EV3 + clev3r App)&quot;\">​</a></h2><div class=\"warning custom-block\"><p class=\"custom-block-title\">教學內容待補</p><p>此環境已列入產品的教學選項，但尚未提供對應教學。請補上正式使用說明、函數與範例程式；本頁未提供可操作硬體的程式。</p></div><h3 id=\"環境準備\" tabindex=\"-1\">環境準備 <a class=\"header-anchor\" href=\"#環境準備\" aria-label=\"Permalink to &quot;環境準備&quot;\">​</a></h3><p>待補。</p><h3 id=\"函數與功能\" tabindex=\"-1\">函數與功能 <a class=\"header-anchor\" href=\"#函數與功能\" aria-label=\"Permalink to &quot;函數與功能&quot;\">​</a></h3><p>待補。</p><h3 id=\"範例程式\" tabindex=\"-1\">範例程式 <a class=\"header-anchor\" href=\"#範例程式\" aria-label=\"Permalink to &quot;範例程式&quot;\">​</a></h3><p>待補。</p><p><a href=\"/mbc-docs/\">回首頁選擇其他教學</a></p></div></div></main><!----><!--[--><!--]--></div></div></div><!--[--><!--]--></div></div><!----><!--[--><!--]--></div></di index=\"-1\">校正與正規化 <a class=\"header-anchor\" href=\"#校正與正規化\" aria-label=\"Permalink to &quot;校正與正規化&quot;\">​</a></h3><ol><li>按下校準按鈕：按住感應器上的校準按鈕 0.5 秒，直到 🟢 綠色校準指示燈 (靠近校準按鈕) 保持亮起。</li><li>開始掃描：將感應器在場地黑線與白色區塊上來回移動。</li><li>保持高度：感應器距離地面 0.5 ~ 1.2 公分為佳。</li><li>等待完成：等待 🟢 綠色校準指示燈熄滅，校準完成。</li></ol><h2 id=\"使用教學-s8-spike-spike-app\" tabindex=\"-1\">使用教學 (S8 + SPIKE + SPIKE App) <a class=\"header-anchor\" href=\"#使用教學-s8-spike-spike-app\" aria-label=\"Permalink to &quot;使用教學 (S8 + SPIKE + SPIKE App)&quot;\">​</a></h2><div class=\"warning custom-block\"><p class=\"custom-block-title\">WARNING</p><p>在官方 SPIKE App 中，S8 巡跡板將以「SPIKE 顏色感應器」模式運作。</p></div><h2 id=\"_01-環境準備\" tabindex=\"-1\">01 / 環境準備 <a class=\"header-anchor\" href=\"#_01-環境準備\" aria-label=\"Permalink to &quot;01 / 環境準備&quot;\">​</a></h2><p>準備 SPIKE 控制器與 SPIKE App。變更韌體前，先確認產品驅動與韌體需求。</p><ol><li>取得產品接線圖與驅動套件。</li><li>確認連接埠與數值單位。</li><li>先完成單次數值讀取，再加入迴圈。</li></ol><h2 id=\"_02-函數與功能概念\" tabindex=\"-1\">02 / 函數與功能概念 <a class=\"header-anchor\" href=\"#_02-函數與功能概念\" aria-label=\"Permalink to &quot;02 / 函數與功能概念&quot;\">​</a></h2><table tabindex=\"0\"><thead><tr><th>官方圖形指令</th><th>S8 量測數值</th><th>回傳數值意義</th></tr></thead><tbody><tr><td><img src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAARAAAABkCAYAAABOzm92AAAAAXNSR0IArs4c6QAAAARnQU1BAACxjwv8YQUAAAAJcEhZcwAAHYcAAB2HAY/l8WUAACPZSURBVHhe7Z15dFzVnec/79VepZJKuyzZ2ozlFcsLNgaMN0jTAWIgQHJICNghPZmc09OBpLuzdKcDfZKenqRJSHeGnJ5sJiFNmA6Jk46dSWJs4xi8gSWv8qrNLllLqapU+6vlvfmjVLL0vKkWqWTxPue8c/Tqd1WSrup+3+/+7u/+rhCLxRQ0NDQ0MkBUv6ChoaExXjQB0dDQyBhNQDQ0NDJGExANDY2M0QREQ0MjYzQB0dDQyBhNQDQ0NDJGExANDY2M0QREQ0MjYzQB0dDQyBhNQDQ0NDJGExANDY2M0QREQ0MjY3ImIIqiIMsyijJ1N/emfsepys3Qh2j9mBOmSx8KudjOrygK8XgcSZIQBAGz2YxOp1M3yyuKohCJRIjH45hMJgwGA4IgqJvljZuhD9H6MSdMpz7MiQeiKAqSJOF2u3G73QSDQXWTvBOPx/H7/bjdbrxeL4lEQt0kr9wMfYjWjzlhOvVhTgREEISRy2AwYDAY1E3yjigm/1RRFKec4nOT9CFaP+aE6dSHOZnCACQSCYLBIAaDAYvFojanhTccZX9XL+1uH96wRG9IwhOO4otECUnJS0NjuiCKIlaTAavJhN2kp9RiosJipMhiYk5ZEbfXVlJoNqq/bUIZ73jOmYBky5GeQQ block-flow\"><div>當程式開始</div><div>設定門檻值為 200 mm</div><div>設定模擬距離為 150 mm</div><div>如果 距離 &lt; 門檻值</div><div>顯示「前方有物體」</div></div><h2 id=\"_04-動手練習\" tabindex=\"-1\">04 / 動手練習 <a class=\"header-anchor\" href=\"#_04-動手練習\" aria-label=\"Permalink to &quot;04 / 動手練習&quot;\">​</a></h2><p>把模擬距離從 <code>150</code> 改為 <code>300</code>。門檻為 <code>200</code> mm 時，結果會切換成「通道暢通」。數值剛好等於 <code>200</code> 時也不觸發接近判斷，因為條件使用 <code>&lt;</code>。</p><h2 id=\"常見問題\" tabindex=\"-1\">常見問題 <a class=\"header-anchor\" href=\"#常見問題\" aria-label=\"Permalink to &quot;常見問題&quot;\">​</a></h2><table tabindex=\"0\"><thead><tr><th>情況</th><th>檢查方式</th></tr></thead><tbody><tr><td>沒有真實感測器讀值</td><td>本範例使用模擬資料，需補上正式產品驅動。</td></tr><tr><td>找不到對應積木</td><td>產品擴充尚待提供，本頁先展示概念流程。</td></tr><tr><td>數值單位不同</td><td>先確認驅動是否回傳 mm，再進行比較。</td></tr></tbody></table><p><a href=\"/mbc-docs/\">回首頁選擇其他教學</a></p></div></div></main><!----><!--[--><!--]--></div></div></div><!--[--><!--]--></div></div><!----><!--[--><!--]--></div></div>\n    \n    \n  ", "/products/S16/spike-python.html": "\n    <div id=\"app\"><div class=\"Layout\" data-v-99598d5d><!--[--><!--]--><!--[--><span tabindex=\"-1\" data-v-68b79384></span><a href=\"#VPContent\" class=\"VPSkipLink visually-hidden\" data-v-68b79384>Skip to content</a><!--]--><!----><header class=\"VPNav\" data-v-99598d5d data-v-b30964d7><div class=\"VPNavBar\" data-v-b30964d7 data-v-a57f7b4c><div class=\"wrapper\" data-v-a57f7b4c><div class=\"container\" data-v-a57f7b4c><div class=\"title\" data-v-a57f7b4c><div class=\"VPNavBarTitle\" data-v-a57f7b4c data-v-95edfb70><a class=\"title\" href=\"/mbc-docs/\" data-v-95edfb70><!--[--><!--]--><!--[--><img class=\"VPImage logo\" src=\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA0MCA0MCI+PHJlY3Qgd2lkdGg9IjQwIiBoZWlnaHQ9IjQwIiByeD0iMTAiIGZpbGw9IiMzNjM2MzYiLz48cGF0aCBkPSJNOSAyOSAyMCA5bDExIDIwaC03bC00LTgtNCA4WiIgZmlsbD0iIzE2MTYxNiIvPjwvc3ZnPg==\" alt data-v-802dc540><!--]--><span data-v-95edfb70>AWRE 8f0><div class=\"aside-curtain\" data-v-220728f0></div><div class=\"aside-container\" data-v-220728f0><div class=\"aside-content\" data-v-220728f0><div class=\"VPDocAside\" data-v-220728f0 data-v-e1b13a4a><!--[--><!--]--><!--[--><!--]--><nav aria-labelledby=\"doc-outline-aria-label\" class=\"VPDocAsideOutline\" data-v-e1b13a4a data-v-9edb41bb><div class=\"content\" data-v-9edb41bb><div class=\"outline-marker\" data-v-9edb41bb></div><div aria-level=\"2\" class=\"outline-title\" id=\"doc-outline-aria-label\" role=\"heading\" data-v-9edb41bb>On this page</div><ul class=\"VPDocOutlineItem root\" data-v-9edb41bb data-v-a20af3d2><!--[--><!--]--></ul></div></nav><!--[--><!--]--><div class=\"spacer\" data-v-e1b13a4a></div><!--[--><!--]--><!----><!--[--><!--]--><!--[--><!--]--></div></div></div></div><div class=\"content\" data-v-220728f0><div class=\"content-container\" data-v-220728f0><!--[--><!--]--><main class=\"main\" data-v-220728f0><div style=\"position:relative;\" class=\"vp-doc _mbc-docs_en_products_S8\" data-v-220728f0><div><h1 id=\"mbc-line-following-sensor-s8\" tabindex=\"-1\">MBC Line-Following Sensor S8 <a class=\"header-anchor\" href=\"#mbc-line-following-sensor-s8\" aria-label=\"Permalink to &quot;MBC Line-Following Sensor S8&quot;\">​</a></h1><h2 id=\"product-introduction\" tabindex=\"-1\">Product introduction <a class=\"header-anchor\" href=\"#product-introduction\" aria-label=\"Permalink to &quot;Product introduction&quot;\">​</a></h2><p>Explore distance readings, then use conditions to build your first sensing workflow.</p><div class=\"warning custom-block\"><p class=\"custom-block-title\">Product documentation preview</p><p>The product name and learning flow are illustrative. Measurement range, connectors, drivers and supported environments await confirmation. Examples are not production hardware code.</p></div><div class=\"feature-grid\"><div class=\"feature-box\"><strong>Sense distance</strong><small>Learn the basics of reading values and evaluating distance.</small></div><div class=\"feature-box\"><strong>React with code</strong><small>Use a threshold to define your robot’s response.</small></div><div class=\"feature-box\"><strong>Learn step by step</strong><small>Follow a guide for your controller and environment.</small></div></div><h3 id=\"product-overview\" tabindex=\"-1\">Product overview <a class=\"header-anchor\" href=\"#product-overview\" aria-label=\"Permalink to &quot;Product overview&quot;\">​</a></h3><p>Distance sensing can support obstacle detection, proximity feedback and spacing control. Read a value, evaluate a condition and trigger an appropriate action.</p><table tabindex=\"0\"><thead><tr><th>Item</th><th>Status</th></tr></thead><tbody><tr><td>Model / product photo</td><td>Awaiting client assets</td></tr><tr><td>Measurement range / accuracy</td><td>Awaiting specifications</td></tr><tr><td>Connector / protocol</td><td>Awaiting hardware details</td></tr><tr><td>EV3 / SPIKE compatibility</td><td>Driver and firmware verification required</td></tr><tr><td>Programming environment</td><td>Four demonstration learning paths</td></tr></tbody></table><h3 id=\"before-you-begin\" tabindex=\"-1\">Before you begin <a class=\"header-anchor\" href=\"#before-you-begin\" aria-label=\"Permalink to &quot;Before you begin&quot;\">​</a></h3><ol><li>Confirm your product version and controller. Follow the official wiring diagram.</li><li>Install the required programming environment and product driver.</li><li>Check raw readings before adding conditions or motor control.</li></ol><div class=\"tip custom-block\"><p class=\"custom-block-title\">Start with a reading</p><p>Begin by displaying a value. Confirm its units and stability before testing threshold logic. Wiring diagrams and driver links will be added when supplied.</p></div><h3 id=\"applications\" tabindex=\"-1\">Applications <a class=\"header-anchor\" href=\"#applications\" aria-label=\"Permalink to &quot;Applications&quot;\">​</a></h3><ul><li><strong>Obstacle detection</strong>: stop or turn when a reading is below a threshold.</li><li><strong>Proximity feedback</strong>: show a message or sound based on distance.</li><li><strong>Spacing control</strong>: use continuous readings as an input to your control logic.</li></ul><p><a href=\"/mbc-docs/en/\">Choose a learning path on the home page</a></p></div></div></main><!----><!--[--><!--]--></div></div></div><!--[--><!--]--></div></div><!----><!--[--><!--]--></div></div>\n    \n    \n  ", "/en/products/Hue12.html": "\n    <div id=\"app\"><div class=\"Layout\" data-v-99598d5d><!--[--><!--]--><!--[--><span tabindex=\"-1\" data-v-68b79384></span><a href=\"#VPContent\" class=\"VPSkipLink visually-hidden\" data-v-68b79384>Skip to content</a><!--]--><!----><header class=\"VPNav\" data-v-99598d5d data-v-b30964d7><div class=\"VPNavBar\" data-v-b30964d7 data-v-a57f7b4c><div class=\"wrapper\" data-v-a57f7b4c><div class=\"container\" data-v-a57f7b4c><div class=\"title\" data-v-a57f7b4c><div class=\"VPNavBarTitle\" data-v-a57f7b4c data-v-95edfb70><a class=\"title\" href=\"/mbc-docs/en/\" data-v-95edfb70><!--[--><!--]--><!--[--><img class=\"VPImage logo\" src=\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA0MCA0MCI+PHJlY3Qgd2lkdGg9IjQwIiBoZWlnaHQ9IjQwIiByeD0iMTAiIGZpbGw9IiMzNjM2MzYiLz48cGF0aCBkPSJNOSAyOSAyMCA5bDExIDIwaC03bC00LTgtNCA4WiIgZmlsbD0iIzE2MTYxNiIvPjwvc3ZnPg==\" alt data-v-802dc540><!--]--><span data-v-95edfb70>AWRECKER</span><!--[--><!--]--></a></div></div><div class=\"content\" data-v-a57f7b4c><div class=\"content-body\" data-v-a57f7b4c><!--[--><!--]--><div class=\"VPNavBarSearch search\" data-v-a57f7b4c><!----></div><nav aria-labelledby=\"main-nav-aria-label\" class=\"VPNavBarMenu menu\" data-v-a57f7b4c data-v-9537f28c><span id=\"main-nav-aria-label\" class=\"visually-hidden\" data-v-9537f28c> Main Navigation </span><!--[--><!--]--></nav><div class=\"VPFlyout VPNavBarTranslations translations\" data-v-a57f7b4c data-v-8fcac8a9 llowing Sensor S8 · EV3 · LabVIEW EV3-G&quot;\">​</a></h1><h2 id=\"product-introduction\" tabindex=\"-1\">Product introduction <a class=\"header-anchor\" href=\"#product-introduction\" aria-label=\"Permalink to &quot;Product introduction&quot;\">​</a></h2><p>Explore distance readings, then use conditions to build your first sensing workflow.</p><div class=\"warning custom-block\"><p class=\"custom-block-title\">Product documentation preview</p><p>The product name and learning flow are illustrative. Measurement range, connectors, drivers and supported environments await confirmation. Examples are not production hardware code.</p></div><div class=\"feature-grid\"><div class=\"feature-box\"><strong>Sense distance</strong><small>Learn the basics of reading values and evaluating distance.</small></div><div class=\"feature-box\"><strong>React with code</strong><small>Use a threshold to define your robot’s response.</small></div><div class=\"feature-box\"><strong>Learn step by step</strong><small>Follow a guide for your controller and environment.</small></div></div><h3 id=\"product-overview\" tabindex=\"-1\">Product overview <a class=\"header-anchor\" href=\"#product-overview\" aria-label=\"Permalink to &quot;Product overview&quot;\">​</a></h3><p>Distance sensing can support obstacle detection, proximity feedback and spacing control. Read a value, evaluate a condition and trigger an appropriate action.</p><table tabindex=\"0\"><thead><tr><th>Item</th><th>Status</th></tr></thead><tbody><tr><td>Model / product photo</td><td>Awaiting client assets</td></tr><tr><td>Measurement range / accuracy</td><td>Awaiting specifications</td></tr><tr><td>Connector / protocol</td><td>Awaiting hardware details</td></tr><tr><td>EV3 / SPIKE compatibility</td><td>Driver and firmware verification required</td></tr><tr><td>Programming environment</td><td>Four demonstration learning paths</td></tr></tbody></table><h3 id=\"before-you-begin\" tabindex=\"-1\">Before you begin <a class=\"header-anchor\" href=\"#before-you-begin\" aria-label=\"Permalink to &quot;Before you begin&quot;\">​</a></h3><ol><li>Confirm your product version and controller. Follow the official wiring diagram.</li><li>Install the required programming environment and product driver.</li><li>Check raw readings before adding conditions or motor control.</li></ol><div class=\"tip custom-block\"><p class=\"custom-block-title\">Start with a reading</p><p>Begin by displaying a value. Confirm its units and stability before testing threshold logic. Wiring diagrams and driver links will be added when supplied.</p></div><h3 id=\"applications\" tabindex=\"-1\">Applications <a class=\"header-anchor\" href=\"#applications\" aria-label=\"Permalink to &quot;Applications&quot;\">​</a></h3><ul><li><strong>Obstacle detection</strong>: stop or turn when a reading is below a threshold.</li><li><strong>Proximity feedback</strong>: show a message or sound based on distance.</li><li><strong>Spacing control</strong>: use continuous readings as an input to your control logic.</li></ul><h2 id=\"tutorial-s8-ev3-labview-ev3-g\" tabindex=\"-1\">Tutorial (S8 + EV3 + LabVIEW EV3-G) <a class=\"header-anchor\" href=\"#tutorial-s8-ev3-labview-ev3-g\" aria-label=\"Permalink to &quot;Tutorial (S8 + EV3 + LabVIEW EV3-G)&quot;\">​</a></h2><div class=\"warning custom-block\"><p class=\"custom-block-title\">Tutorial pending</p><p>This environment is listed in the product configuration, but its tutorial has not been supplied. Add setup instructions, API documentation and examples here. No hardware program is provided on this page.</p></div><h3 id=\"setup\" tabindex=\"-1\">Setup <a class=\"header-anchor\" href=\"#setup\" aria-label=\"Permalink to &quot;Setup&quot;\">​</a></h3><p>Pending.</p><h3 id=\"functions\" tabindex=\"-1\">Functions <a class=\"header-anchor\" href=\"#functions\" aria-label=\"Permalink to &quot;Functions&quot;\">​</a></h3><p>Pending.</p><h3 id=\"example-program\" tabindex=\"-1\">Example program <a class=\"heade  href=\"#mbc-line-following-sensor-s8-·-ev3-·-ev3-classroom-app\" aria-label=\"Permalink to &quot;MBC Line-Following Sensor S8 · EV3 · EV3 Classroom APP&quot;\">​</a></h1><h2 id=\"product-introduction\" tabindex=\"-1\">Product introduction <a class=\"header-anchor\" href=\"#product-introduction\" aria-label=\"Permalink to &quot;Product introduction&quot;\">​</a></h2><p>Explore distance readings, then use conditions to build your first sensing workflow.</p><div class=\"warning custom-block\"><p class=\"custom-block-title\">Product documentation preview</p><p>The product name and learning flow are illustrative. Measurement range, connectors, drivers and supported environments await confirmation. Examples are not production hardware code.</p></div><div class=\"feature-grid\"><div class=\"feature-box\"><strong>Sense distance</strong><small>Learn the basics of reading values and evaluating distance.</small></div><div class=\"feature-box\"><strong>React with code</strong><small>Use a threshold to define your robot’s response.</small></div><div class=\"feature-box\"><strong>Learn step by step</strong><small>Follow a guide for your controller and environment.</small></div></div><h3 id=\"product-overview\" tabindex=\"-1\">Product overview <a class=\"header-anchor\" href=\"#product-overview\" aria-label=\"Permalink to &quot;Product overview&quot;\">​</a></h3><p>Distance sensing can support obstacle detection, proximity feedback and spacing control. Read a value, evaluate a condition and trigger an appropriate action.</p><table tabindex=\"0\"><thead><tr><th>Item</th><th>Status</th></tr></thead><tbody><tr><td>Model / product photo</td><td>Awaiting client assets</td></tr><tr><td>Measurement range / accuracy</td><td>Awaiting specifications</td></tr><tr><td>Connector / protocol</td><td>Awaiting hardware details</td></tr><tr><td>EV3 / SPIKE compatibility</td><td>Driver and firmware verification required</td></tr><tr><td>Programming environment</td><td>Four demonstration learning paths</td></tr></tbody></table><h3 id=\"before-you-begin\" tabindex=\"-1\">Before you begin <a class=\"header-anchor\" href=\"#before-you-begin\" aria-label=\"Permalink to &quot;Before you begin&quot;\">​</a></h3><ol><li>Confirm your product version and controller. Follow the official wiring diagram.</li><li>Install the required programming environment and product driver.</li><li>Check raw readings before adding conditions or motor control.</li></ol><div class=\"tip custom-block\"><p class=\"custom-block-title\">Start with a reading</p><p>Begin by displaying a value. Confirm its units and stability before testing threshold logic. Wiring diagrams and driver links will be added when supplied.</p></div><h3 id=\"applications\" tabindex=\"-1\">Applications <a class=\"header-anchor\" href=\"#applications\" aria-label=\"Permalink to &quot;Applications&quot;\">​</a></h3><ul><li><strong>Obstacle detection</strong>: stop or turn when a reading is below a threshold.</li><li><strong>Proximity feedback</strong>: show a message or sound based on distance.</li><li><strong>Spacing control</strong>: use continuous readings as an input to your control logic.</li></ul><h2 id=\"tutorial-s8-ev3-ev3-classroom-app\" tabindex=\"-1\">Tutorial (S8 + EV3 + EV3 Classroom APP) <a class=\"header-anchor\" href=\"#tutorial-s8-ev3-ev3-classroom-app\" aria-label=\"Permalink to &quot;Tutorial (S8 + EV3 + EV3 Classroom APP)&quot;\">​</a></h2><div class=\"warning custom-block\"><p class=\"custom-block-title\">Tutorial pending</p><p>This environment is listed in the product configuration, but its tutorial has not been supplied. Add setup instructions, API documentation and examples here. No hardware program is provided on this page.</p></div><h3 id=\"setup\" tabindex=\"-1\">Setup <a class=\"header-anchor\" href=\"#setup\" aria-label=\"Permalink to &quot;Setup&quot;\">​</a></h3><p>Pending.</p><h3 id=\"functions\" tabindex=\"-1\">Functions <a class=\"header-anchor\" href=\"#functions\" aria-label=\"Permalin ><small>Use a threshold to define your robot’s response.</small></div><div class=\"feature-box\"><strong>Learn step by step</strong><small>Follow a guide for your controller and environment.</small></div></div><h3 id=\"product-overview\" tabindex=\"-1\">Product overview <a class=\"header-anchor\" href=\"#product-overview\" aria-label=\"Permalink to &quot;Product overview&quot;\">​</a></h3><p>Distance sensing can support obstacle detection, proximity feedback and spacing control. Read a value, evaluate a condition and trigger an appropriate action.</p><table tabindex=\"0\"><thead><tr><th>Item</th><th>Status</th></tr></thead><tbody><tr><td>Model / product photo</td><td>Awaiting client assets</td></tr><tr><td>Measurement range / accuracy</td><td>Awaiting specifications</td></tr><tr><td>Connector / protocol</td><td>Awaiting hardware details</td></tr><tr><td>EV3 / SPIKE compatibility</td><td>Driver and firmware verification required</td></tr><tr><td>Programming environment</td><td>Four demonstration learning paths</td></tr></tbody></table><h3 id=\"before-you-begin\" tabindex=\"-1\">Before you begin <a class=\"header-anchor\" href=\"#before-you-begin\" aria-label=\"Permalink to &quot;Before you begin&quot;\">​</a></h3><ol><li>Confirm your product version and controller. Follow the official wiring diagram.</li><li>Install the required programming environment and product driver.</li><li>Check raw readings before adding conditions or motor control.</li></ol><div class=\"tip custom-block\"><p class=\"custom-block-title\">Start with a reading</p><p>Begin by displaying a value. Confirm its units and stability before testing threshold logic. Wiring diagrams and driver links will be added when supplied.</p></div><h3 id=\"applications\" tabindex=\"-1\">Applications <a class=\"header-anchor\" href=\"#applications\" aria-label=\"Permalink to &quot;Applications&quot;\">​</a></h3><ul><li><strong>Obstacle detection</strong>: stop or turn when a reading is below a threshold.</li><li><strong>Proximity feedback</strong>: show a message or sound based on distance.</li><li><strong>Spacing control</strong>: use continuous readings as an input to your control logic.</li></ul><h2 id=\"your-tutorial-·-spike-·-pybricks-python\" tabindex=\"-1\">Your tutorial · SPIKE · Pybricks Python <a class=\"header-anchor\" href=\"#your-tutorial-·-spike-·-pybricks-python\" aria-label=\"Permalink to &quot;Your tutorial · SPIKE · Pybricks Python&quot;\">​</a></h2><p>Learn to read, display and evaluate a distance value.</p><div class=\"warning custom-block\"><p class=\"custom-block-title\">Demonstration guide</p><p>The product driver and API are not available yet. The sample below uses simulated readings; it does not communicate with a sensor. Product compatibility must be verified before use.</p></div><h2 id=\"_01-prepare-your-environment\" tabindex=\"-1\">01 / Prepare your environment <a class=\"header-anchor\" href=\"#_01-prepare-your-environment\" aria-label=\"Permalink to &quot;01 / Prepare your environment&quot;\">​</a></h2><p>Prepare a SPIKE controller and the corresponding Pybricks environment. Verify driver and firmware requirements before changing firmware.</p><ol><li>Obtain the product wiring diagram and driver.</li><li>Confirm the port and measurement unit.</li><li>Begin with a single reading before adding a loop.</li></ol><h2 id=\"_02-function-concepts\" tabindex=\"-1\">02 / Function concepts <a class=\"header-anchor\" href=\"#_02-function-concepts\" aria-label=\"Permalink to &quot;02 / Function concepts&quot;\">​</a></h2><table tabindex=\"0\"><thead><tr><th>Concept</th><th>Demonstration function</th><th>Result</th></tr></thead><tbody><tr><td>Read a value</td><td><code>read_demo_distance()</code></td><td>Simulated distance in mm</td></tr><tr><td>Compare a threshold</td><td><code>is_near(distance_mm, threshold_mm)</code></td><td>Boolean result</td></tr><tr><td>Display feedback</td><td><code>print(message)</code></td><td>Console message</td></tr></tbody></table><p>These names belong to this example, not the product API. Replace the simulated reader with the official driver after confirmation.</p><h2 id=\"example\">03 / Example program</h2><div class=\"language-python vp-adaptive-theme\"><button title=\"Copy Code\" class=\"copy\"></button><span class=\"lang\">python</span><pre class=\"shiki shiki-themes github-light github-dark vp-code\" tabindex=\"0\"><code><span class=\"line\"><span style=\"--shiki-light:#6A737D;--shiki-dark:#6A737D;\">## Your tutorial · SPIKE · Pybricks Python</span></span>\n<span class=\"line\"><span style=\"--shiki-light:#D73A49;--shiki-dark:#F97583;\">def</span><span style=\"--shiki-light:#6F42C1;--shiki-dark:#B392F0;\"> read_demo_distance</span><span style=\"--shiki-light:#24292E;--shiki-dark:#E1E4E8;\">():</span></span>\n<span class=\"line\"><span style=\"--shiki-light:#D73A49;--shiki-dark:#F97583;\">    return</span><span style=\"--shiki-light:#005CC5;--shiki-dark:#79B8FF;\"> 150</span></span>\n<span class=\"line\"></span>\n<span class=\"line\"><span style=\"--shiki-light:#D73A49;--shiki-dark:#F97583;\">def</span><span style=\"--shiki-light:#6F42C1;--shiki-dark:#B392F0;\"> is_near</span><span style=\"--shiki-light:#24292E;--shiki-dark:#E1E4E8;\">(distance_mm, threshold_mm</span><span style=\"--shiki-light:#D73A49;--shiki-dark:#F97583;\">=</span><span style=\"--shiki-light:#005CC5;--shiki-dark:#79B8FF;\">200</span><span style=\"--shiki-light:#24292E;--shiki-dark:#E1E4E8;\">):</span></span>\n<span class=\"line\"><span style=\"--shiki-light:#D73A49;--shiki-dark:#F97583;\">    return</span><span style=\"--shiki-light:#24292E;--shiki-dark:#E1E4E8;\"> distance_mm </span><span style=\"--shiki-light:#D73A49;--shiki-dark:#F97583;\">&lt;</span><span style=\"--shiki-light:#24292E;--shiki-dark:#E1E4E8;\"> threshold_mm</span></span>\n<span class=\"line\"></span>\n<span class=\"line\"><span style=\"--shiki-light:#24292E;--shiki-dark:#E1E4E8;\">distance </span><span style=\"--shiki-light:#D73A49;--shiki-dark:#F97583;\">=</span><span style=\"--shiki-light:#24292E;--shiki-dark:#E1E4E8;\"> read_demo_distance()</span></span>\n<span class=\"line\"><span style=\"--shiki-light:#005CC5;--shiki-dark:#79B8FF;\">print</span><span style=\"--shiki-light:#24292E;--shiki-dark:#E1E4E8;\">(</span><span style=\"--shiki-light:#032F62;--shiki-dark:#9ECBFF;\">&quot;Distance:&quot;</span><span style=\"--shiki-light:#24292E;--shiki-dark:#E1E4E8;\">, distance, </span><span style=\"--shiki-light:#032F62;--shiki-dark:#9ECBFF;\">&quot;mm&quot;</span><span style=\"--shiki-light:#24292E;--shiki-dark:#E1E4E8;\">)</span></span>\n<span class=\"line\"><span style=\"--shiki-light:#D73A49;--shiki-dark:#F97583;\">if</span><span style=\"--shiki-light:#24292E;--shiki-dark:#E1E4E8;\"> is_near(distance):</span></span>\n<span class=\"line\"><span style=\"--shiki-light:#005CC5;--shiki-dark:#79B8FF;\">    print</span><span style=\"--shiki-light:#24292E;--shiki-dark:#E1E4E8;\">(</span><span style=\"--shiki-light:#032F62;--shiki-dark:#9ECBFF;\">&quot;Object nearby&quot;</span><span style=\"--shiki-light:#24292E;--shiki-dark:#E1E4E8;\">)</span></span>\n<span class=\"line\"><span style=\"--shiki-light:#D73A49;--shiki-dark:#F97583;\">else</span><span style=\"--shiki-light:#24292E;--shiki-dark:#E1E4E8;\">:</span></span>\n<span class=\"line\"><span style=\"--shiki-light:#005CC5;--shiki-dark:#79B8FF;\">    print</span><span style=\"--shiki-light:#24292E;--shiki-dark:#E1E4E8;\">(</span><span style=\"--shiki-light:#032F62;--shiki-dark:#9ECBFF;\">&quot;Path clear&quot;</span><span style=\"--shiki-light:#24292E;--shiki-dark:#E1E4E8;\">)</span></span></code></pre></div><h2 id=\"_04-try-it-yourself\" tabindex=\"-1\">04 / Try it yourself <a class=\"header-anchor\" href=\"#_04-try-it-yourself\" aria-label=\"Permalink to &quot;04 / Try it yourself&quot;\">​</a></h2><p>Change the simulated distance from <code>150</code> to <code>300</code>. With a <code>200</code> mm threshold, the result changes to “Path clear”. A value exactly equal to <code>200</code> is also clear because the comparison uses <code>&lt;</code>.</p><h2 id=\"troubleshooting\" tabindex=\"-1\">Troubleshooting <a class=\"header-anchor\" href=\"#troubleshooting\" aria-label=\"Permalink to &quot;Troubleshooting&quot;\">​</a></h2><table tabindex=\"0\"><thead><tr><th>Situation</th><th>Check</th></tr></thead><tbody><tr><td>No real readings</td><td>This demo uses simulation. Add the official driver first.</td></tr><tr><td>Cannot find a block</td><td>Product extensions are pending; this is a conceptual sequence.</td></tr><tr><td>Unexpected units</td><td>Confirm the driver returns mm before comparing values.</td></tr></tbody></table><p><a href=\"/mbc-docs/en/\">Return home and choose another path</a></p></div></div></main><!----><!--[--><!--]--></div></div></div><!--[--><!--]--></div></div><!----><!--[--><!--]--></div></div>\n    \n    \n  ", "/en/products/S8/ev3-python.html": "\n    <div id=\"app\"><div class=\"Layout\" data-v-99598d5d><!--[--><!--]--><!--[--><span tabindex=\"-1\" data-v-68b79384></span><a href=\"#VPContent\" class=\"VPSkipLink visually-hidden\" data-v-68b79384>Skip to content</a><!--]--><!----><header class=\"VPNav\" data-v-99598d5d data-v-b30964d7><div class=\"VPNavBar\" data-v-b30964d7 data-v-a57f7b4c><div class=\"wrapper\" data-v-a57f7b4c><div class=\"container\" data-v-a57f7b4c><div class=\"title\" data-v-a57f7b4c><div class=\"VPNavBarTitle\" data-v-a57f7b4c data-v-95edfb70><a class=\"title\" href=\"/mbc-docs/en/\" data-v-95edfb70><!--[--><!--]--><!--[--><img class=\"VPImage logo\" src=\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA0MCA0MCI+PHJlY3Qgd2lkdGg9IjQwIiBoZWlnaHQ9IjQwIiByeD0iMTAiIGZpbGw9IiMzNjM2MzYiLz48cGF0aCBkPSJNOSAyOSAyMCA5bDExIDIwaC03bC00LTgtNCA4WiIgZmlsbD0iIzE2MTYxNiIvPjwvc3ZnPg==\" alt data-v-802dc540><!--]--><span data-v-95edfb70>AWRECKER</span><!--[--><!--]--></a></div></div><div class=\"content\" data-v-a57f7b4c><div class=\"content-body\" data-v- --><div class=\"VPContent\" id=\"VPContent\" data-v-99598d5d data-v-e9feca6f><div class=\"VPDoc has-aside\" data-v-e9feca6f data-v-220728f0><!--[--><!--]--><div class=\"container\" data-v-220728f0><div class=\"aside\" data-v-220728f0><div class=\"aside-curtain\" data-v-220728f0></div><div class=\"aside-container\" data-v-220728f0><div class=\"aside-content\" data-v-220728f0><div class=\"VPDocAside\" data-v-220728f0 data-v-e1b13a4a><!--[--><!--]--><!--[--><!--]--><nav aria-labelledby=\"doc-outline-aria-label\" class=\"VPDocAsideOutline\" data-v-e1b13a4a data-v-9edb41bb><div class=\"content\" data-v-9edb41bb><div class=\"outline-marker\" data-v-9edb41bb></div><div aria-level=\"2\" class=\"outline-title\" id=\"doc-outline-aria-label\" role=\"heading\" data-v-9edb41bb>On this page</div><ul class=\"VPDocOutlineItem root\" data-v-9edb41bb data-v-a20af3d2><!--[--><!--]--></ul></div></nav><!--[--><!--]--><div class=\"spacer\" data-v-e1b13a4a></div><!--[--><!--]--><!----><!--[--><!--]--><!--[--><!--]--></div></div></div></div><div class=\"content\" data-v-220728f0><div class=\"content-container\" data-v-220728f0><!--[--><!--]--><main class=\"main\" data-v-220728f0><div style=\"position:relative;\" class=\"vp-doc _mbc-docs_en_products_S8_ev3-python\" data-v-220728f0><div><h1 id=\"mbc-line-following-sensor-s8-·-ev3-·-pybricks-python\" tabindex=\"-1\">MBC Line-Following Sensor S8 · EV3 · Pybricks Python <a class=\"header-anchor\" href=\"#mbc-line-following-sensor-s8-·-ev3-·-pybricks-python\" aria-label=\"Permalink to &quot;MBC Line-Following Sensor S8 · EV3 · Pybricks Python&quot;\">​</a></h1><h2 id=\"product-introduction\" tabindex=\"-1\">Product introduction <a class=\"header-anchor\" href=\"#product-introduction\" aria-label=\"Permalink to &quot;Product introduction&quot;\">​</a></h2><p>Explore distance readings, then use conditions to build your first sensing workflow.</p><div class=\"warning custom-block\"><p class=\"custom-block-title\">Product documentation preview</p><p>The product name and learning flow are illustrative. Measurement range, connectors, drivers and supported environments await confirmation. Examples are not production hardware code.</p></div><div class=\"feature-grid\"><div class=\"feature-box\"><strong>Sense distance</strong><small>Learn the basics of reading values and evaluating distance.</small></div><div class=\"feature-box\"><strong>React with code</strong><small>Use a threshold to define your robot’s response.</small></div><div class=\"feature-box\"><strong>Learn step by step</strong><small>Follow a guide for your controller and environment.</small></div></div><h3 id=\"product-overview\" tabindex=\"-1\">Product overview <a class=\"header-anchor\" href=\"#product-overview\" aria-label=\"Permalink to &quot;Product overview&quot;\">​</a></h3><p>Distance sensing can support obstacle detection, proximity feedback and spacing control. Read a value, evaluate a condition and trigger an appropriate action.</p><table tabindex=\"0\"><thead><tr><th>Item</th><th>Status</th></tr></thead><tbody><tr><td>Model / product photo</td><td>Awaiting client assets</td></tr><tr><td>Measurement range / accuracy</td><td>Awaiting specifications</td></tr><tr><td>Connector / protocol</td><td>Awaiting hardware details</td></tr><tr><td>EV3 / SPIKE compatibility</td><td>Driver and firmware verification required</td></tr><tr><td>Programming environment</td><td>Four demonstration learning paths</td></tr></tbody></table><h3 id=\"before-you-begin\" tabindex=\"-1\">Before you begin <a class=\"header-anchor\" href=\"#before-you-begin\" aria-label=\"Permalink to &quot;Before you begin&quot;\">​</a></h3><ol><li>Confirm your product version and controller. Follow the official wiring diagram.</li><li>Install the required programming environment and product driver.</li><li>Check raw readings before adding conditions or motor control.</li></ol><div class=\"tip custom-block\"><p class=\"custom-block-title\">Start with a reading</p><p>Begin by displaying a value. Confirm its units and stability before testing threshold logic. Wiring diagrams and driver links will be added when supplied.</p></div><h3 id=\"applications\" tabindex=\"-1\">Applications <a class=\"header-anchor\" href=\"#applications\" aria-label=\"Permalink to &quot;Applications&quot;\">​</a></h3><ul><li><strong>Obstacle detection</strong>: stop or turn when a reading is below a threshold.</li><li><strong>Proximity feedback</strong>: show a message or sound based on distance.</li><li><strong>Spacing control</strong>: use continuous readings as an input to your control logic.</li></ul><h2 id=\"your-tutorial-·-ev3-·-pybricks-python\" tabindex=\"-1\">Your tutorial · EV3 · Pybricks Python <a class=\"header-anchor\" href=\"#your-tutorial-·-ev3-·-pybricks-python\" aria-label=\"Permalink to &quot;Your tutorial · EV3 · Pybricks Python&quot;\">​</a></h2><p>Learn to read, display and evaluate a distance value.</p><div class=\"warning custom-block\"><p class=\"custom-block-title\">Demonstration guide</p><p>The product driver and API are not available yet. The sample below uses simulated readings; it does not communicate with a sensor. Product compatibility must be verified before use.</p></div><h2 id=\"_01-prepare-your-environment\" tabindex=\"-1\">01 / Prepare your environment <a class=\"header-anchor\" href=\"#_01-prepare-your-environment\" aria-label=\"Permalink to &quot;01 / Prepare your environment&quot;\">​</a></h2><p>Prepare an EV3 and the applicable EV3 Pybricks environment. Verify the product driver supports this setup.</p><ol><li>Obtain the product wiring diagram and driver.</li><li>Confirm the port and measurement unit.</li><li>Begin with a single reading before adding a loop.</li></ol><h2 id=\"_02-function-concepts\" tabindex=\"-1\">02 / Function concepts <a class=\"header-anchor\" href=\"#_02-function-concepts\" aria-label=\"Permalink to &quot;02 / Function concepts&quot;\">​</a></h2><table tabindex=\"0\"><thead><tr><th>Concept</th><th>Demonstration function</th><th>Result</th></tr></thead><tbody><tr><td>Read a value</td><td><code>read_demo_distance()</code></td><td>Simulated distance in mm</td></tr><tr><td>Compare a threshold</td><td><code>is_near(distance_mm, threshold_mm)</code></td><td>Boolean result</td></tr><tr><td>Display feedback</td><td><code>print(message)</code></td><td>Console message</td></tr></tbody></table><p>These names belong to this example, not the product API. Replace the simulated reader with the official driver after confirmation.</p><h2 id=\"example\">03 / Example program</h2><div class=\"language-python vp-adaptive-theme\"><button title=\"Copy Code\" class=\"copy\"></button><span class=\"lang\">python</span><pre class=\"shiki shiki-themes github-light github-dark vp-code\" tabindex=\"0\"><code><span class=\"line\"><span style=\"--shiki-light:#6A737D;--shiki-dark:#6A737D;\">## Your tutorial · EV3 · Pybricks Python</span></span>\n<span class=\"line\"><span style=\"--shiki-light:#D73A49;--shiki-dark:#F97583;\">def</span><span style=\"--shiki-light:#6F42C1;--shiki-dark:#B392F0;\"> read_demo_distance</span><span style=\"--shiki-light:#24292E;--shiki-dark:#E1E4E8;\">():</span></span>\n<span class=\"line\"><span style=\"--shiki-light:#D73A49;--shiki-dark:#F97583;\">    return</span><span style=\"--shiki-light:#005CC5;--shiki-dark:#79B8FF;\"> 150</span></span>\n<span class=\"line\"></span>\n<span class=\"line\"><span style=\"--shiki-light:#D73A49;--shiki-dark:#F97583;\">def</span><span style=\"--shiki-light:#6F42C1;--shiki-dark:#B392F0;\"> is_near</span><span style=\"--shiki-light:#24292E;--shiki-dark:#E1E4E8;\">(distance_mm, threshold_mm</span><span style=\"--shiki-light:#D73A49;--shiki-dark:#F97583;\">=</span><span style=\"--shiki-light:#005CC5;--shiki-dark:#79B8FF;\">200</span><span style=\"--shiki-light:#24292E;--shiki-dark:#E1E4E8;\">):</span></span>\n<span class=\"line\"><span style=\"--shiki-light:#D73A49;--shiki-dark:#F97583;\">    return</span><span style=\"--shiki-light:#24292E;--shiki-d
