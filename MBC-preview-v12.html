iv></div><div class=\"content\" data-v-39a288b8><div class=\"content-container\" data-v-39a288b8><!--[--><!--]--><main class=\"main\" data-v-39a288b8><div style=\"position:relative;\" class=\"vp-doc _awrecker-sensors_products_force_ev3-python\" data-v-39a288b8><div><h1 id=\"力量感測器-·-ev3-·-pybricks-python\" tabindex=\"-1\">力量感測器 · EV3 · Pybricks Python <a class=\"header-anchor\" href=\"#力量感測器-·-ev3-·-pybricks-python\" aria-label=\"Permalink to &quot;力量感測器 · EV3 · Pybricks Python&quot;\">​</a></h1><h2 id=\"產品介紹\" tabindex=\"-1\">產品介紹 <a class=\"header-anchor\" href=\"#產品介紹\" aria-label=\"Permalink to &quot;產品介紹&quot;\">​</a></h2><p>觸碰輸入與力量觸發。本頁展示產品介紹與教學整合的閱讀流程。</p><div class=\"warning custom-block\"><p class=\"custom-block-title\">內容待確認</p><p>正式產品照片、規格、接線方式與相容性待提供。目前尚無此產品的正式 API 或可操作硬體的範例程式。</p></div><h2 id=\"使用教學-·-ev3-·-pybricks-python\" tabindex=\"-1\">使用教學 · EV3 · Pybricks Python <a class=\"header-anchor\" href=\"#使用教學-·-ev3-·-pybricks-python\" aria-label=\"Permalink to &quot;使用教學 · EV3 · Pybricks Python&quot;\">​</a></h2><h3 id=\"_01-環境準備\" tabindex=\"-1\">01 / 環境準備 <a class=\"header-anchor\" href=\"#_01-環境準備\" aria-label=\"Permalink to &quot;01 / 環境準備&quot;\">​</a></h3><p>連接硬體前，先確認產品型號、控制器、韌體與驅動支援。</p><h3 id=\"_02-函數說明\" tabindex=\"-1\">02 / 函數說明 <a class=\"header-anchor\" href=\"#_02-函數說明\" aria-label=\"Permalink to &quot;02 / 函數說明&quot;\">​</a></h3><p>收到正式驅動後，將補上函數名稱、參數、數值單位與回傳值。</p><h3 id=\"_03-範例程式\" tabindex=\"-1\">03 / 範例程式 <a class=\"header-anchor\" href=\"#_03-範例程式\" aria-label=\"Permalink to &quot;03 / 範例程式&quot;\">​</a></h3><p>完成產品與程式環境驗證後，將補上對應的可執行範例。</p><p><a href=\"/awrecker-sensors/\">回首頁選擇其他產品</a></p></div></div></main><!----><!--[--><!--]--></div></div></div><!--[--><!--]--></div></div><!----><!--[--><!--]--></div></div>\n    \n    \n  ", "/products/force/spike-app.html": "\n    <div id=\"app\"><div class=\"Layout\" data-v-5d98c3a5><!--[--><!--]--><!--[--><span tabindex=\"-1\" data-v-0b0ada53></span><a href=\"#VPContent\" class=\"VPSkipLink visual function updatePicker(){const picker=document.querySelector('.tutorial-picker');if(!picker)return;const en=current.startsWith('/en/');const modal=document.querySelector('.product-dialog');const product=modal?.dataset.product||'distance';const config=catalog[product];const support=config?.support||{};const controllers=[...picker.querySelectorAll('input[name="controller"]')];for(const radio of controllers){radio.disabled=!(support[radio.value]?.length);if(radio.disabled)radio.checked=false;radio.closest('label').classList.toggle('disabled',radio.disabled)}let selectedController=controllers.find(r=>r.checked&&!r.disabled);if(!selectedController){selectedController=controllers.find(r=>!r.disabled);if(selectedController)selectedController.checked=true}const controller=selectedController?.value||'';const available=support[controller]||[];const languages=[...picker.querySelectorAll('input[name="language"]')];for(const radio of languages){radio.disabled=!available.includes(radio.value);if(radio.disabled)radio.checked=false;radio.closest('label').classList.toggle('disabled',radio.disabled)}let selectedLanguage=languages.find(r=>r.checked&&!r.disabled);if(!selectedLanguage){selectedLanguage=languages.find(r=>!r.disabled);if(selectedLanguage)selectedLanguage.checked=true}for(const radio of [...controllers,...languages])radio.closest('label').classList.toggle('selected',radio.checked);const language=selectedLanguage?.value||'';const button=picker.querySelector('.picker-footer button');button.disabled=!controller||!language;picker.querySelector('.picker-footer>span').textContent=button.disabled?(en?'No learning paths available':'目前沒有可選教學路徑'):selectedController.nextElementSibling.textContent+' / '+selectedLanguage.nextElementSibling.textContent;picker.querySelector('.compatibility').textContent=(config?.compatibilityNote?.[en?'en':'zh']||'')+' '+(en?'Disabled options have no learning path for this product.':'灰色選項表示此產品目前未提供該組合的教學。');button.onclick=()=>{if(button.disabled)return;modal?.close();navigate((en?'/en':'')+'/'+config.routeBase+'/'+controller+'-'+language+'.html')}}
window.addEventListener('hashchange',render);document.addEventListener('change',e=>{if(e.target.matches('.tutorial-picker input'))updatePicker()});document.addEventListener('click',e=>{const a=e.target.closest('a');if(!a)return;let href=a.getAttribute('href');if(!href||href.startsWith('http')||href.startsWith('mailto'))return;e.preventDefault();href=href.replace(/^\/awrecker-sensors\//,'/');if(href.startsWith('#')){document.getElementById(decodeURI(href.slice(1)))?.scrollIntoView();return}if(!href.startsWith('/'))href=new URL(href,'https://preview.test'+current).pathname;let [path,anchor]=href.split('#');if(!path.endsWith('/')&&!path.endsWith('.html'))path+='.html';if(pages[path])navigate(path+(anchor?'#'+anchor:''));});render();
</script></body></html>
