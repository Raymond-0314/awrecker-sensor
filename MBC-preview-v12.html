-[--><!--]--><main class=\"main\" data-v-39a288b8><div style=\"position:relative;\" class=\"vp-doc _awrecker-sensors_tutorials_ev3-python\" data-v-39a288b8><div><h1 id=\"距離感測器-·-ev3-·-pybricks-python\" tabindex=\"-1\">距離感測器 · EV3 · Pybricks Python <a class=\"header-anchor\" href=\"#距離感測器-·-ev3-·-pybricks-python\" aria-label=\"Permalink to &quot;距離感測器 · EV3 · Pybricks Python&quot;\">​</a></h1><div class=\"doc-kicker\">PRODUCT / 01 · DISTANCE SENSOR</div><h2 id=\"產品介紹\" tabindex=\"-1\">產品介紹 <a class=\"header-anchor\" href=\"#產品介紹\" aria-label=\"Permalink to &quot;產品介紹&quot;\">​</a></h2><p>讓機器人感知前方，從距離讀值到條件控制，一步步建立你的第一個感測應用。</p><div class=\"warning custom-block\"><p class=\"custom-block-title\">產品文件預覽</p><p>本頁使用示意產品名稱與教學流程。實際量測範圍、連接介面、驅動函數與支援環境，均待產品資料確認；範例不是可直接操作硬體的正式程式。</p></div><div class=\"feature-grid\"><div class=\"feature-box\"><strong>感知距離</strong><small>了解數值讀取與距離判斷的基本概念。</small></div><div class=\"feature-box\"><strong>條件控制</strong><small>透過距離門檻，建立機器人的反應邏輯。</small></div><div class=\"feature-box\"><strong>循序學習</strong><small>依控制器與程式環境，選擇對應教學。</small></div></div><h3 id=\"產品概覽\" tabindex=\"-1\">產品概覽 <a class=\"header-anchor\" href=\"#產品概覽\" aria-label=\"Permalink to &quot;產品概覽&quot;\">​</a></h3><p>距離感測可以用於障礙物偵測、接近提示與保持間距。讀取感測器數值後，程式便能根據條件執行不同動作。</p><table tabindex=\"0\"><thead><tr><th>項目</th><th>目前狀態</th></tr></thead><tbody><tr><td>產品型號 / 照片</td><td>待甲方提供</td></tr><tr><td>量測範圍與精度</td><td>待正式規格確認</td></tr><tr><td>接頭與通訊方式</td><td>待硬體介面確認</td></tr><tr><td>EV3 / SPIKE 相容性</td><td>待驅動與韌體驗證</td></tr><tr><td>程式環境</td><td>本版展示四條教學路徑</td></tr></tbody></table><h3 id=\"開始之前\" tabindex=\"-1\">開始之前 <a class=\"header-anchor\" href=\"#開始之前\" aria-label=\"Permalink to &quot;開始之前&quot;\">​</a></h3><ol><li>確认產品版本與控制器，依正式接線圖連接感測器。</li><li>安裝對應程式環境及產品驅動。</li><li>先檢查原始讀值，再加入條件判斷與馬達控制。</li></ol><div class=\"tip custom-block\"><p class=\"custom-block-title\">閱讀建議</p><p>第一次使用時，先完成「讀取並顯示數值」，確認輸出單位與穩定性，再嘗試距離判斷。正式接線圖與驅動下載位置將在資料確認後補上。</p></div><h3 id=\"使用情境\" tabindex=\"-1\">使用情境 <a class=\"header-anchor\" href=\"#使用情境\" aria-label=\"Permalink to &quot;使用情境&quot;\">​</a></h3><ul><li><strong>避障</strong>：距離小於設定門檻時，觸發停止或轉向。</li><li><strong>接近提示</strong>：根據遠近顯示訊息或播放提示音。</li><li><strong>保持間距</strong>：持續讀取距離，作為後續控制邏輯的輸入。</li></ul><h2 id=\"使用教學-·-ev3-·-pybricks-python\" tabindex=\"-1\">使用教學 · EV3 · Pybricks Python <a class=\"header-anchor\" href=\"#使用教學-·-ev3-·-pybricks-python\" aria-label=\"Permalink to &quot;使用教學 · EV3 · Pybricks Python&quot;\">​</a></h2><p>從連接準備、函數概念到範例流程，練習讀取與判斷距離。</p><div class=\"warning custom-block\"><p class=\"custom-block-title\">示意教學</p><p>目前尚無產品驅動與正式 API。下方範例使用模擬讀值，不會與感測器通訊；實際產品相容性需先驗證。</p></div><h2 id=\"_01-環境準備\" tabindex=\"-1\">01 / 環境準備 <a class=\"header-anchor\" href=\"#_01-環境準備\" aria-label=\"Permalink to &quot;01 / 環境準備&quot;\">​</a></h2><p>準備 EV3 與適用的 EV3 Pybricks 環境，先確認產品驅動支援此組合。</p><ol><li>取得產品接線圖與驅動套件。</li><li>確認連接埠與數值單位。</li><li>先完成單次數值讀取，再加入迴圈。</li></ol><h2 id=\"_02-函數與功能概念\" tabindex=\"-1\">02 / 函數與功能概念 <a class=\"header-anchor\" href=\"#_02-函數與功能概念\" aria-label=\"Permalink to &quot;02 / 函數與功能概念&quot;\">​</a></h2><table tabindex=\"0\"><thead><tr><th>功能</th><th>本範例函數</th><th>回傳 / 輸出</th></tr></thead><tbody><tr><td>讀取數值</td><td><code>read_demo_distance()</code></td><td>模擬距離，單位 mm</td></tr><tr><td>門檻判斷</td><td><code>is_near(distance_mm, threshold_mm)</code></td><td>布林值</td></tr><tr><td>顯示結果</td><td><code>print(message)</code></td><td>主控台訊息</td></tr></tbody></table><p>以上為本示例定義的函數，並非產品 API。正式驅動確認後，將模擬讀值函數替換為實際讀取函數。</p><h2 id=\"example\">03 / 範例程式</h2><div class=\"language-python vp-adaptive-theme\"><button title=\"Copy Code\" class=\"copy\"></button><span class=\"lang\">python</span><pre class=\"shiki shiki-themes github-light github-dark vp-code\" tabindex=\"0\"><code><span class=\"line\"><span style=\"--shiki-light:#6A737D;--shiki-dark:#6A737D;\">## 使用教學 · EV3 · Pybricks Python</span></span>\n<span class=\"line\"><span style=\"--shiki-light:#D73A49;--shiki-dark:#F97583;\">def</span><span style=\"--shiki-light:#6F42C1;--shiki-dark:#B392F0;\"> read_demo_distance</span><span style=\"--shiki-light:#24292E;--shiki-dark:#E1E4E8;\">():</span></span>\n<span class=\"line\"><span style=\"--shiki-light:#D73A49;--shiki-dark:#F97583;\">    return</span><span style=\"--shiki-light:#005CC5;--shiki-dark:#79B8FF;\"> 150</span></span>\n<span class=\"line\"></span>\n<span class=\"line\"><span style=\"--shiki-light:#D73A49;--shiki-dark:#F97583;\">def</span><span style=\"--shiki-light:#6F42C1;--shiki-dark:#B392F0;\"> is_near</span><span style=\"--shiki-light:#24292E;--shiki-dark:#E1E4E8;\">(distance_mm, threshold_mm</span><span style=\"--shiki-light:#D73A49;--shiki-dark:#F97583;\">=</span><span style=\"--shiki-light:#005CC5;--shiki-dark:#79B8FF;\">200</span><span style=\"--shiki-light:#24292E;--shiki-dark:#E1E4E8;\">):</span></span>\n<span class=\"line\"><span style=\"--shiki-light:#D73A49;--shiki-dark:#F97583;\">    return</span><span style=\"--shiki-light:#24292E;--shiki-dark:#E1E4E8;\"> distance_mm </span><span style=\"--shiki-light:#D73A49;--shiki-dark:#F97583;\">&lt;</span><span style=\"--shiki-light:#24292E;--shiki-dark:#E1E4E8;\"> threshold_mm</span></span>\n<span class=\"line\"></span>\n<span class=\"line\"><span style=\"--shiki-light:#24292E;--shiki-dark:#E1E4E8;\">distance </span><span style=\"--shiki-light:#D73A49;--shiki-dark:#F97583;\">=</span><span style=\"--shiki-light:#24292E;--shiki-dark:#E1E4E8;\"> read_demo_distance()</span></span>\n<span class=\"line\"><span style=\"--shiki-light:#005CC5;--shiki-dark:#79B8FF;\">print</span><span style=\"--shiki-light:#24292E;--shiki-dark:#E1E4E8;\">(</span><span style=\"--shiki-light:#032F62;--shiki-dark:#9ECBFF;\">&quot;Distance:&quot;</span><span style=\"--shiki-light:#24292E;--shiki-dark:#E1E4E8;\">, distance, </span><span style=\"--shiki-light:#032F62;--shiki-dark:#9ECBFF;\">&quot;mm&quot;</span><span style=\"--shiki-light:#24292E;--shiki-dark:#E1E4E8;\">)</span></span>\n<span class=\"line\"><span style=\"--shiki-light:#D73A49;--shiki-dark:#F97583;\">if</span><span style=\"--shiki-light:#24292E;--shiki-dark:#E1E4E8;\"> is_near(distance):</span></span>\n<span class=\"line\"><span style=\"--shiki-light:#005CC5;--shiki-dark:#79B8FF;\">    print</span><span style=\"--shiki-light:#24292E;--shiki-dark:#E1E4E8;\">(</span><span style=\"--shiki-light:#032F62;--shiki-dark:#9ECBFF;\">&quot;Object nearby&quot;</span><span style=\"--shiki-light:#24292E;--shiki-dark:#E1E4E8;\">)</span></span>\n<span class=\"line\"><span style=\"--shiki-light:#D73A49;--shiki-dark:#F97583;\">else</span><span style=\"--shiki-light:#24292E;--shiki-dark:#E1E4E8;\">:</span></span>\n<span class=\"line\"><span style=\"--shiki-light:#005CC5;--shiki-dark:#79B8FF;\">    print</span><span style=\"--shiki-light:#24292E;--shiki-dark:#E1E4E8;\">(</span><span style=\"--shiki-light:#032F62;--shiki-dark:#9ECBFF;\">&quot;Path clear&quot;</span><span style=\"--shiki-light:#24292E;--shiki-dark:#E1E4E8;\">)</span></span></code></pre></div><h2 id=\"_04-動手練習\" tabindex=\"-1\">04 / 動手練習 <a class=\"header-anchor\" href=\"#_04-動手練習\" aria-label=\"Permalink to &quot;04 / 動手練習&quot;\">​</a></h2><p>把模擬距離從 <code>150</code> 改為 <code>300</code>。門檻為 <code>200</code> mm 時，結果會切換成「通道暢通」。數值剛好等於 <code>200</code> 時也不觸發接近判斷，因為條件使用 <code>&lt;</code>。</p><h2 id=\"常見問題\" tabindex=\"-1\">常見問題 <a class=\"header-anchor\" href=\"#常見問題\" aria-label=\"Permalink to &quot;常見問題&quot;\">​</a></h2><table tabindex=\"0\"><thead><tr><th>情況</th><th>檢查方式</th></tr></thead><tbody><tr><td>沒有真實感測器讀值</td><td>本範例使用模擬資料，需補上正式產品驅動。</td></tr><tr><td>找不到對應積木</td><td>產品擴充尚待提供，本頁先展示概念流程。</td></tr><tr><td>數值單位不同</td><td>先確認驅動是否回傳 mm，再進行比較。</td></tr></tbody></table><p><a href=\"/awrecker-sensors/\">回首頁選擇其他教學</a></p></div></div></main><!----><!--[--><!--]--></div></div></div><!--[--><!--]--></div></div><!----><!--[--><!--]--></div></div>\n    \n    \n  ", "/tutorials/spike-app.html": "\n    <div id=\"app\"><div class=\"Layout\" data-v-5d98c3a5><!--[--><!--]--><!--[--><span tabindex=\"-1\" data-v-0b0ada53></span </div></div><div class=\"content\" data-v-39a288b8><div class=\"content-container\" data-v-39a288b8><!--[--><!--]--><main class=\"main\" data-v-39a288b8><div style=\"position:relative;\" class=\"vp-doc _awrecker-sensors_tutorials_spike-app\" data-v-39a288b8><div><h1 id=\"距離感測器-·-spike-·-spike-app\" tabindex=\"-1\">距離感測器 · SPIKE · SPIKE App <a class=\"header-anchor\" href=\"#距離感測器-·-spike-·-spike-app\" aria-label=\"Permalink to &quot;距離感測器 · SPIKE · SPIKE App&quot;\">​</a></h1><div class=\"doc-kicker\">PRODUCT / 01 · DISTANCE SENSOR</div><h2 id=\"產品介紹\" tabindex=\"-1\">產品介紹 <a class=\"header-anchor\" href=\"#產品介紹\" aria-label=\"Permalink to &quot;產品介紹&quot;\">​</a></h2><p>讓機器人感知前方，從距離讀值到條件控制，一步步建立你的第一個感測應用。</p><div class=\"warning custom-block\"><p class=\"custom-block-title\">產品文件預覽</p><p>本頁使用示意產品名稱與教學流程。實際量測範圍、連接介面、驅動函數與支援環境，均待產品資料確認；範例不是可直接操作硬體的正式程式。</p></div><div class=\"feature-grid\"><div class=\"feature-box\"><strong>感知距離</strong><small>了解數值讀取與距離判斷的基本概念。</small></div><div class=\"feature-box\"><strong>條件控制</strong><small>透過距離門檻，建立機器人的反應邏輯。</small></div><div class=\"feature-box\"><strong>循序學習</strong><small>依控制器與程式環境，選擇對應教學。</small></div></div><h3 id=\"產品概覽\" tabindex=\"-1\">產品概覽 <a class=\"header-anchor\" href=\"#產品概覽\" aria-label=\"Permalink to &quot;產品概覽&quot;\">​</a></h3><p>距離感測可以用於障礙物偵測、接近提示與保持間距。讀取感測器數值後，程式便能根據條件執行不同動作。</p><table tabindex=\"0\"><thead><tr><th>項目</th><th>目前狀態</th></tr></thead><tbody><tr><td>產品型號 / 照片</td><td>待甲方提供</td></tr><tr><td>量測範圍與精度</td><td>待正式規格確認</td></tr><tr><td>接頭與通訊方式</td><td>待硬體介面確認</td></tr><tr><td>EV3 / SPIKE 相容性</td><td>待驅動與韌體驗證</td></tr><tr><td>程式環境</td><td>本版展示四條教學路徑</td></tr></tbody></table><h3 id=\"開始之前\" tabindex=\"-1\">開始之前 <a class=\"header-anchor\" href=\"#開始之前\" aria-label=\"Permalink to &quot;開始之前&quot;\">​</a></h3><ol><li>確认產品版本與控制器，依正式接線圖連接感測器。</li><li>安裝對應程式環境及產品驅動。</li><li>先檢查原始讀值，再加入條件判斷與馬達控制。</li></ol><div class=\"tip custom-block\"><p class=\"custom-block-title\">閱讀建議</p><p>第一次使用時，先完成「讀取並顯示數值」，確認輸出單位與穩定性，再嘗試距離判斷。正式接線圖與驅動下載位置將在資料確認後補上。</p></div><h3 id=\"使用情境\" tabindex=\"-1\">使用情境 <a class=\"header-anchor\" href=\"#使用情境\" aria-label=\"Permalink to &quot;使用情境&quot;\">​</a></h3><ul><li><strong>避障</strong>：距離小於設定門檻時，觸發停止或轉向。</li><li><strong>接近提示</strong>：根據遠近顯示訊息或播放提示音。</li><li><strong>保持間距</strong>：持續讀取距離，作為後續控制邏輯的輸入。</li></ul><h2 id=\"使用教學-·-spike-·-spike-app\" tabindex=\"-1\">使用教學 · SPIKE · SPIKE App <a class=\"header-anchor\" href=\"#使用教學-·-spike-·-spike-app\" aria-label=\"Permalink to &quot;使用教學 · SPIKE · SPIKE App&quot;\">​</a></h2><p>從連接準備、函數概念到範例流程，練習讀取與判斷距離。</p><div class=\"warning custom-block\"><p class=\"custom-block-title\">示意教學</p><p>目前尚無產品驅動與正式 API。下方範例使用模擬讀值，不會與感測器通訊；實際產品相容性需先驗證。</p></div><h2 id=\"_01-環境準備\" tabindex=\"-1\">01 / 環境準備 <a class=\"header-anchor\" href=\"#_01-環境準備\" aria-label=\"Permalink to &quot;01 / 環境準備&quot;\">​</a></h2><p>準備 SPIKE 控制器與 SPIKE App。變更韌體前，先確認產品驅動與韌體需求。</p><ol><li>取得產品接線圖與驅動套件。</li><li>確認連接埠與數值單位。</li><li>先完成單次數值讀取，再加入迴圈。</li></ol><h2 id=\"_02-函數與功能概念\" tabindex=\"-1\">02 / 函數與功能概念 <a class=\"header-anchor\" href=\"#_02-函數與功能概念\" aria-label=\"Permalink to &quot;02 / 函數與功能概念&quot;\">​</a></h2><table tabindex=\"0\"><thead><tr><th>功能</th><th>本範例函數</th><th>回傳 / 輸出</th></tr></thead><tbody><tr><td>讀取數值</td><td><code>read_demo_distance()</code></td><td>模擬距離，單位 mm</td></tr><tr><td>門檻判斷</td><td><code>is_near(distance_mm, threshold_mm)</code></td><td>布林值</td></tr><tr><td>顯示結果</td><td><code>print(message)</code></td><td>主控台訊息</td></tr></tbody></table><p>以上為本示例定義的函數，並非產品 API。正式驅動確認後，將模擬讀值函數替換為實際讀取函數。</p><h2 id=\"example\">03 / 範例程式</h2><p>以下展示積木邏輯順序。正式產品擴充積木與可匯入專案，將在資料確認後補上。</p><div class=\"block-flow\"><div>當程式開始</div><div>設定門檻值為 200 mm</div><div>設定模擬距離為 150 mm</div><div>如果 距離 &lt; 門檻值</div><div>顯示「前方有物體」</div></div><h2 id=\"_04-動手練習\" tabindex=\"-1\">04 / 動手練習 <a class=\"header-anchor\" href=\"#_04-動手練習\" aria-label=\"Permalink to &quot;04 / 動手練習&quot;\">​</a></h2><p>把模擬距離從 <code>150</code> 改為 <code>300</code>。門檻為 <code>200</code> mm 時，結果會切換成「通道暢通」。數值剛好等於 <code>200</code> 時也不觸發接近判斷，因為條件使用 <code>&lt;</code>。</p><h2 id=\"常見問題\" tabindex=\"-1\">常見問題 <a class=\"header-anchor\" href=\"#常見問題\" aria-label=\"Permalink to &quot;常見問題&quot;\">​</a></h2><table tabindex=\"0\"><thead><tr><th>情況</th><th>檢查方式</th></tr></thead><tbody><tr><td>沒有真實感測器讀值</td><td>本範例使用模擬資料，需補上正式產品驅動。</td></tr><tr><td>找不到對應積木</td><td>產品擴充尚待提供，本頁先展示概念流程。</td></tr><tr><td>數值單位不同</td><td>先確認驅動是否回傳 mm，再進行比較。</td></tr></tbody></table><p><a href=\"/awrecker-sensors/\">回首頁選擇其他教學</a></p></div></div></main><!----><!--[--><!--]--></div></div></div><!--[--><!--]--></div></div><!----><!--[--><!--]--></div></div>\n    \n    \n  ", "/tutorials/spike-python.html": "\n    <div id=\"app\"><div class=\"Layout\" data-v-5d98c3a5><!--[--><!--]--><!--[--><span tabindex=\"-1\" data-v-0b0ada53></span><a href=\"#VPContent\" class=\"VPSkipLink visually-hidden\" data-v-0b0ada53>Skip to content</a><!--]--><!----><header class=\"VPNav\" data-v-5d98c3a5 data-v-ae24b3ad><div class=\"VPNavBar\" data-v-ae24b3ad data-v-6aa21345><div class=\"wrapper\" data-v-6aa21345><div class=\"container\" data-v-6aa21345><div class=\"title\" data-v-6aa21345><div class=\"VPNavBarTitle\" data-v-6aa21345 data-v-1168a8e4><a class=\"title\" href=\"/awrecker-sensors/\" data-v-1168a8e4><!--[--><!--]--><!--[--><img class=\"VPImage logo\" src=\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA0MCA0MCI+PHJlY3Qgd2lkdGg9IjQwIiBoZWlnaHQ9IjQwIiByeD0iMTAiIGZpbGw9IiMzNjM2MzYiLz48cGF0aCBkPSJNOSAyOSAyMCA5bDExIDIwaC03bC00LTgtNCA4WiIgZmlsbD0iIzE2MTYxNiIvPjwvc3ZnPg==\" alt data-v-8426fc1a><!--]--><span data-v-1168a8e4>AWRECKER</span><!--[--><!--]--></a></div></div><div class=\"content\" data-v-6aa21345><div class=\"content-body\" data-v-6aa21345><!--[--><!--]--><div class=\"VPNavBarSearch search\" data-v-6aa21345><!----></div><nav aria-labelledby=\"main-nav-aria-label\" class=\"VPNavBarMenu menu\" data-v-6aa21345 data-v-dc692963><span id=\"main-nav-aria-lab b8><div class=\"aside\" data-v-39a288b8><div class=\"aside-curtain\" data-v-39a288b8></div><div class=\"aside-container\" data-v-39a288b8><div class=\"aside-content\" data-v-39a288b8><div class=\"VPDocAside\" data-v-39a288b8 data-v-3f215769><!--[--><!--]--><!--[--><!--]--><nav aria-labelledby=\"doc-outline-aria-label\" class=\"VPDocAsideOutline\" data-v-3f215769 data-v-a5bbad30><div class=\"content\" data-v-a5bbad30><div class=\"outline-marker\" data-v-a5bbad30></div><div aria-level=\"2\" class=\"outline-title\" id=\"doc-outline-aria-label\" role=\"heading\" data-v-a5bbad30>On this page</div><ul class=\"VPDocOutlineItem root\" data-v-a5bbad30 data-v-b933a997><!--[--><!--]--></ul></div></nav><!--[--><!--]--><div class=\"spacer\" data-v-3f215769></div><!--[--><!--]--><!----><!--[--><!--]--><!--[--><!--]--></div></div></div></div><div class=\"content\" data-v-39a288b8><div class=\"content-container\" data-v-39a288b8><!--[--><!--]--><main class=\"main\" data-v-39a288b8><div style=\"position:relative;\" class=\"vp-doc _awrecker-sensors_tutorials_spike-python\" data-v-39a288b8><div><h1 id=\"距離感測器-·-spike-·-pybricks-python\" tabindex=\"-1\">距離感測器 · SPIKE · Pybricks Python <a class=\"header-anchor\" href=\"#距離感測器-·-spike-·-pybricks-python\" aria-label=\"Permalink to &quot;距離感測器 · SPIKE · Pybricks Python&quot;\">​</a></h1><div class=\"doc-kicker\">PRODUCT / 01 · DISTANCE SENSOR</div><h2 id=\"產品介紹\" tabindex=\"-1\">產品介紹 <a class=\"header-anchor\" href=\"#產品介紹\" aria-label=\"Permalink to &quot;產品介紹&quot;\">​</a></h2><p>讓機器人感知前方，從距離讀值到條件控制，一步步建立你的第一個感測應用。</p><div class=\"warning custom-block\"><p class=\"custom-block-title\">產品文件預覽</p><p>本頁使用示意產品名稱與教學流程。實際量測範圍、連接介面、驅動函數與支援環境，均待產品資料確認；範例不是可直接操作硬體的正式程式。</p></div><div class=\"feature-grid\"><div class=\"feature-box\"><strong>感知距離</strong><small>了解數值讀取與距離判斷的基本概念。</small></div><div class=\"feature-box\"><strong>條件控制</strong><small>透過距離門檻，建立機器人的反應邏輯。</small></div><div class=\"feature-box\"><strong>循序學習</strong><small>依控制器與程式環境，選擇對應教學。</small></div></div><h3 id=\"產品概覽\" tabindex=\"-1\">產品概覽 <a class=\"header-anchor\" href=\"#產品概覽\" aria-label=\"Permalink to &quot;產品概覽&quot;\">​</a></h3><p>距離感測可以用於障礙物偵測、接近提示與保持間距。讀取感測器數值後，程式便能根據條件執行不同動作。</p><table tabindex=\"0\"><thead><tr><th>項目</th><th>目前狀態</th></tr></thead><tbody><tr><td>產品型號 / 照片</td><td>待甲方提供</td></tr><tr><td>量測範圍與精度</td><td>待正式規格確認</td></tr><tr><td>接頭與通訊方式</td><td>待硬體介面確認</td></tr><tr><td>EV3 / SPIKE 相容性</td><td>待驅動與韌體驗證</td></tr><tr><td>程式環境</td><td>本版展示四條教學路徑</td></tr></tbody></table><h3 id=\"開始之前\" tabindex=\"-1\">開始之前 <a class=\"header-anchor\" href=\"#開始之前\" aria-label=\"Permalink to &quot;開始之前&quot;\">​</a></h3><ol><li>確认產品版本與控制器，依正式接線圖連接感測器。</li><li>安裝對應程式環境及產品驅動。</li><li>先檢查原始讀值，再加入條件判斷與馬達控制。</li></ol><div class=\"tip custom-block\"><p class=\"custom-block-title\">閱讀建議</p><p>第一次使用時，先完成「讀取並顯示數值」，確認輸出單位與穩定性，再嘗試距離判斷。正式接線圖與驅動下載位置將在資料確認後補上。</p></div><h3 id=\"使用情境\" tabindex=\"-1\">使用情境 <a class=\"header-anchor\" href=\"#使用情境\" aria-label=\"Permalink to &quot;使用情境&quot;\">​</a></h3><ul><li><strong>避障</strong>：距離小於設定門檻時，觸發停止或轉向。</li><li><strong>接近提示</strong>：根據遠近顯示訊息或播放提示音。</li><li><strong>保持間距</strong>：持續讀取距離，作為後續控制邏輯的輸入。</li></ul><h2 id=\"使用教學-·-spike-·-pybricks-python\" tabindex=\"-1\">使用教學 · SPIKE · Pybricks Python <a class=\"header-anchor\" href=\"#使用教學-·-spike-·-pybricks-python\" aria-label=\"Permalink to &quot;使用教學 · SPIKE · Pybricks Python&quot;\">​</a></h2><p>從連接準備、函數概念到範例流程，練習讀取與判斷距離。</p><div class=\"warning custom-block\"><p class=\"custom-block-title\">示意教學</p><p>目前尚無產品驅動與正式 API。下方範例使用模擬讀值，不會與感測器通訊；實際產品相容性需先驗證。</p></div><h2 id=\"_01-環境準備\" tabindex=\"-1\">01 / 環境準備 <a class=\"header-anchor\" href=\"#_01-環境準備\" aria-label=\"Permalink to &quot;01 / 環境準備&quot;\">​</a></h2><p>準備 SPIKE 控制器與對應的 Pybricks 程式環境。變更韌體前，先確認產品驅動與韌體需求。</p><ol><li>取得產品接線圖與驅動套件。</li><li>確認連接埠與數值單位。</li><li>先完成單次數值讀取，再加入迴圈。</li></ol><h2 id=\"_02-函數與功能概念\" tabindex=\"-1\">02 / 函數與功能概念 <a class=\"header-anchor\" href=\"#_02-函數與功能概念\" aria-label=\"Permalink to &quot;02 / 函數與功能概念&quot;\">​</a></h2><table tabindex=\"0\"><thead><tr><th>功能</th><th>本範例函數</th><th>回傳 / 輸出</th></tr></thead><tbody><tr><td>讀取數值</td><td><code>read_demo_distance()</code></td><td>模擬距離，單位 mm</td></tr><tr><td>門檻判斷</td><td><code>is_near(distance_mm, threshold_mm)</code></td><td>布林值</td></tr><tr><td>顯示結果</td><td><code>print(message)</code></td><td>主控台訊息</td></tr></tbody></table><p>以上為本示例定義的函數，並非產品 API。正式驅動確認後，將模擬讀值函數替換為實際讀取函數。</p><h2 id=\"example\">03 / 範例程式</h2><div class=\"language-python vp-adaptive-theme\"><button title=\"Copy Code\" class=\"copy\"></button><span class=\"lang\">python</span><pre class=\"shiki shiki-themes github-light github-dark vp-code\" tabindex=\"0\"><code><span class=\"line\"><span style=\"--shiki-light:#6A737D;--shiki-dark:#6A737D;\">## 使用教學 · SPIKE · Pybricks Python</span></span>\n<span class=\"line\"><span style=\"--shiki-light:#D73A49;--shiki-dark:#F97583;\">def</span><span style=\"--shiki-light:#6F42C1;--shiki-dark:#B392F0;\"> read_demo_distance</span><span style=\"--shiki-light:#24292E;--shiki-dark:#E1E4E8;\">():</span></span>\n<span class=\"line\"><span style=\"--shiki-light:#D73A49;--shiki-dark:#F97583;\">    return</span><span style=\"--shiki-light:#005CC5;--shiki-dark:#79B8FF;\"> 150</span></span>\n<span class=\"line\"></span>\n<span class=\"line\"><span style=\"--shiki-light:#D73A49;--shiki-dark:#F97583;\">def</span><span style=\"--shiki-light:#6F42C1;--shiki-dark:#B392F0;\"> is_near</span><span style=\"--shiki-light:#24292E;--shiki-dark:#E1E4E8;\">(distance_mm, threshold_mm</span><span style=\"--shiki-light:#D73A49;--shiki-dark:#F97583;\">=</span><span style=\"--shiki-light:#005CC5;--shiki-dark:#79B8FF;\">200</span><span style=\"--shiki-light:#24292E;--shiki-dark:#E1E4E8;\">):</span></span>\n<span class=\"line\"><span style=\"--shiki-light:#D73A49;--shiki-dark:#F97583;\">    return</span><span style=\"--shiki-light:#24292E;--shiki-dark:#E1E4E8;\"> distance_mm </span><span style=\"--shiki-light:#D73A49;--shiki-dark:#F97583;\">&lt;</span><span style=\"--shiki-light:#24292E;--shiki-dark:#E1E4E8;\"> threshold_mm</span></span>\n<span class=\"line\"></span>\n<span class=\"line\"><span style=\"--shiki-light:#24292E;--shiki-dark:#E1E4E8;\">distance </span><span style=\"--shiki-light:#D73A49;--shiki-dark:#F97583;\">=</span><span style=\"--shiki-light:#24292E;--shiki-dark:#E1E4E8;\"> read_demo_distance()</span></span>\n<span class=\"line\"><span style=\"--shiki-light:#005CC5;--shiki-dark:#79B8FF;\">print</span><span style=\"--shiki-light:#24292E;--shiki-dark:#E1E4E8;\">(</span><span style=\"--shiki-light:#032F62;--shiki-dark:#9ECBFF;\">&quot;Distance:&quot;</span><span style=\"--shiki-light:#24292E;--shiki-dark:#E1E4E8;\">, distance, </span><span style=\"--shiki-light:#032F62;--shiki-dark:#9ECBFF;\">&quot;mm&quot;</span><span style=\"--shiki-light:#24292E;--shiki-dark:#E1E4E8;\">)</span></span>\n<span class=\"line\"><span style=\"--shiki-light:#D73A49;--shiki-dark:#F97583;\">if</span><span style=\"--shiki-light:#24292E;--shiki-dark:#E1E4E8;\"> is_near(distance):</span></span>\n<span class=\"line\"><span style=\"--shiki-light:#005CC5;--shiki-dark:#79B8FF;\">    print</span><span style=\"--shiki-light:#24292E;--shiki-dark:#E1E4E8;\">(</span><span style=\"--shiki-light:#032F62;--shiki-dark:#9ECBFF;\">&quot;Object nearby&quot;</span><span style=\"--shiki-light:#24292E;--shiki-dark:#E1E4E8;\">)</span></span>\n<span class=\"line\"><span style=\"--shiki-light:#D73A49;--shiki-dark:#F97583;\">else</span><span style=\"--shiki-light:#24292E;--shiki-dark:#E1E4E8;\">:</span></span>\n<span class=\"line\"><span style=\"--shiki-light:#005CC5;--shiki-dark:#79B8FF;\">    print</span><span style=\"--shiki-light:#24292E;--shiki-dark:#E1E4E8;\">(</span><span style=\"--shiki-light:#032F62;--shiki-dark:#9ECBFF;\">&quot;Path clear&quot;</span><span style=\"--shiki-light:#24292E;--shiki-dark:#E1E4E8;\">)</span></span></code></pre></div><h2 id=\"_04-動手練習\" tabindex=\"-1\">04 / 動手練習 <a class=\"header-anchor\" href=\"#_04-動手練習\" aria-label=\"Permalink to &quot;04 / 動手練習&quot;\">​</a></h2><p>把模擬距離從 <code>150</code> 改為 <code>300</code>。門檻為 <code>200</code> mm 時，結果會切換成「通道暢通」。數值剛好等於 <code>200</code> 時也不觸發接近判斷，因為條件使用 <code>&lt;</code>。</p><h2 id=\"常見問題\" tabindex=\"-1\">常見問題 <a class=\"header-anchor\" href=\"#常見問題\" aria-label=\"Permalink to &quot;常見問題&quot;\">​</a></h2><table tabindex=\"0\"><thead><tr><th>情況</th><th>檢查方式</th></tr></thead><tbody><tr><td>沒有真實感測器讀值</td><td>本範例使用模擬資料，需補上正式產品驅動。</td></tr><tr><td>找不到對應積木</td><td>產品擴充尚待提供，本頁先展示概念流程。</td></tr><tr><td>數值單位不同</td><td>先確認驅動是否回傳 mm，再進行比較。</td></tr></tbody></table><p><a href=\"/awrecker-sensors/\">回首頁選擇其他教學</a></p></div></div></main><!----><!--[--><!--]--></div></div></div><!--[--><!--]--></div></div><!----><!--[--><!--]--></div></div>\n    \n    \n  ", "/tutorials/spike-block.html": "\n    <div id=\"app\"><div class=\"Layout\" data-v-5d98c3a5><!--[--><!--]--><!--[--><span tabindex=\"-1\" data-v-0b0ada53></span><a href=\"#VPContent\" class=\"VPSkipLink visually-hidden\" data-v-0b0ada53>Skip to content</a><!--]--><!----><header class=\"VPNav\" data-v-5d98c3a5 data-v-ae24b3ad><div class=\"VPNavBar\" data-v-ae24b3ad data-v-6aa21345><div class=\"wrapper\" data-v-6aa21345><div class=\"container\" data-v-6aa21345><div class=\"title\" data-v-6aa21345><div class=\"VPNavBarTitle\" data-v-6aa21345 data-v-1168a8e4><a class=\"title\" href=\"/awrecker-sensors/\" data-v-1168a8e4><!--[--><!--]--><!--[--><img class=\"VPImage logo\" src=\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA0MCA0MCI+PHJlY3Qgd2lkdGg9IjQwIiBoZWlnaHQ9IjQwIiByeD0iMTAiIGZpbGw9IiMzNjM2MzYiLz48cGF0aCBkPSJNOSAyOSAyMCA5bDExIDIwaC03bC00LTgtNCA4WiIgZmlsbD0iIzE2MTYxNiIvPjwvc3ZnPg==\" alt data-v-8426fc1a><!--]--><span data-v-1168a8e4>AWRECKER</span><!--[--><!--]--></a></div></div><div class=\"content\" data-v-6aa21345><div class=\"content-body\" data-v-6aa21345><!--[--><!--]--><div class=\"VPNavBarSearch search\" data-v-6aa21345><!- 98c3a5 data-v-1428d186><div class=\"VPDoc has-aside\" data-v-1428d186 data-v-39a288b8><!--[--><!--]--><div class=\"container\" data-v-39a288b8><div class=\"aside\" data-v-39a288b8><div class=\"aside-curtain\" data-v-39a288b8></div><div class=\"aside-container\" data-v-39a288b8><div class=\"aside-content\" data-v-39a288b8><div class=\"VPDocAside\" data-v-39a288b8 data-v-3f215769><!--[--><!--]--><!--[--><!--]--><nav aria-labelledby=\"doc-outline-aria-label\" class=\"VPDocAsideOutline\" data-v-3f215769 data-v-a5bbad30><div class=\"content\" data-v-a5bbad30><div class=\"outline-marker\" data-v-a5bbad30></div><div aria-level=\"2\" class=\"outline-title\" id=\"doc-outline-aria-label\" role=\"heading\" data-v-a5bbad30>On this page</div><ul class=\"VPDocOutlineItem root\" data-v-a5bbad30 data-v-b933a997><!--[--><!--]--></ul></div></nav><!--[--><!--]--><div class=\"spacer\" data-v-3f215769></div><!--[--><!--]--><!----><!--[--><!--]--><!--[--><!--]--></div></div></div></div><div class=\"content\" data-v-39a288b8><div class=\"content-container\" data-v-39a288b8><!--[--><!--]--><main class=\"main\" data-v-39a288b8><div style=\"position:relative;\" class=\"vp-doc _awrecker-sensors_tutorials_spike-block\" data-v-39a288b8><div><h1 id=\"距離感測器-·-spike-·-pybricks-block\" tabindex=\"-1\">距離感測器 · SPIKE · Pybricks Block <a class=\"header-anchor\" href=\"#距離感測器-·-spike-·-pybricks-block\" aria-label=\"Permalink to &quot;距離感測器 · SPIKE · Pybricks Block&quot;\">​</a></h1><div class=\"doc-kicker\">PRODUCT / 01 · DISTANCE SENSOR</div><h2 id=\"產品介紹\" tabindex=\"-1\">產品介紹 <a class=\"header-anchor\" href=\"#產品介紹\" aria-label=\"Permalink to &quot;產品介紹&quot;\">​</a></h2><p>讓機器人感知前方，從距離讀值到條件控制，一步步建立你的第一個感測應用。</p><div class=\"warning custom-block\"><p class=\"custom-block-title\">產品文件預覽</p><p>本頁使用示意產品名稱與教學流程。實際量測範圍、連接介面、驅動函數與支援環境，均待產品資料確認；範例不是可直接操作硬體的正式程式。</p></div><div class=\"feature-grid\"><div class=\"feature-box\"><strong>感知距離</strong><small>了解數值讀取與距離判斷的基本概念。</small></div><div class=\"feature-box\"><strong>條件控制</strong><small>透過距離門檻，建立機器人的反應邏輯。</small></div><div class=\"feature-box\"><strong>循序學習</strong><small>依控制器與程式環境，選擇對應教學。</small></div></div><h3 id=\"產品概覽\" tabindex=\"-1\">產品概覽 <a class=\"header-anchor\" href=\"#產品概覽\" aria-label=\"Permalink to &quot;產品概覽&quot;\">​</a></h3><p>距離感測可以用於障礙物偵測、接近提示與保持間距。讀取感測器數值後，程式便能根據條件執行不同動作。</p><table tabindex=\"0\"><thead><tr><th>項目</th><th>目前狀態</th></tr></thead><tbody><tr><td>產品型號 / 照片</td><td>待甲方提供</td></tr><tr><td>量測範圍與精度</td><td>待正式規格確認</td></tr><tr><td>接頭與通訊方式</td><td>待硬體介面確認</td></tr><tr><td>EV3 / SPIKE 相容性</td><td>待驅動與韌體驗證</td></tr><tr><td>程式環境</td><td>本版展示四條教學路徑</td></tr></tbody></table><h3 id=\"開始之前\" tabindex=\"-1\">開始之前 <a class=\"header-anchor\" href=\"#開始之前\" aria-label=\"Permalink to &quot;開始之前&quot;\">​</a></h3><ol><li>確认產品版本與控制器，依正式接線圖連接感測器。</li><li>安裝對應程式環境及產品驅動。</li><li>先檢查原始讀值，再加入條件判斷與馬達控制。</li></ol><div class=\"tip custom-block\"><p class=\"custom-block-title\">閱讀建議</p><p>第一次使用時，先完成「讀取並顯示數值」，確認輸出單位與穩定性，再嘗試距離判斷。正式接線圖與驅動下載位置將在資料確認後補上。</p></div><h3 id=\"使用情境\" tabindex=\"-1\">使用情境 <a class=\"header-anchor\" href=\"#使用情境\" aria-label=\"Permalink to &quot;使用情境&quot;\">​</a></h3><ul><li><strong>避障</strong>：距離小於設定門檻時，觸發停止或轉向。</li><li><strong>接近提示</strong>：根據遠近顯示訊息或播放提示音。</li><li><strong>保持間距</strong>：持續讀取距離，作為後續控制邏輯的輸入。</li></ul><h2 id=\"使用教學-·-spike-·-pybricks-block\" tabindex=\"-1\">使用教學 · SPIKE · Pybricks Block <a class=\"header-anchor\" href=\"#使用教學-·-spike-·-pybricks-block\" aria-label=\"Permalink to &quot;使用教學 · SPIKE · Pybricks Block&quot;\">​</a></h2><p>從連接準備、函數概念到範例流程，練習讀取與判斷距離。</p><div class=\"warning custom-block\"><p class=\"custom-block-title\">示意教學</p><p>目前尚無產品驅動與正式 API。下方範例使用模擬讀值，不會與感測器通訊；實際產品相容性需先驗證。</p></div><h2 id=\"_01-環境準備\" tabindex=\"-1\">01 / 環境準備 <a class=\"header-anchor\" href=\"#_01-環境準備\" aria-label=\"Permalink to &quot;01 / 環境準備&quot;\">​</a></h2><p>準備 SPIKE 控制器與對應的 Pybricks 程式環境。變更韌體前，先確認產品驅動與韌體需求。</p><ol><li>取得產品接線圖與驅動套件。</li><li>確認連接埠與數值單位。</li><li>先完成單次數值讀取，再加入迴圈。</li></ol><h2 id=\"_02-函數與功能概念\" tabindex=\"-1\">02 / 函數與功能概念 <a class=\"header-anchor\" href=\"#_02-函數與功能概念\" aria-label=\"Permalink to &quot;02 / 函數與功能概念&quot;\">​</a></h2><table tabindex=\"0\"><thead><tr><th>功能</th><th>本範例函數</th><th>回傳 / 輸出</th></tr></thead><tbody><tr><td>讀取數值</td><td><code>read_demo_distance()</code></td><td>模擬距離，單位 mm</td></tr><tr><td>門檻判斷</td><td><code>is_near(distance_mm, threshold_mm)</code></td><td>布林值</td></tr><tr><td>顯示結果</td><td><code>print(message)</code></td><td>主控台訊息</td></tr></tbody></table><p>以上為本示例定義的函數，並非產品 API。正式驅動確認後，將模擬讀值函數替換為實際讀取函數。</p><h2 id=\"example\">03 / 範例程式</h2><p>以下展示積木邏輯順序。正式產品擴充積木與可匯入專案，將在資料確認後補上。</p><div class=\"block-flow\"><div>當程式開始</div><div>設定門檻值為 200 mm</div><div>設定模擬距離為 150 mm</div><div>如果 距離 &lt; 門檻值</div><div>顯示「前方有物體」</div></div><h2 id=\"_04-動手練習\" tabindex=\"-1\">04 / 動手練習 <a class=\"header-anchor\" href=\"#_04-動手練習\" aria-label=\"Permalink to &quot;04 / 動手練習&quot;\">​</a></h2><p>把模擬距離從 <code>150</code> 改為 <code>300</code>。門檻為 <code>200</code> mm 時，結果會切換成「通道暢通」。數值剛好等於 <code>200</code> 時也不觸發接近判斷，因為條件使用 <code>&lt;</code>。</p><h2 id=\"常見問題\" tabindex=\"-1\">常見問題 <a class=\"header-anchor\" href=\"#常見問題\" aria-label=\"Permalink to &quot;常見問題&quot;\">​</a></h2><table tabindex=\"0\"><thead><tr><th>情況</th><th>檢查方式</th></tr></thead><tbody><tr><td>沒有真實感測器讀值</td><td>本範例使用模擬資料，需補上正式產品驅動。</td></tr><tr><td>找不到對應積木</td><td>產品擴充尚待提供，本頁先展示概念流程。</td></tr><tr><td>數值單位不同</td><td>先確認驅動是否回傳 mm，再進行比較。</td></tr></tbody></table><p><a href=\"/awrecker-sensors/\">回首頁選擇其他教學</a></p></div></div></main><!----><!--[--><!--]--></div></div></div><!--[--><!--]--></div></div><!----><!--[--><!--]--></div></div>\n    \n    \n  ", "/en/": "\n    <div id=\"app\"><div class=\"Layout\" data-v-5d98c3a5><!--[--><!--]--><!--[--><span tabindex=\"-1\" data-v-0b0ada53></span><a href=\"#VPContent\" class=\"VPSkipLink visually-hidden\" data-v-0b0ada53>Skip to content</a><!--]--><!----><header class=\"VPNav\" data-v-5d98c3a5 data-v-ae24b3ad><div class=\"VPNavBar\" =\"--vp-vh:0px;\" data-v-a6f0e41e data-v-8a42e2b4><button data-v-8a42e2b4>Return to top</button><!----></div></div></div><!----><div class=\"VPContent\" id=\"VPContent\" data-v-5d98c3a5 data-v-1428d186><div class=\"VPDoc has-aside\" data-v-1428d186 data-v-39a288b8><!--[--><!--]--><div class=\"container\" data-v-39a288b8><div class=\"aside\" data-v-39a288b8><div class=\"aside-curtain\" data-v-39a288b8></div><div class=\"aside-container\" data-v-39a288b8><div class=\"aside-content\" data-v-39a288b8><div class=\"VPDocAside\" data-v-39a288b8 data-v-3f215769><!--[--><!--]--><!--[--><!--]--><nav aria-labelledby=\"doc-outline-aria-label\" class=\"VPDocAsideOutline\" data-v-3f215769 data-v-a5bbad30><div class=\"content\" data-v-a5bbad30><div class=\"outline-marker\" data-v-a5bbad30></div><div aria-level=\"2\" class=\"outline-title\" id=\"doc-outline-aria-label\" role=\"heading\" data-v-a5bbad30>On this page</div><ul class=\"VPDocOutlineItem root\" data-v-a5bbad30 data-v-b933a997><!--[--><!--]--></ul></div></nav><!--[--><!--]--><div class=\"spacer\" data-v-3f215769></div><!--[--><!--]--><!----><!--[--><!--]--><!--[--><!--]--></div></div></div></div><div class=\"content\" data-v-39a288b8><div class=\"content-container\" data-v-39a288b8><!--[--><!--]--><main class=\"main\" data-v-39a288b8><div style=\"position:relative;\" class=\"vp-doc _awrecker-sensors_products_distance\" data-v-39a288b8><div><h1 id=\"距離感測器\" tabindex=\"-1\">距離感測器 <a class=\"header-anchor\" href=\"#距離感測器\" aria-label=\"Permalink to &quot;距離感測器&quot;\">​</a></h1><div class=\"doc-kicker\">PRODUCT / 01 · DISTANCE SENSOR</div><h2 id=\"產品介紹\" tabindex=\"-1\">產品介紹 <a class=\"header-anchor\" href=\"#產品介紹\" aria-label=\"Permalink to &quot;產品介紹&quot;\">​</a></h2><p>讓機器人感知前方，從距離讀值到條件控制，一步步建立你的第一個感測應用。</p><div class=\"warning custom-block\"><p class=\"custom-block-title\">產品文件預覽</p><p>本頁使用示意產品名稱與教學流程。實際量測範圍、連接介面、驅動函數與支援環境，均待產品資料確認；範例不是可直接操作硬體的正式程式。</p></div><div class=\"feature-grid\"><div class=\"feature-box\"><strong>感知距離</strong><small>了解數值讀取與距離判斷的基本概念。</small></div><div class=\"feature-box\"><strong>條件控制</strong><small>透過距離門檻，建立機器人的反應邏輯。</small></div><div class=\"feature-box\"><strong>循序學習</strong><small>依控制器與程式環境，選擇對應教學。</small></div></div><h3 id=\"產品概覽\" tabindex=\"-1\">產品概覽 <a class=\"header-anchor\" href=\"#產品概覽\" aria-label=\"Permalink to &quot;產品概覽&quot;\">​</a></h3><p>距離感測可以用於障礙物偵測、接近提示與保持間距。讀取感測器數值後，程式便能根據條件執行不同動作。</p><table tabindex=\"0\"><thead><tr><th>項目</th><th>目前狀態</th></tr></thead><tbody><tr><td>產品型號 / 照片</td><td>待甲方提供</td></tr><tr><td>量測範圍與精度</td><td>待正式規格確認</td></tr><tr><td>接頭與通訊方式</td><td>待硬體介面確認</td></tr><tr><td>EV3 / SPIKE 相容性</td><td>待驅動與韌體驗證</td></tr><tr><td>程式環境</td><td>本版展示四條教學路徑</td></tr></tbody></table><h3 id=\"開始之前\" tabindex=\"-1\">開始之前 <a class=\"header-anchor\" href=\"#開始之前\" aria-label=\"Permalink to &quot;開始之前&quot;\">​</a></h3><ol><li>確认產品版本與控制器，依正式接線圖連接感測器。</li><li>安裝對應程式環境及產品驅動。</li><li>先檢查原始讀值，再加入條件判斷與馬達控制。</li></ol><div class=\"tip custom-block\"><p class=\"custom-block-title\">閱讀建議</p><p>第一次使用時，先完成「讀取並顯示數值」，確認輸出單位與穩定性，再嘗試距離判斷。正式接線圖與驅動下載位置將在資料確認後補上。</p></div><h3 id=\"使用情境\" tabindex=\"-1\">使用情境 <a class=\"header-anchor\" href=\"#使用情境\" aria-label=\"Permalink to &quot;使用情境&quot;\">​</a></h3><ul><li><strong>避障</strong>：距離小於設定門檻時，觸發停止或轉向。</li><li><strong>接近提示</strong>：根據遠近顯示訊息或播放提示音。</li><li><strong>保持間距</strong>：持續讀取距離，作為後續控制邏輯的輸入。</li></ul><p><a href=\"/awrecker-sensors/\">回首頁選擇教學路徑</a></p></div></div></main><!----><!--[--><!--]--></div></div></div><!--[--><!--]--></div></div><!----><!--[--><!--]--></div></div>\n    \n    \n  ", "/products/force.html": "\n    <div id=\"app\"><div class=\"Layout\" data-v-5d98c3a5><!--[--><!--]--><!--[--><span tabindex=\"-1\" data-v-0b0ada53></span><a href=\"#VPContent\" class=\"VPSkipLink visually-hidden\" data-v-0b0ada53>Skip to content</a><!--]--><!----><header class=\"VPNav\" data-v-5d98c3a5 data-v-ae24b3ad><div class=\"VPNavBar\" data-v-ae24b3ad data-v-6aa21345><div class=\"wrapper\" data-v-6aa21345><div s=\"aside-curtain\" data-v-39a288b8></div><div class=\"aside-container\" data-v-39a288b8><div class=\"aside-content\" data-v-39a288b8><div class=\"VPDocAside\" data-v-39a288b8 data-v-3f215769><!--[--><!--]--><!--[--><!--]--><nav aria-labelledby=\"doc-outline-aria-label\" class=\"VPDocAsideOutline\" data-v-3f215769 data-v-a5bbad30><div class=\"content\" data-v-a5bbad30><div class=\"outline-marker\" data-v-a5bbad30></div><div aria-level=\"2\" class=\"outline-title\" id=\"doc-outline-aria-label\" role=\"heading\" data-v-a5bbad30>On this page</div><ul class=\"VPDocOutlineItem root\" data-v-a5bbad30 data-v-b933a997><!--[--><!--]--></ul></div></nav><!--[--><!--]--><div class=\"spacer\" data-v-3f215769></div><!--[--><!--]--><!----><!--[--><!--]--><!--[--><!--]--></div></div></div></div><div class=\"content\" data-v-39a288b8><div class=\"content-container\" data-v-39a288b8><!--[--><!--]--><main class=\"main\" data-v-39a288b8><div style=\"position:relative;\" class=\"vp-doc _awrecker-sensors_en_tutorials_ev3-python\" data-v-39a288b8><div><h1 id=\"distance-sensor-·-ev3-·-pybricks-python\" tabindex=\"-1\">Distance sensor · EV3 · Pybricks Python <a class=\"header-anchor\" href=\"#distance-sensor-·-ev3-·-pybricks-python\" aria-label=\"Permalink to &quot;Distance sensor · EV3 · Pybricks Python&quot;\">​</a></h1><div class=\"doc-kicker\">PRODUCT / 01 · DISTANCE SENSOR</div><h2 id=\"product-introduction\" tabindex=\"-1\">Product introduction <a class=\"header-anchor\" href=\"#product-introduction\" aria-label=\"Permalink to &quot;Product introduction&quot;\">​</a></h2><p>Explore distance readings, then use conditions to build your first sensing workflow.</p><div class=\"warning custom-block\"><p class=\"custom-block-title\">Product documentation preview</p><p>The product name and learning flow are illustrative. Measurement range, connectors, drivers and supported environments await confirmation. Examples are not production hardware code.</p></div><div class=\"feature-grid\"><div class=\"feature-box\"><strong>Sense distance</strong><small>Learn the basics of reading values and evaluating distance.</small></div><div class=\"feature-box\"><strong>React with code</strong><small>Use a threshold to define your robot’s response.</small></div><div class=\"feature-box\"><strong>Learn step by step</strong><small>Follow a guide for your controller and environment.</small></div></div><h3 id=\"product-overview\" tabindex=\"-1\">Product overview <a class=\"header-anchor\" href=\"#product-overview\" aria-label=\"Permalink to &quot;Product overview&quot;\">​</a></h3><p>Distance sensing can support obstacle detection, proximity feedback and spacing control. Read a value, evaluate a condition and trigger an appropriate action.</p><table tabindex=\"0\"><thead><tr><th>Item</th><th>Status</th></tr></thead><tbody><tr><td>Model / product photo</td><td>Awaiting client assets</td></tr><tr><td>Measurement range / accuracy</td><td>Awaiting specifications</td></tr><tr><td>Connector / protocol</td><td>Awaiting hardware details</td></tr><tr><td>EV3 / SPIKE compatibility</td><td>Driver and firmware verification required</td></tr><tr><td>Programming environment</td><td>Four demonstration learning paths</td></tr></tbody></table><h3 id=\"before-you-begin\" tabindex=\"-1\">Before you begin <a class=\"header-anchor\" href=\"#before-you-begin\" aria-label=\"Permalink to &quot;Before you begin&quot;\">​</a></h3><ol><li>Confirm your product version and controller. Follow the official wiring diagram.</li><li>Install the required programming environment and product driver.</li><li>Check raw readings before adding conditions or motor control.</li></ol><div class=\"tip custom-block\"><p class=\"custom-block-title\">Start with a reading</p><p>Begin by displaying a value. Confirm its units and stability before testing threshold logic. Wiring diagrams and driver links will be added when supplied.</p></div><h3 id=\"applications\" tabindex=\"-1\">Applications <a class=\"header-anchor\" href=\"#applications\" aria-label=\"Permalink to &quot;Applications&quot;\">​</a></h3><ul><li><strong>Obstacle detection</strong>: stop or turn when a reading is below a threshold.</li><li><strong>Proximity feedback</strong>: show a message or sound based on distance.</li><li><strong>Spacing control</strong>: use continuous readings as an input to your control logic.</li></ul><h2 id=\"your-tutorial-·-ev3-·-pybricks-python\" tabindex=\"-1\">Your tutorial · EV3 · Pybricks Python <a class=\"header-anchor\" href=\"#your-tutorial-·-ev3-·-pybricks-python\" aria-label=\"Permalink to &quot;Your tutorial · EV3 · Pybricks Python&quot;\">​</a></h2><p>Learn to read, display and evaluate a distance value.</p><div class=\"warning custom-block\"><p class=\"custom-block-title\">Demonstration guide</p><p>The product driver and API are not available yet. The sample below uses simulated readings; it does not communicate with a sensor. Product compatibility must be verified before use.</p></div><h2 id=\"_01-prepare-your-environment\" tabindex=\"-1\">01 / Prepare your environment <a class=\"header-anchor\" href=\"#_01-prepare-your-environment\" aria-label=\"Permalink to &quot;01 / Prepare your environment&quot;\">​</a></h2><p>Prepare an EV3 and the applicable EV3 Pybricks environment. Verify the product driver supports this setup.</p><ol><li>Obtain the product wiring diagram and driver.</li><li>Confirm the port and measurement unit.</li><li>Begin with a single reading before adding a loop.</li></ol><h2 id=\"_02-function-concepts\" tabindex=\"-1\">02 / Function concepts <a class=\"header-anchor\" href=\"#_02-function-concepts\" aria-label=\"Permalink to &quot;02 / Function concepts&quot;\">​</a></h2><table tabindex=\"0\"><thead><tr><th>Concept</th><th>Demonstration function</th><th>Result</th></tr></thead><tbody><tr><td>Read a value</td><td><code>read_demo_distance()</code></td><td>Simulated distance in mm</td></tr><tr><td>Compare a threshold</td><td><code>is_near(distance_mm, threshold_mm)</code></td><td>Boolean result</td></tr><tr><td>Display feedback</td><td><code>print(message)</code></td><td>Console message</td></tr></tbody></table><p>These names belong to this example, not the product API. Replace the simulated reader with the official driver after confirmation.</p><h2 id=\"example\">03 / Example program</h2><div class=\"language-python vp-adaptive-theme\"><button title=\"Copy Code\" class=\"copy\"></button><span class=\"lang\">python</span><pre class=\"shiki shiki-themes github-light github-dark vp-code\" tabindex=\"0\"><code><span class=\"line\"><span style=\"--shiki-light:#6A737D;--shiki-dark:#6A737D;\">## Your tutorial · EV3 · Pybricks Python</span></span>\n<span class=\"line\"><span style=\"--shiki-light:#D73A49;--shiki-dark:#F97583;\">def</span><span style=\"--shiki-light:#6F42C1;--shiki-dark:#B392F0;\"> read_demo_distance</span><span style=\"--shiki-light:#24292E;--shiki-dark:#E1E4E8;\">():</span></span>\n<span class=\"line\"><span style=\"--shiki-light:#D73A49;--shiki-dark:#F97583;\">    return</span><span style=\"--shiki-light:#005CC5;--shiki-dark:#79B8FF;\"> 150</span></span>\n<span class=\"line\"></span>\n<span class=\"line\"><span style=\"--shiki-light:#D73A49;--shiki-dark:#F97583;\">def</span><span style=\"--shiki-light:#6F42C1;--shiki-dark:#B392F0;\"> is_near</span><span style=\"--shiki-light:#24292E;--shiki-dark:#E1E4E8;\">(distance_mm, threshold_mm</span><span style=\"--shiki-light:#D73A49;--shiki-dark:#F97583;\">=</span><span style=\"--shiki-light:#005CC5;--shiki-dark:#79B8FF;\">200</span><span style=\"--shiki-light:#24292E;--shiki-dark:#E1E4E8;\">):</span></span>\n<span class=\"line\"><span style=\"--shiki-light:#D73A49;--shiki-dark:#F97583;\">    return</span><span style=\"--shiki-light:#24292E;--shiki-dark:#E1E4E8;\"> distance_mm </span><span style=\"--shiki-light:#D73A49;--shiki-dark:#F97583;\">&lt;</span><span style=\"--shiki-light:#24292E;--shiki-dark:#E1E4E8;\"> threshold_mm</span></span>\n<span class=\"line\"></span>\n<span class=\"line\"><span style=\"--shiki-light:#24292E;--shiki-dark:#E1E4E8;\">distance </span><span style=\"--shiki-light:#D73A49;--shiki-dark:#F97583;\">=</span><span style=\"--shiki-light:#24292E;--shiki-dark:#E1E4E8;\"> read_demo_distance()</span></span>\n<span class=\"line\"><span style=\"--shiki-light:#005CC5;--shiki-dark:#79B8FF;\">print</span><span style=\"--shiki-light:#24292E;--shiki-dark:#E1E4E8;\">(</span><span style=\"--shiki-light:#032F62;--shiki-dark:#9ECBFF;\">&quot;Distance:&quot;</span><span style=\"--shiki-light:#24292E;--shiki-dark:#E1E4E8;\">, distance, </span><span style=\"--shiki-light:#032F62;--shiki-dark:#9ECBFF;\">&quot;mm&quot;</span><span style=\"--shiki-light:#24292E;--shiki-dark:#E1E4E8;\">)</span></span>\n<span class=\"line\"><span style=\"--shiki-light:#D73A49;--shiki-dark:#F97583;\">if</span><span style=\"--shiki-light:#24292E;--shiki-dark:#E1E4E8;\"> is_near(distance):</span></span>\n<span class=\"line\"><span style=\"--shiki-light:#005CC5;--shiki-dark:#79B8FF;\">    print</span><span style=\"--shiki-light:#24292E;--shiki-dark:#E1E4E8;\">(</span><span style=\"--shiki-light:#032F62;--shiki-dark:#9ECBFF;\">&quot;Object nearby&quot;</span><span style=\"--shiki-light:#24292E;--shiki-dark:#E1E4E8;\">)</span></span>\n<span class=\"line\"><span style=\"--shiki-light:#D73A49;--shiki-dark:#F97583;\">else</span><span style=\"--shiki-light:#24292E;--shiki-dark:#E1E4E8;\">:</span></span>\n<span class=\"line\"><span style=\"--shiki-light:#005CC5;--shiki-dark:#79B8FF;\">    print</span><span style=\"--shiki-light:#24292E;--shiki-dark:#E1E4E8;\">(</span><span style=\"--shiki-light:#032F62;--shiki-dark:#9ECBFF;\">&quot;Path clear&quot;</span><span style=\"--shiki-light:#24292E;--shiki-dark:#E1E4E8;\">)</span></span></code></pre></div><h2 id=\"_04-try-it-yourself\" tabindex=\"-1\">04 / Try it yourself <a class=\"header-anchor\" href=\"#_04-try-it-yourself\" aria-label=\"Permalink to &quot;04 / Try it yourself&quot;\">​</a></h2><p>Change the simulated distance from <code>150</code> to <code>300</code>. With a <code>200</code> mm threshold, the result changes to “Path clear”. A value exactly equal to <code>200</code> is also clear because the comparison uses <code>&lt;</code>.</p><h2 id=\"troubleshooting\" tabindex=\"-1\">Troubleshooting <a class=\"header-anchor\" href=\"#troubleshooting\" aria-label=\"Permalink to &quot;Troubleshooting&quot;\">​</a></h2><table tabindex=\"0\"><thead><tr><th>Situation</th><th>Check</th></tr></thead><tbody><tr><td>No real readings</td><td>This demo uses simulation. Add the official driver first.</td></tr><tr><td>Cannot find a block</td><td>Product extensions are pending; this is a conceptual sequence.</td></tr><tr><td>Unexpected units</td><td>Confirm the driver returns mm before comparing values.</td></tr></tbody></table><p><a href=\"/awrecker-sensors/en/\">Return home and choose another path</a></p></div></div></main><!----><!--[--><!--]--></div></div></div><!--[--><!--]--></div></div><!----><!--[--><!--]--></div></div>\n    \n    \n  ", "/en/tutorials/spike-app.html": "\n    <div id=\"app\"><div class=\"Layout\" data-v-5d98c3a5><!--[--><!--]--><!--[--><span tabindex=\"-1\" data-v-0b0ada53></span><a href=\"#VPContent\" class=\"VPSkipLink visually-hidden\" data-v-0b0ada53>Skip to content</a><!--]--><!----><header class=\"VPNav\" data-v-5d98c3a5 data-v-ae24b3ad><div class=\"VPNavBar\" data-v-ae24b3ad data-v-6aa21345><div class=\"wrapper\" data-v-6aa21345><div class=\"container\" data-v-6aa21345><div class=\"title\" data-v-6aa21345><div class=\"VPNavBarTitle\" data-v-6aa21345 data-v-1168a8e4><a class=\"title\" href=\"/awrecker-sensors/en/\" data-v-1168a8e4><!--[--><!--]--><!--[--><img class=\"VPImage logo\" src=\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA0MCA0MCI+PHJlY3Qgd2lkdGg9IjQwIiBoZWlnaHQ9IjQwIiByeD0iMTAiIGZpbGw9IiMzNjM2MzYiLz48cGF0aCBkPSJNOSAyOSAyMCA5bDExIDIwaC03bC00LTgtNCA4WiIgZmlsbD0iIzE2MTYxNiIvPjwvc3ZnPg==\" alt data- !----><div class=\"VPLocalNavOutlineDropdown\" style=\"--vp-vh:0px;\" data-v-a6f0e41e data-v-8a42e2b4><button data-v-8a42e2b4>Return to top</button><!----></div></div></div><!----><div class=\"VPContent\" id=\"VPContent\" data-v-5d98c3a5 data-v-1428d186><div class=\"VPDoc has-aside\" data-v-1428d186 data-v-39a288b8><!--[--><!--]--><div class=\"container\" data-v-39a288b8><div class=\"aside\" data-v-39a288b8><div class=\"aside-curtain\" data-v-39a288b8></div><div class=\"aside-container\" data-v-39a288b8><div class=\"aside-content\" data-v-39a288b8><div class=\"VPDocAside\" data-v-39a288b8 data-v-3f215769><!--[--><!--]--><!--[--><!--]--><nav aria-labelledby=\"doc-outline-aria-label\" class=\"VPDocAsideOutline\" data-v-3f215769 data-v-a5bbad30><div class=\"content\" data-v-a5bbad30><div class=\"outline-marker\" data-v-a5bbad30></div><div aria-level=\"2\" class=\"outline-title\" id=\"doc-outline-aria-label\" role=\"heading\" data-v-a5bbad30>On this page</div><ul class=\"VPDocOutlineItem root\" data-v-a5bbad30 data-v-b933a997><!--[--><!--]--></ul></div></nav><!--[--><!--]--><div class=\"spacer\" data-v-3f215769></div><!--[--><!--]--><!----><!--[--><!--]--><!--[--><!--]--></div></div></div></div><div class=\"content\" data-v-39a288b8><div class=\"content-container\" data-v-39a288b8><!--[--><!--]--><main class=\"main\" data-v-39a288b8><div style=\"position:relative;\" class=\"vp-doc _awrecker-sensors_en_tutorials_spike-app\" data-v-39a288b8><div><h1 id=\"distance-sensor-·-spike-·-spike-app\" tabindex=\"-1\">Distance sensor · SPIKE · SPIKE App <a class=\"header-anchor\" href=\"#distance-sensor-·-spike-·-spike-app\" aria-label=\"Permalink to &quot;Distance sensor · SPIKE · SPIKE App&quot;\">​</a></h1><div class=\"doc-kicker\">PRODUCT / 01 · DISTANCE SENSOR</div><h2 id=\"product-introduction\" tabindex=\"-1\">Product introduction <a class=\"header-anchor\" href=\"#product-introduction\" aria-label=\"Permalink to &quot;Product introduction&quot;\">​</a></h2><p>Explore distance readings, then use conditions to build your first sensing workflow.</p><div class=\"warning custom-block\"><p class=\"custom-block-title\">Product documentation preview</p><p>The product name and learning flow are illustrative. Measurement range, connectors, drivers and supported environments await confirmation. Examples are not production hardware code.</p></div><div class=\"feature-grid\"><div class=\"feature-box\"><strong>Sense distance</strong><small>Learn the basics of reading values and evaluating distance.</small></div><div class=\"feature-box\"><strong>React with code</strong><small>Use a threshold to define your robot’s response.</small></div><div class=\"feature-box\"><strong>Learn step by step</strong><small>Follow a guide for your controller and environment.</small></div></div><h3 id=\"product-overview\" tabindex=\"-1\">Product overview <a class=\"header-anchor\" href=\"#product-overview\" aria-label=\"Permalink to &quot;Product overview&quot;\">​</a></h3><p>Distance sensing can support obstacle detection, proximity feedback and spacing control. Read a value, evaluate a condition and trigger an appropriate action.</p><table tabindex=\"0\"><thead><tr><th>Item</th><th>Status</th></tr></thead><tbody><tr><td>Model / product photo</td><td>Awaiting client assets</td></tr><tr><td>Measurement range / accuracy</td><td>Awaiting specifications</td></tr><tr><td>Connector / protocol</td><td>Awaiting hardware details</td></tr><tr><td>EV3 / SPIKE compatibility</td><td>Driver and firmware verification required</td></tr><tr><td>Programming environment</td><td>Four demonstration learning paths</td></tr></tbody></table><h3 id=\"before-you-begin\" tabindex=\"-1\">Before you begin <a class=\"header-anchor\" href=\"#before-you-begin\" aria-label=\"Permalink to &quot;Before you begin&quot;\">​</a></h3><ol><li>Confirm your product version and controller. Follow the official wiring diagram.</li><li>Install the required programming environment and product driver.</li><li>Check raw readings before adding conditions or motor control.</li></ol><div class=\"tip custom-block\"><p class=\"custom-block-title\">Start with a reading</p><p>Begin by displaying a value. Confirm its units and stability before testing threshold logic. Wiring diagrams and driver links will be added when supplied.</p></div><h3 id=\"applications\" tabindex=\"-1\">Applications <a class=\"header-anchor\" href=\"#applications\" aria-label=\"Permalink to &quot;Applications&quot;\">​</a></h3><ul><li><strong>Obstacle detection</strong>: stop or turn when a reading is below a threshold.</li><li><strong>Proximity feedback</strong>: show a message or sound based on distance.</li><li><strong>Spacing control</strong>: use continuous readings as an input to your control logic.</li></ul><h2 id=\"your-tutorial-·-spike-·-spike-app\" tabindex=\"-1\">Your tutorial · SPIKE · SPIKE App <a class=\"header-anchor\" href=\"#your-tutorial-·-spike-·-spike-app\" aria-label=\"Permalink to &quot;Your tutorial · SPIKE · SPIKE App&quot;\">​</a></h2><p>Learn to read, display and evaluate a distance value.</p><div class=\"warning custom-block\"><p class=\"custom-block-title\">Demonstration guide</p><p>The product driver and API are not available yet. The sample below uses simulated readings; it does not communicate with a sensor. Product compatibility must be verified before use.</p></div><h2 id=\"_01-prepare-your-environment\" tabindex=\"-1\">01 / Prepare your environment <a class=\"header-anchor\" href=\"#_01-prepare-your-environment\" aria-label=\"Permalink to &quot;01 / Prepare your environment&quot;\">​</a></h2><p>Prepare a SPIKE controller and the SPIKE App. Verify driver and firmware requirements before changing firmware.</p><ol><li>Obtain the product wiring diagram and driver.</li><li>Confirm the port and measurement unit.</li><li>Begin with a single reading before adding a loop.</li></ol><h2 id=\"_02-function-concepts\" tabindex=\"-1\">02 / Function concepts <a class=\"header-anchor\" href=\"#_02-function-concepts\" aria-label=\"Permalink to &quot;02 / Function concepts&quot;\">​</a></h2><table tabindex=\"0\"><thead><tr><th>Concept</th><th>Demonstration function</th><th>Result</th></tr></thead><tbody><tr><td>Read a value</td><td><code>read_demo_distance()</code></td><td>Simulated distance in mm</td></tr><tr><td>Compare a threshold</td><td><code>is_near(distance_mm, threshold_mm)</code></td><td>Boolean result</td></tr><tr><td>Display feedback</td><td><code>print(message)</code></td><td>Console message</td></tr></tbody></table><p>These names belong to this example, not the product API. Replace the simulated reader with the official driver after confirmation.</p><h2 id=\"example\">03 / Example program</h2><p>This is a conceptual block sequence. The official product extension and importable project will be added when available.</p><div class=\"block-flow\"><div>When program starts</div><div>Set threshold to 200 mm</div><div>Set simulated distance to 150 mm</div><div>If distance &lt; threshold</div><div>Display “Object nearby”</div></div><h2 id=\"_04-try-it-yourself\" tabindex=\"-1\">04 / Try it yourself <a class=\"header-anchor\" href=\"#_04-try-it-yourself\" aria-label=\"Permalink to &quot;04 / Try it yourself&quot;\">​</a></h2><p>Change the simulated distance from <code>150</code> to <code>300</code>. With a <code>200</code> mm threshold, the result changes to “Path clear”. A value exactly equal to <code>200</code> is also clear because the comparison uses <code>&lt;</code>.</p><h2 id=\"troubleshooting\" tabindex=\"-1\">Troubleshooting <a class=\"header-anchor\" href=\"#troubleshooting\" aria-label=\"Permalink to &quot;Troubleshooting&quot;\">​</a></h2><table tabindex=\"0\"><thead><tr><th>Situation</th><th>Check</th></tr></thead><tbody><tr><td>No real readings</td><td>This demo uses simulation. Add the official driver first.</td></tr><tr><td>Cannot find a block</td><td>Product extensions are pending; this is a conceptual sequence.</td></tr><tr><td>Unexpected units</td><td>Confirm the driver returns mm before comparing values.</td></tr></tbody></table><p><a href=\"/awrecker-sensors/en/\">Return home and choose another path</a></p></div></div></main><!----><!--[--><!--]--></div></div></div><!--[--><!--]--></div></div><!----><!--[--><!--]--></div></div>\n    \n    \n  ", "/en/tutorials/spike-python.html": "\n    <div id=\"app\"><div class=\"Layout\" data-v-5d98c3a5><!--[--><!--]--><!--[--><span tabindex=\"-1\" data-v-0b0ada53></span><a href=\"#VPContent\" class=\"VPSkipLink visually-hidden\" data-v-0b0ada53>Skip to content</a><!--]--><!----><header class=\"VPNav\" data-v-5d98c3a5 data-v-ae24b3ad><div class=\"VPNavBar\" data-v-ae24b3ad data-v-6aa21345><div class=\"wrapper\" data-v-6aa21345><div class=\"container\" data-v-6aa21345><div class=\"title\" data-v-6aa21345><div class=\"VPNavBarTitle\" data-v-6aa21345 data-v-1168a8e4><a class=\"title\" href=\"/awrecker-sensors/en/\" data-v-1168a8e4><!--[--><!--]--><!--[--><img class=\"VPImage logo\" src=\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA0MCA0MCI+PHJlY3Qgd2lkdGg9IjQwIiBoZWlnaHQ9IjQwIiByeD0iMTAiIGZpbGw9IiMzNjM2MzYiLz48cGF0aCBkPSJNOSAyOSAyMCA5bDExIDIwaC03bC00LTgtNCA4WiIgZmlsbD0iIzE2MTYxNiIvPjwvc3ZnPg==\" alt data-v-8426fc1a><!--]--><span data-v-1168a8e4>AWRECKER</span><!--[--><!--]--></a></div></div><div class=\"content\" data-v-6aa21345><div class=\"content-body\" data-v-6aa21345><!--[--><!--]--><div class=\"VPNavBarSearch search\" data-v-6aa21345><!----></div><nav aria-labelledby=\"main-nav-aria-label\" class=\"VPNavBarMenu menu\" data-v-6aa21345 data-v-dc692963><span id=\"main-nav-aria-label\" class=\"visually-hidden\" data-v-dc692963> Main Navigation </span><!--[--><!--]--></nav><div class=\"VPFlyout VPNavBarTranslations translations\" data-v-6aa21345 data-v-88af2de4 data-v-cf11d7a2><button type=\"button\" class=\"button\" aria-haspopup=\"true\" aria-expanded=\"false\" aria-label=\"Change language\" data-v-cf11d7a2 box\"><strong>Learn step by step</strong><small>Follow a guide for your controller and environment.</small></div></div><h3 id=\"product-overview\" tabindex=\"-1\">Product overview <a class=\"header-anchor\" href=\"#product-overview\" aria-label=\"Permalink to &quot;Product overview&quot;\">​</a></h3><p>Distance sensing can support obstacle detection, proximity feedback and spacing control. Read a value, evaluate a condition and trigger an appropriate action.</p><table tabindex=\"0\"><thead><tr><th>Item</th><th>Status</th></tr></thead><tbody><tr><td>Model / product photo</td><td>Awaiting client assets</td></tr><tr><td>Measurement range / accuracy</td><td>Awaiting specifications</td></tr><tr><td>Connector / protocol</td><td>Awaiting hardware details</td></tr><tr><td>EV3 / SPIKE compatibility</td><td>Driver and firmware verification required</td></tr><tr><td>Programming environment</td><td>Four demonstration learning paths</td></tr></tbody></table><h3 id=\"before-you-begin\" tabindex=\"-1\">Before you begin <a class=\"header-anchor\" href=\"#before-you-begin\" aria-label=\"Permalink to &quot;Before you begin&quot;\">​</a></h3><ol><li>Confirm your product version and controller. Follow the official wiring diagram.</li><li>Install the required programming environment and product driver.</li><li>Check raw readings before adding conditions or motor control.</li></ol><div class=\"tip custom-block\"><p class=\"custom-block-title\">Start with a reading</p><p>Begin by displaying a value. Confirm its units and stability before testing threshold logic. Wiring diagrams and driver links will be added when supplied.</p></div><h3 id=\"applications\" tabindex=\"-1\">Applications <a class=\"header-anchor\" href=\"#applications\" aria-label=\"Permalink to &quot;Applications&quot;\">​</a></h3><ul><li><strong>Obstacle detection</strong>: stop or turn when a reading is below a threshold.</li><li><strong>Proximity feedback</strong>: show a message or sound based on distance.</li><li><strong>Spacing control</strong>: use continuous readings as an input to your control logic.</li></ul><h2 id=\"your-tutorial-·-spike-·-pybricks-python\" tabindex=\"-1\">Your tutorial · SPIKE · Pybricks Python <a class=\"header-anchor\" href=\"#your-tutorial-·-spike-·-pybricks-python\" aria-label=\"Permalink to &quot;Your tutorial · SPIKE · Pybricks Python&quot;\">​</a></h2><p>Learn to read, display and evaluate a distance value.</p><div class=\"warning custom-block\"><p class=\"custom-block-title\">Demonstration guide</p><p>The product driver and API are not available yet. The sample below uses simulated readings; it does not communicate with a sensor. Product compatibility must be verified before use.</p></div><h2 id=\"_01-prepare-your-environment\" tabindex=\"-1\">01 / Prepare your environment <a class=\"header-anchor\" href=\"#_01-prepare-your-environment\" aria-label=\"Permalink to &quot;01 / Prepare your environment&quot;\">​</a></h2><p>Prepare a SPIKE controller and the corresponding Pybricks environment. Verify driver and firmware requirements before changing firmware.</p><ol><li>Obtain the product wiring diagram and driver.</li><li>Confirm the port and measurement unit.</li><li>Begin with a single reading before adding a loop.</li></ol><h2 id=\"_02-function-concepts\" tabindex=\"-1\">02 / Function concepts <a class=\"header-anchor\" href=\"#_02-function-concepts\" aria-label=\"Permalink to &quot;02 / Function concepts&quot;\">​</a></h2><table tabindex=\"0\"><thead><tr><th>Concept</th><th>Demonstration function</th><th>Result</th></tr></thead><tbody><tr><td>Read a value</td><td><code>read_demo_distance()</code></td><td>Simulated distance in mm</td></tr><tr><td>Compare a threshold</td><td><code>is_near(distance_mm, threshold_mm)</code></td><td>Boolean result</td></tr><tr><td>Display feedback</td><td><code>print(message)</code></td><td>Console message</td></tr></tbody></table><p>These names belong to this example, not the product API. Replace the simulated reader with the official driver after confirmation.</p><h2 id=\"example\">03 / Example program</h2><div class=\"language-python vp-adaptive-theme\"><button title=\"Copy Code\" class=\"copy\"></button><span class=\"lang\">python</span><pre class=\"shiki shiki-themes github-light github-dark vp-code\" tabindex=\"0\"><code><span class=\"line\"><span style=\"--shiki-light:#6A737D;--shiki-dark:#6A737D;\">## Your tutorial · SPIKE · Pybricks Python</span></span>\n<span class=\"line\"><span style=\"--shiki-light:#D73A49;--shiki-dark:#F97583;\">def</span><span style=\"--shiki-light:#6F42C1;--shiki-dark:#B392F0;\"> read_demo_distance</span><span style=\"--shiki-light:#24292E;--shiki-dark:#E1E4E8;\">():</span></span>\n<span class=\"line\"><span style=\"--shiki-light:#D73A49;--shiki-dark:#F97583;\">    return</span><span style=\"--shiki-light:#005CC5;--shiki-dark:#79B8FF;\"> 150</span></span>\n<span class=\"line\"></span>\n<span class=\"line\"><span style=\"--shiki-light:#D73A49;--shiki-dark:#F97583;\">def</span><span style=\"--shiki-light:#6F42C1;--shiki-dark:#B392F0;\"> is_near</span><span style=\"--shiki-light:#24292E;--shiki-dark:#E1E4E8;\">(distance_mm, threshold_mm</span><span style=\"--shiki-light:#D73A49;--shiki-dark:#F97583;\">=</span><span style=\"--shiki-light:#005CC5;--shiki-dark:#79B8FF;\">200</span><span style=\"--shiki-light:#24292E;--shiki-dark:#E1E4E8;\">):</span></span>\n<span class=\"line\"><span style=\"--shiki-light:#D73A49;--shiki-dark:#F97583;\">    return</span><span style=\"--shiki-light:#24292E;--shiki-dark:#E1E4E8;\"> distance_mm </span><span style=\"--shiki-light:#D73A49;--shiki-dark:#F97583;\">&lt;</span><span style=\"--shiki-light:#24292E;--shiki-dark:#E1E4E8;\"> threshold_mm</span></span>\n<span class=\"line\"></span>\n<span class=\"line\"><span style=\"--shiki-light:#24292E;--shiki-dark:#E1E4E8;\">distance </span><span style=\"--shiki-light:#D73A49;--shiki-dark:#F97583;\">=</span><span style=\"--shiki-light:#24292E;--shiki-dark:#E1E4E8;\"> read_demo_distance()</span></span>\n<span class=\"line\"><span style=\"--shiki-light:#005CC5;--shiki-dark:#79B8FF;\">print</span><span style=\"--shiki-light:#24292E;--shiki-dark:#E1E4E8;\">(</span><span style=\"--shiki-light:#032F62;--shiki-dark:#9ECBFF;\">&quot;Distance:&quot;</span><span style=\"--shiki-light:#24292E;--shiki-dark:#E1E4E8;\">, distance, </span><span style=\"--shiki-light:#032F62;--shiki-dark:#9ECBFF;\">&quot;mm&quot;</span><span style=\"--shiki-light:#24292E;--shiki-dark:#E1E4E8;\">)</span></span>\n<span class=\"line\"><span style=\"--shiki-light:#D73A49;--shiki-dark:#F97583;\">if</span><span style=\"--shiki-light:#24292E;--shiki-dark:#E1E4E8;\"> is_near(distance):</span></span>\n<span class=\"line\"><span style=\"--shiki-light:#005CC5;--shiki-dark:#79B8FF;\">    print</span><span style=\"--shiki-light:#24292E;--shiki-dark:#E1E4E8;\">(</span><span style=\"--shiki-light:#032F62;--shiki-dark:#9ECBFF;\">&quot;Object nearby&quot;</span><span style=\"--shiki-light:#24292E;--shiki-dark:#E1E4E8;\">)</span></span>\n<span class=\"line\"><span style=\"--shiki-light:#D73A49;--shiki-dark:#F97583;\">else</span><span style=\"--shiki-light:#24292E;--shiki-dark:#E1E4E8;\">:</span></span>\n<span class=\"line\"><span style=\"--shiki-light:#005CC5;--shiki-dark:#79B8FF;\">    print</span><span style=\"--shiki-light:#24292E;--shiki-dark:#E1E4E8;\">(</span><span style=\"--shiki-light:#032F62;--shiki-dark:#9ECBFF;\">&quot;Path clear&quot;</span><span style=\"--shiki-light:#24292E;--shiki-dark:#E1E4E8;\">)</span></span></code></pre></div><h2 id=\"_04-try-it-yourself\" tabindex=\"-1\">04 / Try it yourself <a class=\"header-anchor\" href=\"#_04-try-it-yourself\" aria-label=\"Permalink to &quot;04 / Try it yourself&quot;\">​</a></h2><p>Change the simulated distance from <code>150</code> to <code>300</code>. With a <code>200</code> mm threshold, the result changes to “Path clear”. A value exactly equal to <code>200</code> is also clear because the comparison uses <code>&lt;</code>.</p><h2 id=\"troubleshooting\" tabindex=\"-1\">Troubleshooting <a class=\"header-anchor\" href=\"#troubleshooting\" aria-label=\"Permalink to &quot;Troubleshooting&quot;\">​</a></h2><table tabindex=\"0\"><thead><tr><th>Situation</th><th>Check</th></tr></thead><tbody><tr><td>No real readings</td><td>This demo uses simulation. Add the official driver first.</td></tr><tr><td>Cannot find a block</td><td>Product extensions are pending; this is a conceptual sequence.</td></tr><tr><td>Unexpected units</td><td>Confirm the driver returns mm before comparing values.</td></tr></tbody></table><p><a href=\"/awrecker-sensors/en/\">Return home and choose another path</a></p></div></div></main><!----><!--[--><!--]--></div></div></div><!--[--><!--]--></div></div><!----><!--[--><!--]--></div></div>\n    \n    \n  ", "/en/tutorials/spike-block.html": "\n    <div id=\"app\"><div class=\"Layout\" data-v-5d98c3a5><!--[--><!--]--><!--[--><span tabindex=\"-1\" data-v-0b0ada53></span><a href=\"#VPContent\" class=\"VPSkipLink visually-hidden\" data-v-0b0ada53>Skip to content</a><!--]--><!----><header class=\"VPNav\" data-v-5d98c3a5 data-v-ae24b3ad><div class=\"VPNavBar\" data-v-ae24b3ad data-v-6aa21345><div class=\"wrapper\" data-v-6aa21345><div class=\"container\" data-v-6aa21345><div class=\"title\" data-v-6aa21345><div class=\"VPNavBarTitle\" data-v-6aa21345 data-v-1168a8e4><a class=\"title\" href=\"/awrecker-sensors/en/\" data-v-1168a8e4><!--[--><!--]--><!--[--><img class=\"VPImage logo\" src=\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA0MCA0MCI+PHJlY3Qgd2lkdGg9IjQwIiBoZWlnaHQ9IjQwIiByeD0iMTAiIGZpbGw9IiMzNjM2MzYiLz48cGF0aCBkPSJNOSAyOSAyMCA5bDExIDIwaC03bC00LTgtNCA4WiIgZmlsbD0iIzE2MTYxNiIvPjwvc3ZnPg==\" alt data-v-8426fc1a><!--]--><span data-v-1168a8e4>AWRECKER</span><!--[--><!--]--></a></div></div><div class=\"content\" data-v-6aa21345><div class=\"content-body\" data-v-6aa21345><!--[--><!--]--><div class=\"VPNavBarSearch search\" data-v-6aa2134 8c3a5 data-v-1428d186><div class=\"VPDoc has-aside\" data-v-1428d186 data-v-39a288b8><!--[--><!--]--><div class=\"container\" data-v-39a288b8><div class=\"aside\" data-v-39a288b8><div class=\"aside-curtain\" data-v-39a288b8></div><div class=\"aside-container\" data-v-39a288b8><div class=\"aside-content\" data-v-39a288b8><div class=\"VPDocAside\" data-v-39a288b8 data-v-3f215769><!--[--><!--]--><!--[--><!--]--><nav aria-labelledby=\"doc-outline-aria-label\" class=\"VPDocAsideOutline\" data-v-3f215769 data-v-a5bbad30><div class=\"content\" data-v-a5bbad30><div class=\"outline-marker\" data-v-a5bbad30></div><div aria-level=\"2\" class=\"outline-title\" id=\"doc-outline-aria-label\" role=\"heading\" data-v-a5bbad30>On this page</div><ul class=\"VPDocOutlineItem root\" data-v-a5bbad30 data-v-b933a997><!--[--><!--]--></ul></div></nav><!--[--><!--]--><div class=\"spacer\" data-v-3f215769></div><!--[--><!--]--><!----><!--[--><!--]--><!--[--><!--]--></div></div></div></div><div class=\"content\" data-v-39a288b8><div class=\"content-container\" data-v-39a288b8><!--[--><!--]--><main class=\"main\" data-v-39a288b8><div style=\"position:relative;\" class=\"vp-doc _awrecker-sensors_en_tutorials_spike-block\" data-v-39a288b8><div><h1 id=\"distance-sensor-·-spike-·-pybricks-block\" tabindex=\"-1\">Distance sensor · SPIKE · Pybricks Block <a class=\"header-anchor\" href=\"#distance-sensor-·-spike-·-pybricks-block\" aria-label=\"Permalink to &quot;Distance sensor · SPIKE · Pybricks Block&quot;\">​</a></h1><div class=\"doc-kicker\">PRODUCT / 01 · DISTANCE SENSOR</div><h2 id=\"product-introduction\" tabindex=\"-1\">Product introduction <a class=\"header-anchor\" href=\"#product-introduction\" aria-label=\"Permalink to &quot;Product introduction&quot;\">​</a></h2><p>Explore distance readings, then use conditions to build your first sensing workflow.</p><div class=\"warning custom-block\"><p class=\"custom-block-title\">Product documentation preview</p><p>The product name and learning flow are illustrative. Measurement range, connectors, drivers and supported environments await confirmation. Examples are not production hardware code.</p></div><div class=\"feature-grid\"><div class=\"feature-box\"><strong>Sense distance</strong><small>Learn the basics of reading values and evaluating distance.</small></div><div class=\"feature-box\"><strong>React with code</strong><small>Use a threshold to define your robot’s response.</small></div><div class=\"feature-box\"><strong>Learn step by step</strong><small>Follow a guide for your controller and environment.</small></div></div><h3 id=\"product-overview\" tabindex=\"-1\">Product overview <a class=\"header-anchor\" href=\"#product-overview\" aria-label=\"Permalink to &quot;Product overview&quot;\">​</a></h3><p>Distance sensing can support obstacle detection, proximity feedback and spacing control. Read a value, evaluate a condition and trigger an appropriate action.</p><table tabindex=\"0\"><thead><tr><th>Item</th><th>Status</th></tr></thead><tbody><tr><td>Model / product photo</td><td>Awaiting client assets</td></tr><tr><td>Measurement range / accuracy</td><td>Awaiting specifications</td></tr><tr><td>Connector / protocol</td><td>Awaiting hardware details</td></tr><tr><td>EV3 / SPIKE compatibility</td><td>Driver and firmware verification required</td></tr><tr><td>Programming environment</td><td>Four demonstration learning paths</td></tr></tbody></table><h3 id=\"before-you-begin\" tabindex=\"-1\">Before you begin <a class=\"header-anchor\" href=\"#before-you-begin\" aria-label=\"Permalink to &quot;Before you begin&quot;\">​</a></h3><ol><li>Confirm your product version and controller. Follow the official wiring diagram.</li><li>Install the required programming environment and product driver.</li><li>Check raw readings before adding conditions or motor control.</li></ol><div class=\"tip custom-block\"><p class=\"custom-block-title\">Start with a reading</p><p>Begin by displaying a value. Confirm its units and stability before testing threshold logic. Wiring diagrams and driver links will be added when supplied.</p></div><h3 id=\"applications\" tabindex=\"-1\">Applications <a class=\"header-anchor\" href=\"#applications\" aria-label=\"Permalink to &quot;Applications&quot;\">​</a></h3><ul><li><strong>Obstacle detection</strong>: stop or turn when a reading is below a threshold.</li><li><strong>Proximity feedback</strong>: show a message or sound based on distance.</li><li><strong>Spacing control</strong>: use continuous readings as an input to your control logic.</li></ul><h2 id=\"your-tutorial-·-spike-·-pybricks-block\" tabindex=\"-1\">Your tutorial · SPIKE · Pybricks Block <a class=\"header-anchor\" href=\"#your-tutorial-·-spike-·-pybricks-block\" aria-label=\"Permalink to &quot;Your tutorial · SPIKE · Pybricks Block&quot;\">​</a></h2><p>Learn to read, display and evaluate a distance value.</p><div class=\"warning custom-block\"><p class=\"custom-block-title\">Demonstration guide</p><p>The product driver and API are not available yet. The sample below uses simulated readings; it does not communicate with a sensor. Product compatibility must be verified before use.</p></div><h2 id=\"_01-prepare-your-environment\" tabindex=\"-1\">01 / Prepare your environment <a class=\"header-anchor\" href=\"#_01-prepare-your-environment\" aria-label=\"Permalink to &quot;01 / Prepare your environment&quot;\">​</a></h2><p>Prepare a SPIKE controller and the corresponding Pybricks environment. Verify driver and firmware requirements before changing firmware.</p><ol><li>Obtain the product wiring diagram and driver.</li><li>Confirm the port and measurement unit.</li><li>Begin with a single reading before adding a loop.</li></ol><h2 id=\"_02-function-concepts\" tabindex=\"-1\">02 / Function concepts <a class=\"header-anchor\" href=\"#_02-function-concepts\" aria-label=\"Permalink to &quot;02 / Function concepts&quot;\">​</a></h2><table tabindex=\"0\"><thead><tr><th>Concept</th><th>Demonstration function</th><th>Result</th></tr></thead><tbody><tr><td>Read a value</td><td><code>read_demo_distance()</code></td><td>Simulated distance in mm</td></tr><tr><td>Compare a threshold</td><td><code>is_near(distance_mm, threshold_mm)</code></td><td>Boolean result</td></tr><tr><td>Display feedback</td><td><code>print(message)</code></td><td>Console message</td></tr></tbody></table><p>These names belong to this example, not the product API. Replace the simulated reader with the official driver after confirmation.</p><h2 id=\"example\">03 / Example program</h2><p>This is a conceptual block sequence. The official product extension and importable project will be added when available.</p><div class=\"block-flow\"><div>When program starts</div><div>Set threshold to 200 mm</div><div>Set simulated distance to 150 mm</div><div>If distance &lt; threshold</div><div>Display “Object nearby”</div></div><h2 id=\"_04-try-it-yourself\" tabindex=\"-1\">04 / Try it yourself <a class=\"header-anchor\" href=\"#_04-try-it-yourself\" aria-label=\"Permalink to &quot;04 / Try it yourself&quot;\">​</a></h2><p>Change the simulated distance from <code>150</code> to <code>300</code>. With a <code>200</code> mm threshold, the result changes to “Path clear”. A value exactly equal to <code>200</code> is also clear because the comparison uses <code>&lt;</code>.</p><h2 id=\"troubleshooting\" tabindex=\"-1\">Troubleshooting <a class=\"header-anchor\" href=\"#troubleshooting\" aria-label=\"Permalink to &quot;Troubleshooting&quot;\">​</a></h2><table tabindex=\"0\"><thead><tr><th>Situation</th><th>Check</th></tr></thead><tbody><tr><td>No real readings</td><td>This demo uses simulation. Add the official driver first.</td></tr><tr><td>Cannot find a block</td><td>Product extensions are pending; this is a conceptual sequence.</td></tr><tr><td>Unexpected units</td><td>Confirm the driver returns mm before comparing values.</td></tr></tbody></table><p><a href=\"/awrecker-sensors/en/\">Return home and choose another path</a></p></div></div></main><!----><!--[--><!--]--></div></div></div><!--[--><!--]--></div></div><!----><!--[--><!--]--></div></div>\n    \n    \n  ", "/en/products/color.html": "\n    <div id=\"app\"><div class=\"Layout\" data-v-5d98c3a5><!--[--><!--]--><!--[--><span tabindex=\"-1\" data-v-0b0ada53></span><a href=\"#VPContent\" class=\"VPSkipLink visually-hidden\" data-v-0b0ada53>Skip to content</a><!--]--><!----><header class=\"VPNav\" data-v-5d98c3a5 data-v-ae24b3ad><div class=\"VPNavBar\" data-v-ae24b3ad data-v-6aa21345><div class=\"wrapper\" data-v-6aa21345><div class=\"container\" data-v-6aa21345><div class=\"title\" data-v-6aa21345><div class=\"VPNavBarTitle\" data-v-6aa21345 data-v-1168a8e4><a class=\"title\" href=\"/awrecker-sensors/en/\" data-v-1168a8e4><!--[--><!--]--><!--[--><img class=\"VPImage logo\" src=\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA0MCA0MCI+PHJlY3Qgd2lkdGg9IjQwIiBoZWlnaHQ9IjQwIiByeD0iMTAiIGZpbGw9IiMzNjM2MzYiLz48cGF0aCBkPSJNOSAyOSAyMCA5bDExIDIwaC03bC00LTgtNCA4WiIgZmlsbD0iIzE2MTYxNiIvPjwvc3ZnPg==\" alt data-v-8426fc1a><!--]--><span data-v-1168a8e4>AWRECKER</span><!--[--><!--]--></a></div></div><div class=\"content\" data-v-6aa21345><div class=\"content-body\" data-v-6aa21345><!--[--><!--]--><div class=\"VPNavBarSearch search\" data-v-6aa21345><!----></div><nav aria-labelledby=\"main-nav-aria-label\" class=\"VPNavBarMenu menu\" data-v-6aa21345 data-v-dc692963><span id=\"main-nav-aria-label\" class=\"visually-hidden\" data-v-dc692963> Main Navigation </span><!--[--><!--]--></nav><div class=\"VPFlyout VPNavBarTranslations translations\" data-v-6aa21345 data-v-88af2de4 data-v-cf11d7a2><button type=\"button\" class=\"button\" aria-haspopup=\"true\" aria-expanded=\"false\" aria-label=\"Change language\" data-v-cf11d7a2><span class=\"text\" data-v-cf11d7a2><span class=\"vpi-languages option-icon\" data-v-cf11d7a2></span><!----><span class=\"vpi-chevron-down text-icon\" data-v-cf11d7a2></sp distance-sensor\" aria-label=\"Permalink to &quot;Distance sensor&quot;\">​</a></h1><div class=\"doc-kicker\">PRODUCT / 01 · DISTANCE SENSOR</div><h2 id=\"product-introduction\" tabindex=\"-1\">Product introduction <a class=\"header-anchor\" href=\"#product-introduction\" aria-label=\"Permalink to &quot;Product introduction&quot;\">​</a></h2><p>Explore distance readings, then use conditions to build your first sensing workflow.</p><div class=\"warning custom-block\"><p class=\"custom-block-title\">Product documentation preview</p><p>The product name and learning flow are illustrative. Measurement range, connectors, drivers and supported environments await confirmation. Examples are not production hardware code.</p></div><div class=\"feature-grid\"><div class=\"feature-box\"><strong>Sense distance</strong><small>Learn the basics of reading values and evaluating distance.</small></div><div class=\"feature-box\"><strong>React with code</strong><small>Use a threshold to define your robot’s response.</small></div><div class=\"feature-box\"><strong>Learn step by step</strong><small>Follow a guide for your controller and environment.</small></div></div><h3 id=\"product-overview\" tabindex=\"-1\">Product overview <a class=\"header-anchor\" href=\"#product-overview\" aria-label=\"Permalink to &quot;Product overview&quot;\">​</a></h3><p>Distance sensing can support obstacle detection, proximity feedback and spacing control. Read a value, evaluate a condition and trigger an appropriate action.</p><table tabindex=\"0\"><thead><tr><th>Item</th><th>Status</th></tr></thead><tbody><tr><td>Model / product photo</td><td>Awaiting client assets</td></tr><tr><td>Measurement range / accuracy</td><td>Awaiting specifications</td></tr><tr><td>Connector / protocol</td><td>Awaiting hardware details</td></tr><tr><td>EV3 / SPIKE compatibility</td><td>Driver and firmware verification required</td></tr><tr><td>Programming environment</td><td>Four demonstration learning paths</td></tr></tbody></table><h3 id=\"before-you-begin\" tabindex=\"-1\">Before you begin <a class=\"header-anchor\" href=\"#before-you-begin\" aria-label=\"Permalink to &quot;Before you begin&quot;\">​</a></h3><ol><li>Confirm your product version and controller. Follow the official wiring diagram.</li><li>Install the required programming environment and product driver.</li><li>Check raw readings before adding conditions or motor control.</li></ol><div class=\"tip custom-block\"><p class=\"custom-block-title\">Start with a reading</p><p>Begin by displaying a value. Confirm its units and stability before testing threshold logic. Wiring diagrams and driver links will be added when supplied.</p></div><h3 id=\"applications\" tabindex=\"-1\">Applications <a class=\"header-anchor\" href=\"#applications\" aria-label=\"Permalink to &quot;Applications&quot;\">​</a></h3><ul><li><strong>Obstacle detection</strong>: stop or turn when a reading is below a threshold.</li><li><strong>Proximity feedback</strong>: show a message or sound based on distance.</li><li><strong>Spacing control</strong>: use continuous readings as an input to your control logic.</li></ul><p><a href=\"/awrecker-sensors/en/\">Choose a learning path on the home page</a></p></div></div></main><!----><!--[--><!--]--></div></div></div><!--[--><!--]--></div></div><!----><!--[--><!--]--></div></div>\n    \n    \n  ", "/en/products/force.html": "\n    <div id=\"app\"><div class=\"Layout\" data-v-5d98c3a5><!--[--><!--]--><!--[--><span tabindex=\"-1\" data-v-0b0ada53></span><a href=\"#VPContent\" class=\"VPSkipLink visually-hidden\" data-v-0b0ada53>Skip to content</a><!--]--><!----><header class=\"VPNav\" data-v-5d98c3a5 data-v-ae24b3ad><div class=\"VPNavBar\" data-v-ae24b3ad data-v-6aa21345><div class=\"wrapper\" data-v-6aa21345><div class=\"container\" data-v-6aa21345><div class=\"title\" data-v-6aa21345><div class=\"VPNavBarTitle\" data-v-6aa21345 data-v-1168a8e4><a class=\"title\" href=\"/awrecker-sensors/en/\" data-v-1168a8e4><!--[--><!
